    // would hitch). Every GL pass is screen-space now, so the old +400px safety margin
    // was dead weight — and the cost of compositing a GL canvas scales with its pixel
    // count: at 4K, dropping the margin took the trees pass alone from 3.9 → 2.6 ms
    // on a GTX 1050 Ti. (Only reassigned on a real size change: assigning .width
    // reallocates the buffer even when the value is the same.)
    if (glGlow && (glGlow.canvas.width !== w || glGlow.canvas.height !== h)) {
        glGlow.canvas.width = w;
        glGlow.canvas.height = h;
    }

    rebuildGrid();          // sizes the (larger) world grid + worldPxW/H

    // ...the world-space layers are sized to the whole world.
    bgCanvas.width  = worldPxW;
    bgCanvas.height = worldPxH;
    // The 2D glow buffer is only used by the fallback path — on the GPU it's dead
    // weight (a whole world-sized canvas), so keep it 1×1 when the GL glow is live.
    if (glowGPU) { glowCanvas.width = 1; glowCanvas.height = 1; }
    else { glowCanvas.width = worldPxW; glowCanvas.height = worldPxH; }

    drawDirtBackground();   // draws the world floor into bgCanvas
    windStreaks = [];
}

function idx(x, y) { return y * cols + x; }

// ============================================================
// Ignition
// ============================================================
function igniteCell(i) {
    const s = grid[i];
    if (s === TREE) {
        grid[i] = BURN_TREE;
        burnTimer[i] = BURN_BASE * props.treeBurnDuration * (0.8 + Math.random() * 0.4);
        burnMax[i]   = burnTimer[i];   // remember full duration for the lifecycle curve
        fireHeat[i]  = 0;
        burningCount++;
        return true;
    } else if (s === GRASS) {
        grid[i] = BURN_GRASS;
        burnTimer[i] = BURN_BASE * props.grassBurnDuration * (0.8 + Math.random() * 0.4);
        burnMax[i]   = burnTimer[i];
        fireHeat[i]  = 0;
        burningCount++;
        return true;
    }
    return false;
}

function igniteAt(px, py, radius) {
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const cx = (px / cell) | 0;
    const cy = (py / cell) | 0;
    const r  = Math.max(1, radius | 0);
    let n = 0;
    for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
            if (dx*dx + dy*dy > r*r) continue;
            const nx = cx + dx, ny = cy + dy;
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
            if (igniteCell(idx(nx, ny))) n++;
        }
    }
    return n;
}

// Right-click rain burst — extinguish burning cells in a radius (→ steam + ash)
// and throw down a handful of rain drops for feedback.
function douseAt(px, py, radius) {
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const cx = (px / cell) | 0, cy = (py / cell) | 0, r = Math.max(2, radius | 0);
    for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
            if (dx * dx + dy * dy > r * r) continue;
            const nx = cx + dx, ny = cy + dy;
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
            const i = idx(nx, ny), s = grid[i];
            if (s !== BURN_GRASS && s !== BURN_TREE) continue;
            const isTree = s === BURN_TREE;
            grid[i] = isTree ? ASH_TREE : ASH_GRASS;
            burnTimer[i] = (isTree ? 660 : 480) + Math.random() * 460;
            burningCount--;
            markStaticDirty(i);
            if (isTree) treeContentDirty = 12;
            // A little hiss of steam where a flame is doused
            if (smokeParticles.length < MAX_SMOKE && Math.random() < 0.7) {
                spawnSmoke(nx * cell + cell * 0.5, ny * cell + cell * 0.5,
                    (Math.random() - 0.5) * 0.6, -1.0 - Math.random() * 0.7,
                    0.55, 4 + Math.random() * 4, 0.32, 212 + (Math.random() * 40 | 0));
            }
        }
    }
    // A focused little shower pouring DOWN onto the spot from above the cursor,
    // plus splash specks where it lands. Rate is modest so it can be called every
    // tick while the button is held (a sustained downpour) without flooding.
    const wxF = Math.cos(windAngle), spread = r * cell;
    const rainCap = (MAX_RAIN * qMul) | 0;
    const drops = 3 + r;
    for (let k = 0; k < drops && rainDrops.length < rainCap; k++) {
        rainDrops.push({
            x: px + (Math.random() - 0.5) * spread * 1.2,
            y: py - 45 - Math.random() * (spread * 2 + 70),     // start above, fall onto the spot
            vx: wxF * 2.0 * windNow + (Math.random() - 0.5) * 0.8,
            vy: 7 + Math.random() * 5,
            len: 7 + Math.random() * 7,
        });
    }
    // Splash droplets bouncing up off the ground at the cursor
    for (let k = 0; k < 2 && rainSplash.length < 200; k++) {
        rainSplash.push({
            x: px + (Math.random() - 0.5) * spread,
            y: py + (Math.random() - 0.5) * cell * 0.6,
            vx: (Math.random() - 0.5) * 2.6, vy: -(1.0 + Math.random() * 1.7), life: 1,
        });
    }
}

function randomSpark() {
    // Strike anywhere in the world (world pixel coordinates).
    for (let attempt = 0; attempt < 30; attempt++) {
        const x = Math.random() * worldPxW;
        const y = Math.random() * worldPxH;
        if (igniteAt(x, y, 1) > 0) {
            spawnLightning(x, y);
            rgbVignettePulse = 1.0;
            return;
        }
    }
}

// ============================================================
// Lightning bolts (jagged branching strikes when auto-ignite fires)
// ============================================================
function spawnLightning(targetX, targetY) {
    if (lightningBolts.length >= MAX_LIGHTNING) return;
    const startX = targetX + (Math.random() - 0.5) * 240;
    const startY = -20;
    const segs = 14 + ((Math.random() * 8) | 0);
    const points = [[startX, startY]];
    for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const lx = startX * (1 - t) + targetX * t;
        const ly = startY * (1 - t) + targetY * t;
        points.push([lx + (Math.random() - 0.5) * 36, ly + (Math.random() - 0.5) * 22]);
    }
    points.push([targetX, targetY]);

    // 1–3 branches breaking off mid-bolt
    const branches = [];
    const bn = 1 + ((Math.random() * 3) | 0);
    for (let b = 0; b < bn; b++) {
        const from = 2 + ((Math.random() * (segs - 4)) | 0);
        const [bx, by] = points[from];
        const ang = Math.random() * Math.PI * 2;
        const len = 30 + Math.random() * 80;
        const bsegs = 4 + ((Math.random() * 4) | 0);
        const bpts = [[bx, by]];
        for (let j = 1; j <= bsegs; j++) {
            const t = j / bsegs;
            bpts.push([
                bx + Math.cos(ang) * len * t + (Math.random() - 0.5) * 18,
                by + Math.sin(ang) * len * t + (Math.random() - 0.5) * 18,
            ]);
        }
        branches.push(bpts);
    }

    lightningBolts.push({ points, branches, life: 1.0, flash: 1.0, jitter: 0 });
    // Persistent afterglow column at strike point
    lightningGlows.push({ x: targetX, y: targetY, life: 1.0 });
}

function updateLightningGlows(dt) {
    if (!lightningGlows.length) return;
    let writeI = 0;
    for (let i = 0; i < lightningGlows.length; i++) {
        const g = lightningGlows[i];
        g.life -= 0.012 * dt;
        if (g.life > 0) lightningGlows[writeI++] = g;
    }
    lightningGlows.length = writeI;
}

function drawLightningGlows() {
    if (!lightningGlows.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    for (const g of lightningGlows) {
        const a = g.life;
        const grad = ctx.createRadialGradient(g.x, g.y, 8, g.x, g.y, 90 + a * 60);
        grad.addColorStop(0,   `rgba(220,235,255,${(a * 0.65).toFixed(3)})`);
        grad.addColorStop(1,   "rgba(150,180,255,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(g.x, g.y, 90 + a * 60, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function updateLightning(dt) {
    if (!lightningBolts.length) return;
    let writeI = 0;
    for (let i = 0; i < lightningBolts.length; i++) {
        const b = lightningBolts[i];
        b.life -= 0.07 * dt;
        b.flash *= damp(0.78, dt);
        b.jitter = (b.jitter + dt) % 8;
        if (b.life > 0) lightningBolts[writeI++] = b;
    }
    lightningBolts.length = writeI;
}

function drawLightning() {
    if (!lightningBolts.length) return;

    // Composite screen flash (sum of all bolts) — softened, and only the
    // full-screen wash is gated behind the Screen-effects toggle.
    if (props.screenEffects) {
        let maxFlash = 0;
        for (const b of lightningBolts) if (b.flash > maxFlash) maxFlash = b.flash;
        if (maxFlash > 0.05) {
            ctx.fillStyle = `rgba(255,240,225,${(maxFlash * 0.18).toFixed(3)})`;
            // drawn under the world translate, so offset to cover the visible screen
            ctx.fillRect(camX, camY, canvas.width, canvas.height);
        }
    }

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const b of lightningBolts) {
        const a = Math.max(0, Math.min(1, b.life));

        // Glow halo
        ctx.lineWidth = 6 + b.flash * 12;
        ctx.strokeStyle = `rgba(170,200,255,${(a * 0.35).toFixed(3)})`;
        ctx.beginPath();
        for (let i = 0; i < b.points.length; i++) {
            const [x, y] = b.points[i];
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Core bolt
        ctx.lineWidth = 2 + b.flash * 3;
        ctx.strokeStyle = `rgba(235,240,255,${a.toFixed(3)})`;
        ctx.beginPath();
        for (let i = 0; i < b.points.length; i++) {
            const [x, y] = b.points[i];
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Branches
        ctx.lineWidth = 1 + b.flash * 1.5;
        ctx.strokeStyle = `rgba(200,215,255,${(a * 0.75).toFixed(3)})`;
        for (const bp of b.branches) {
            ctx.beginPath();
            for (let i = 0; i < bp.length; i++) {
                const [x, y] = bp[i];
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    }
    ctx.restore();
}

// ============================================================
// Ambient drifting leaves (always present when wind is on)
// ============================================================
const LEAF_COLORS = [
    [ 85, 130,  35],   // green
    [105,  95,  28],   // yellow
    [130,  60,  20],   // orange
    [ 60,  90,  25],   // dark green
    [125,  85,  35],   // tan
];

// ============================================================
// Weather — auto-cycles modes or honors the user's choice
// ============================================================
// Smoothly-eased fire-spread multiplier (drought boosts, wet / fog damps). This used
// to read the stage LABEL, so it jumped the instant the label stepped.
function weatherFireMul() {
    return atmo.fireMul;
}
// Dryness 0..1 — peaks in drought, used for the warm/parched ambient tint. Eased: it
// used to be keyed to `weatherCurrent === DROUGHT`, so the tint snapped off the
// moment the stage left drought.
function weatherDryness() {
    return atmo.dry * (1 - weatherIntensitySmooth);
}

// The wet↔dry stage a mode asks for, or null for the auto-cycle. The new moods all
// sit on a dry sky (their look comes from the mood layer, not from rain).
function targetWeatherFromMode() {
    switch (props.weatherMode) {
        case "drought": return WEATHER_DROUGHT;
        case "clear":
        case "fog":
        case "windy":
        case "sunset":
        case "night":   return WEATHER_CLEAR;
        case "cloudy":  return WEATHER_CLOUDY;
        case "rain":    return WEATHER_RAIN;
        case "monsoon": return WEATHER_MONSOON;
        case "storm":   return WEATHER_STORM;
        default: return null; // auto
    }
}

// Ease `a` toward `t` at `rate` per base tick, independent of the render rate.
function easeTo(a, t, rate, dt) {
    return a + (t - a) * (1 - Math.pow(1 - Math.min(0.5, rate), dt));
}

// A mood level eases through TWO cascaded low-pass stages instead of one. A single
// exponential ease lurches at the start (full speed on the first tick) and only then
// settles; two in series give an S-curve — a mood begins gently, swells, then settles —
// which reads as a slow dawn rather than a fade being switched on.
function easeMood(key, target, rate, dt) {
    const raw = "_" + key;
    atmo[raw] = easeTo(atmo[raw], target, rate * 2, dt);
    atmo[key] = easeTo(atmo[key], atmo[raw], rate * 2, dt);
}

// The weather-aware wind. Cheap, so it's refreshed wherever it's read from outside the
// sim tick (render, the loop) — a slider change shows up on the very next frame.
function refreshWind() {
    windNow = props.windStrength * atmo.windMul;
}

// Auto-cycle: pick the next mood. Fog likes calm, damp skies; wind and sunset like
// dry ones; a sunset is far likelier right after rain (and earns the rainbow). Night
// is opt-in — a dark wallpaper is a bigger change than a drifting mist.
function pickMood() {
    const st = weatherTarget;
    const w = [
        1.1,                                                        // none — breathing room
        st <= WEATHER_CLOUDY ? 0.55 : 0.10,                         // fog
        st <= WEATHER_MONSOON ? 0.60 : 0.25,                        // windy
        (st <= WEATHER_CLEAR ? 0.45 : st === WEATHER_CLOUDY ? 0.20 : 0.06) + (atmo.recentRain > 0.4 ? 0.7 : 0),
        props.autoNight ? 0.7 : 0,                                  // night
    ];
    // Moods flow like a day rather than shuffling: sunrise comes through mist, dusk
    // follows sunset, and a night ends in dawn fog.
    if (moodTarget === MOOD_FOG)    w[MOOD_SUNSET] *= 1.8;
    if (moodTarget === MOOD_SUNSET) w[MOOD_NIGHT]  *= 3.0;
    if (moodTarget === MOOD_NIGHT)  w[MOOD_FOG]    *= 3.0;
    let sum = 0; for (let i = 0; i < w.length; i++) sum += w[i];
    let r = Math.random() * sum, pick = MOOD_NONE;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) { pick = i; break; } }
    return (pick === moodTarget && pick !== MOOD_NONE) ? MOOD_NONE : pick;   // never repeat a mood back-to-back
}

// Ease every atmosphere level toward its target and advance the drift. Runs once per
// sim tick from updateWeather(); all the rates scale with the Transition-speed slider.
function updateAtmosphere(dt, forced) {
    const sp = props.weatherChangeSpeed;
    // Which mood do we want? A forced mode names its own; auto follows the scheduler.
    let want;
    if (forced !== null) {
        want = MOOD_FOR_MODE[props.weatherMode] || MOOD_NONE;
        moodTarget = want;
        moodTimer = 600;                       // when auto resumes, don't change the instant it does
    } else {
        moodTimer -= sp * dt;
        if (moodTimer <= 0) {
            moodTarget = pickMood();
            moodTimer = moodTarget === MOOD_NONE ? 1200 + Math.random() * 2400 : 2400 + Math.random() * 3600;
        }
        want = moodTarget;
    }
    const m = weatherIntensitySmooth;
    const tFog   = want === MOOD_FOG    ? Math.max(0, 1 - 0.6 * m) : 0;   // rain thins the mist
    const tGale  = want === MOOD_WINDY  ? 1 : 0;
    const tGold  = want === MOOD_SUNSET ? 1 - 0.5 * m : 0;
    const tNight = want === MOOD_NIGHT  ? 1 : 0;
    easeMood("fog",   tFog,   0.0022 * sp, dt);
    easeMood("gale",  tGale,  0.0030 * sp, dt);
    easeMood("gold",  tGold,  0.0018 * sp, dt);
    easeMood("night", tNight, 0.0014 * sp, dt);   // the slowest: dusk takes a while
    atmo.dry   = easeTo(atmo.dry,   weatherTarget === WEATHER_DROUGHT ? 1 : 0, 0.0040 * sp, dt);

    // Wind: the stage's wind, stilled by fog, whipped up by a windy mood, calmer at night.
    const tWind = WEATHER_WIND_MUL[weatherTarget] * (1 - 0.55 * atmo.fog) * (1 - 0.15 * atmo.night) + 1.0 * atmo.gale;
    atmo.windMul = easeTo(atmo.windMul, tWind, 0.0020 * sp, dt);
    refreshWind();

    // Fire: the stage's multiplier, damped further in fog; eased so it glides.
    const tFire = WEATHER_FIRE_MUL[weatherTarget] * (1 - 0.15 * atmo.fog) * (1 + 0.05 * atmo.gold) * (1 - 0.05 * atmo.night);
    atmo.fireMul = easeTo(atmo.fireMul, tFire, 0.0016 * sp, dt);

    // Cloud cover → how dark the drifting cloud shadows are. Continuous.
    const cover = 0.10 + 0.95 * m + 0.25 * atmo.gale + 0.35 * atmo.fog - 0.20 * atmo.gold - 0.10 * atmo.dry;
    atmo.cover = cover < 0 ? 0 : cover > 1 ? 1 : cover;

    // A rainbow follows a storm that has JUST cleared: it appears once the rain thins
    // out while the memory of it (recentRain, decaying over ~1–2 min) is still fresh.
    // The memory of rain fades slowly while it's still damp (so a drizzle doesn't forget
    // the storm before the sky clears), then faster once dry — a rainbow lasts ~1–2 min after a real storm, less after a shower.
    atmo.recentRain = Math.max(atmo.recentRain - (m < 0.12 ? 0.00018 : 0.0001) * sp * dt, m);
    const snowy = seasonParam && seasonParam.snow > 0.2;
    const tRainbow = (m < 0.12 && atmo.recentRain > 0.3 && atmo.night < 0.3 && atmo.fog < 0.4 && !snowy)
        ? smooth01((atmo.recentRain - 0.28) / 0.32) * (1 - 0.4 * atmo.cover) : 0;
    atmo.rainbow = easeTo(atmo.rainbow, tRainbow, tRainbow > atmo.rainbow ? 0.0040 * sp : 0.0030 * sp, dt);

    // Cloud / mist drift, with the wind. (world px per base tick)
    const dr = (0.18 + 0.25 * windNow) * dt;
    atmo.driftX += Math.cos(windAngle) * dr;
    atmo.driftY += Math.sin(windAngle) * dr;

    updateRipples(dt);
    updateWisps(dt);
    updateShootingStar(dt);
}

// Mist rising off the ponds in fog: big pale puffs that swell in, drift on the wind and
// thin out. Spawned over visible water; each lives ~15–30 s.
function updateWisps(dt) {
    const fog = atmo.fog;
    if (fog > 0.08 && qMul >= 0.5) {
        const cap = (80 * qMul * fog) | 0;
        const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
        const vw = canvas.width / viewZoom, vh = canvas.height / viewZoom;
        let want = 0.5 * fog * dt; want = (want | 0) + (Math.random() < want % 1 ? 1 : 0);
        for (let tries = 0; want > 0 && tries < 8 && wisps.length < cap; tries++) {
            const x = camX + Math.random() * vw, y = camY + Math.random() * vh;
            const cx = (x / cell) | 0, cy = (y / cell) | 0;
            if (cx < 0 || cx >= cols || cy < 0 || cy >= rows || grid[cy * cols + cx] !== WATER) continue;
            wisps.push({ x, y, vx: (Math.random() - 0.5) * 0.05, vy: -0.02 - Math.random() * 0.05,
                         size: cell * (1.6 + Math.random() * 2.2), age: 0, life: 450 + Math.random() * 450 });
            want--;
        }
    }
    const wx = Math.cos(windAngle) * windNow * 0.10, wy = Math.sin(windAngle) * windNow * 0.10;
    let w = 0;
    for (let i = 0; i < wisps.length; i++) {
        const p = wisps[i];
        rememberPos(p);
        p.age += dt; p.x += (p.vx + wx) * dt; p.y += (p.vy + wy) * dt;
        p.size += 0.006 * dt;
        if (p.age < p.life) wisps[w++] = p;
    }
    wisps.length = w;
}

// A meteor, now and then, on a clear night. Positions are fractions of the screen.
function updateShootingStar(dt) {
    if (shootingStar) {
        const s = shootingStar;
        s.x += s.vx * dt; s.y += s.vy * dt; s.age += dt;
        if (s.age > s.life) shootingStar = null;
    } else if (atmo.night > 0.6 && weatherIntensitySmooth < 0.1 && Math.random() < dt / 1100) {
        const ang = 0.35 + Math.random() * 0.5, sp = 0.020 + Math.random() * 0.008;   // screen-fractions per tick
        const dir = Math.random() < 0.5 ? 1 : -1;
        shootingStar = { x: dir > 0 ? 0.05 + Math.random() * 0.4 : 0.55 + Math.random() * 0.4, y: Math.random() * 0.35,
                         vx: dir * Math.cos(ang) * sp, vy: Math.sin(ang) * sp, age: 0, life: 24 };
    }
}

// Anything fading or pending that the sim must keep ticking even when nothing else is
// moving — otherwise a mood would freeze half-faded the moment you switch to Clear.
function atmoBusy() {
    return atmo.fog > 0.004 || atmo.gale > 0.004 || atmo.gold > 0.004 || atmo.night > 0.004 ||
           atmo.rainbow > 0.004 || ripples.length > 0 || wisps.length > 0 || shootingStar !== null ||
           moodTarget !== MOOD_NONE;
}

// Rain rings spreading on the ponds — the single most "alive" thing rain can do to
// still water. Spawned on visible water cells; each ring lives ~1.5 s.
function updateRipples(dt) {
    const m = weatherIntensitySmooth;
    if (m > 0.10 && weatherFrontProgress > 0.2 && props.rainIntensity > 0 && qMul >= 0.5) {
        const cap = (170 * qMul) | 0;
        const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
        const vw = canvas.width / viewZoom, vh = canvas.height / viewZoom;
        let tries = 0, want = 1.6 * m * Math.min(2, props.rainIntensity) * dt;
        want = (want | 0) + (Math.random() < want % 1 ? 1 : 0);
        while (want > 0 && tries++ < 10 && ripples.length < cap) {
            const x = camX + Math.random() * vw, y = camY + Math.random() * vh;
            const cx = (x / cell) | 0, cy = (y / cell) | 0;
            if (cx < 0 || cx >= cols || cy < 0 || cy >= rows || grid[cy * cols + cx] !== WATER) continue;
            ripples.push({ x, y, age: 0, spd: 0.020 + Math.random() * 0.010, amp: 0.6 + Math.random() * 0.4 });
            want--;
        }
    }
    let w = 0;
    for (let i = 0; i < ripples.length; i++) {
        const r = ripples[i];
        r.age += r.spd * dt;
        if (r.age < 1) ripples[w++] = r;
    }
    ripples.length = w;
}

// Advance the year wheel. Auto mode drifts continuously; a forced season eases
// toward its slot along the shortest path so manual changes still transition.
function updateSeason(dt) {
    if (props.season === "auto") {
        const yearSec = Math.max(32, props.seasonLength * 4);
        seasonPos += (4 / (yearSec * SIM_BASE_HZ)) * dt;
        if (seasonPos >= 4) seasonPos -= 4;
    } else {
        const target = (SEASON_IDX[props.season] != null) ? SEASON_IDX[props.season] : 1;
        let d = target - seasonPos;
        if (d > 2) d -= 4; else if (d < -2) d += 4;           // shortest wrapped path
        const step = (0.5 / SIM_BASE_HZ) * dt;                // ~0.5 season-units / sec
        if (Math.abs(d) <= step) seasonPos = target;
        else seasonPos += Math.sign(d) * step;
        if (seasonPos >= 4) seasonPos -= 4; else if (seasonPos < 0) seasonPos += 4;
    }
    computeSeasonParams();
}

// Interpolate the look of the current moment between its two bracketing seasons.
function computeSeasonParams() {
    const p0 = Math.floor(seasonPos) % 4;
    const p1 = (p0 + 1) % 4;
    const fRaw = seasonPos - Math.floor(seasonPos);
    // Dwell: hold each season at its FULL look for the first stretch of its slot,
    // then blend to the next over the tail. Without this the auto-cycle is a
    // permanent half-blend and "pure" spring/autumn/etc. never actually shows.
    const HOLD = 0.55;
    let f = fRaw <= HOLD ? 0 : (fRaw - HOLD) / (1 - HOLD);
    f = f * f * (3 - 2 * f);     // smoothstep the transition
    const A = SEASON_KF[p0], B = SEASON_KF[p1];
    const s = seasonParam || (seasonParam = {});
    s.tr = lerpN(A.tr, B.tr, f); s.tg = lerpN(A.tg, B.tg, f); s.tb = lerpN(A.tb, B.tb, f);
    s.ta = lerpN(A.ta, B.ta, f);
    s.desat  = lerpN(A.desat, B.desat, f);
    s.snow   = lerpN(A.snow, B.snow, f) * Math.max(0, Math.min(1.5, props.snowAmount));
    s.ice    = lerpN(A.ice, B.ice, f);
    s.leaf   = lerpN(A.leaf, B.leaf, f);
    s.bright = lerpN(A.bright, B.bright, f);
    s.fireMul = lerpN(A.fireMul, B.fireMul, f);
    s.life    = lerpN(A.life, B.life, f);
    s.blossom = lerpN(A.blossom, B.blossom, f);
    s.mode   = (A.ta >= B.ta) ? A.mode : B.mode;
    const l0 = A.leafTint, l1 = B.leafTint;
    if (l0 && l1)      s.leafTint = [lerpN(l0[0], l1[0], f), lerpN(l0[1], l1[1], f), lerpN(l0[2], l1[2], f)];
    else if (l0 && f < 0.5) s.leafTint = l0;
    else if (l1 && f >= 0.5) s.leafTint = l1;
    else s.leafTint = null;
    return s;
}

// Falling snow — screen-space drifting flakes (decoupled from the camera, like an
// atmospheric overlay). Count scales with the current snow intensity.
function updateSnow(dt) {
    const sp = seasonParam ? seasonParam.snow : 0;
    if (sp <= 0.03) { if (snowFlakes.length) snowFlakes.length = 0; return; }
    const cap = (MAX_SNOW * qMul) | 0;
    const target = (cap * Math.min(1, sp)) | 0;
    let toSpawn = Math.min(7, target - snowFlakes.length);
    while (toSpawn-- > 0 && snowFlakes.length < cap) {
        snowFlakes.push({
            x: Math.random() * canvas.width,
            y: -5 - Math.random() * 30,
            vx: (Math.random() - 0.5) * 0.3,
            vy: 0.6 + Math.random() * 0.9,
            size: 0.8 + Math.random() * 1.7,
            sway: Math.random() * 6.28,
            swaySpd: 0.02 + Math.random() * 0.05,
            depth: 0.5 + Math.random() * 0.5,
        });
    }
    const wxF = Math.cos(windAngle) * windNow;
    const W = canvas.width, H = canvas.height;
    let wI = 0;
    for (let i = 0; i < snowFlakes.length; i++) {
        const p = snowFlakes[i];
        p.sway += p.swaySpd * dt;
        p.x += (p.vx + wxF * 0.5 + Math.sin(p.sway) * 0.5) * dt;
        p.y += (p.vy * (0.7 + p.depth)) * dt;
        if (p.x < -10) p.x += W + 20; else if (p.x > W + 10) p.x -= W + 20;
        if (p.y < H + 12) snowFlakes[wI++] = p;
    }
    snowFlakes.length = wI;
}

// Cached speckle texture that adds subtle sparkle/texture to the snow blanket.
function buildSnowPattern() {
    const t = document.createElement("canvas");
    t.width = 96; t.height = 96;
    const c = t.getContext("2d");
    for (let k = 0; k < 220; k++) {
        const a = Math.random();
        c.fillStyle = a < 0.5 ? `rgba(255,255,255,${(0.15 + Math.random() * 0.3).toFixed(2)})`
                              : `rgba(196,210,232,${(0.10 + Math.random() * 0.2).toFixed(2)})`;
        c.fillRect((Math.random() * 96) | 0, (Math.random() * 96) | 0, 1, 1);
    }
    snowPattern = ctx.createPattern(t, "repeat");
}

function updateWeather(dt) {
    const forced = targetWeatherFromMode();
    if (forced !== null) {
        weatherTarget = forced;
    } else {
        // Auto-cycle: random-walk one step along the spectrum so changes are
        // gradual and sensible (never jumps sunny → storm). Mild mean-reversion
        // toward the middle keeps it from parking at an extreme.
        weatherTimer -= props.weatherChangeSpeed * dt;
        if (weatherTimer <= 0 && weatherCurrent === weatherTarget) {
            // Mean-reversion anchor: between clear and cloudy, not the dead centre of the
            // spectrum (which is light rain) — a wallpaper you live with should be sunny
            // more often than it's wet, with the odd storm rolling through.
            const mid = 1.9;
            const towardMid = weatherTarget < mid ? 0.62 : (weatherTarget > mid ? 0.38 : 0.5);
            let step = Math.random() < towardMid ? 1 : -1;
            weatherTarget = Math.max(0, Math.min(WEATHER_COUNT - 1, weatherTarget + step));
            weatherTimer = 900 + Math.random() * 2200;
        }
    }

    // Step current toward target one stage at a time, easing the blend each stage
    if (weatherCurrent !== weatherTarget) {
        weatherBlend -= (forced !== null ? 0.010 : 0.007) * props.weatherChangeSpeed * dt;
        if (weatherBlend <= 0) {
            weatherCurrent += (weatherTarget > weatherCurrent ? 1 : -1); // one stage at a time
            weatherBlend = 1.0;
        }
    }

    // Smooth moisture toward the target mode, not just the stage label.
    // This lets forced Storm/Rain begin as a light scattered front and escalate
    // gradually while weatherCurrent still walks through the intermediate modes.
    // Rain builds slowly (a drizzle that deepens over a minute or so) and thins faster.
    const targetIntensity = WEATHER_MOISTURE[weatherTarget];
    const intensityStep   = 0.0012 * props.weatherChangeSpeed * dt;
    if (weatherIntensitySmooth < targetIntensity) {
        weatherIntensitySmooth = Math.min(targetIntensity, weatherIntensitySmooth + intensityStep);
    } else if (weatherIntensitySmooth > targetIntensity) {
        weatherIntensitySmooth = Math.max(targetIntensity, weatherIntensitySmooth - intensityStep * 1.6);
    }

    // Front progress — advances when weather is (heading) wet, recedes when drying.
    const wantsFront    = WEATHER_MOISTURE[weatherTarget] > 0.10
                       || weatherIntensitySmooth > 0.10;
    const frontStep     = 0.0032 * props.weatherChangeSpeed * dt;
    const targetFront   = wantsFront ? 1.0 : 0.0;
    if (weatherFrontProgress < targetFront) {
        weatherFrontProgress = Math.min(1.0, weatherFrontProgress + frontStep);
    } else if (weatherFrontProgress > targetFront) {
        weatherFrontProgress = Math.max(0.0, weatherFrontProgress - frontStep);
    }

    updateAtmosphere(dt, forced);
}

function smooth01(t) {
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
}

function damp(base, dt) {
    return Math.pow(base, dt);
}

function rememberPos(p) {
    p.px = p.x;
    p.py = p.y;
}

function drawX(p) {
    return p.px === undefined ? p.x : p.px + (p.x - p.px) * simAlpha;
}

function drawY(p) {
    return p.py === undefined ? p.y : p.py + (p.y - p.py) * simAlpha;
}

function weatherFrontAmount(px, py) {
    if (weatherFrontProgress <= 0) return 0;
    const w = worldPxW, h = worldPxH;
    const fx = px / w;
    const fy = py / h;
    const feather = 0.16;
    let distanceInside;
    switch (props.weatherDirection) {
        case "rightToLeft":  distanceInside = fx - (1 - weatherFrontProgress); break;
        case "topToBottom":  distanceInside = weatherFrontProgress - fy; break;
        case "bottomToTop":  distanceInside = fy - (1 - weatherFrontProgress); break;
        case "static":       distanceInside = 1; break;
        case "leftToRight":
        default:             distanceInside = weatherFrontProgress - fx; break;
    }
    if (distanceInside <= 0) return 0;

    const frontSoftness = props.weatherDirection === "static"
        ? 1
        : smooth01(distanceInside / feather);
    const scatter = Math.max(0, Math.min(1, props.rainScatter));
    if (scatter <= 0.01) return frontSoftness;

    const driftX = simClock * 0.004 * Math.cos(windAngle);
    const driftY = simClock * 0.004 * Math.sin(windAngle);
    const patch = fbm(px * 0.006 + driftX, py * 0.006 + driftY, terrainSeed + 931, 3);
    const patchFactor = 1 - scatter + scatter * smooth01((patch - 0.24) / 0.56);
    return frontSoftness * patchFactor;
}

// Where new rain particles should spawn — returns (xFrac, yFrac) in 0..1
function weatherFrontSpawn() {
    const w = worldPxW, h = worldPxH;
    for (let tries = 0; tries < 24; tries++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const amount = weatherFrontAmount(x, y);
        if (amount > 0.05 && Math.random() < amount) return [x, y, amount];
    }
    switch (props.weatherDirection) {
        case "rightToLeft":  return [w * (1 - weatherFrontProgress * Math.random()), Math.random() * h, 0.5];
        case "topToBottom":  return [Math.random() * w, h * weatherFrontProgress * Math.random(), 0.5];
        case "bottomToTop":  return [Math.random() * w, h * (1 - weatherFrontProgress * Math.random()), 0.5];
        case "static":       return [Math.random() * w, Math.random() * h, 0.7];
        case "leftToRight":
        default:             return [w * weatherFrontProgress * Math.random(), Math.random() * h, 0.5];
    }
}

// ============================================================
// Rain — falling streaks influenced by wind; can extinguish fires
// ============================================================
function updateRain(dt) {
    // Use smoothed intensity so escalation is gradual
    const intensity = weatherIntensitySmooth;
    const isWet = intensity > 0.05 && weatherFrontProgress > 0.01;

    if (isWet && props.rainIntensity > 0) {
        const wxF = Math.cos(windAngle);
        const wyF = Math.sin(windAngle);
        const rainSpawnFloat = Math.min(60, 18 * intensity * props.rainIntensity + 8 * intensity * intensity) * dt;
        const rainSpawn = (rainSpawnFloat | 0) + (Math.random() < (rainSpawnFloat % 1) ? 1 : 0);
        const rainCap = (MAX_RAIN * qMul) | 0;
        for (let n = 0; n < rainSpawn; n++) {
            if (rainDrops.length >= rainCap) break;
            // Spawn position constrained to the advancing, patchy front.
            const [sx, sy, localAmount] = weatherFrontSpawn();
            rainDrops.push({
                x: sx,
                y: sy - 18 - Math.random() * 32,
                vx: wxF * 2.0 * windNow + (Math.random() - 0.5) * 0.75,
                vy: 7 + Math.random() * 4 + intensity * 3,
                len: (5 + Math.random() * 6 + intensity * 4) * (0.75 + localAmount * 0.5),
            });
        }

        // Occasionally extinguish a burning cell
        if (props.rainExtinguishes && burningCount > 0) {
            const tries = Math.ceil(intensity * 3);
            const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
            for (let t = 0; t < tries; t++) {
                if (Math.random() < intensity * 0.6 * dt) {
                    // Find a random burning cell and extinguish it
                    const sampleStart = (Math.random() * grid.length) | 0;
                    for (let k = 0; k < 200; k++) {
                        const i = (sampleStart + k) % grid.length;
                        if (grid[i] === BURN_GRASS || grid[i] === BURN_TREE) {
                            const py = ((i / cols) | 0) * cell + cell * 0.5;
                            const px = (i % cols) * cell + cell * 0.5;
                            if (weatherFrontAmount(px, py) < Math.random() * 0.85) continue;
                            const isTree = grid[i] === BURN_TREE;
                            grid[i] = isTree ? ASH_TREE : ASH_GRASS;
                            burnTimer[i] = (isTree ? 660 : 480) + Math.random() * 460;
                            burningCount--;
                            markStaticDirty(i);
                            if (isTree) treeContentDirty = 12;    // tree vanished → fast banded refresh (no full-rebuild spike)
                            // Steam puff (light, wispy)
                            if (smokeParticles.length < MAX_SMOKE) {
                                spawnSmoke(px, py, 0, -1.0, 0.5, 5, 0.3,
                                    205 + (Math.random() * 35 | 0),
                                    Math.random() * 6.28, 0.06);
                            }
                            break;
                        }
                    }
                }
            }
        }
    }

    // Physics + cull (in-place)
    if (rainDrops.length) {
        const maxY = worldPxH + 20;
        const minX = -50;
        const maxX = worldPxW + 50;
        let writeI = 0;
        for (let i = 0; i < rainDrops.length; i++) {
            const r = rainDrops[i];
            rememberPos(r);
            r.x += r.vx * dt;
            r.y += r.vy * dt;
            if (r.y < maxY && r.x > minX && r.x < maxX) {
                rainDrops[writeI++] = r;
            }
        }
        rainDrops.length = writeI;
    }
    // Splash droplets — small arcs that pop up and fall back (gravity), fading out
    if (rainSplash.length) {
        let writeI = 0;
        for (let i = 0; i < rainSplash.length; i++) {
            const p = rainSplash[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 0.26 * dt;            // gravity
            p.life -= 0.06 * dt;
            if (p.life > 0) rainSplash[writeI++] = p;
        }
        rainSplash.length = writeI;
    }
}

// ============================================================
// Birds (flocks crossing the screen periodically)
// ============================================================
function spawnBirdFlock() {
    const w = worldPxW, h = worldPxH;
    const side = (Math.random() * 4) | 0;
    const angle = Math.random() * 0.6 - 0.3; // mostly horizontal
    const speed = 1.4 + Math.random() * 1.0;
    let bx, by, vx, vy;
    if (side === 0)      { bx = -30; by = Math.random() * h; vx =  speed * Math.cos(angle); vy = speed * Math.sin(angle); }
    else if (side === 1) { bx = w + 30; by = Math.random() * h; vx = -speed * Math.cos(angle); vy = speed * Math.sin(angle); }
    else if (side === 2) { bx = Math.random() * w; by = -30; vx = speed * Math.sin(angle); vy =  speed * Math.cos(angle); }
    else                 { bx = Math.random() * w; by = h + 30; vx = speed * Math.sin(angle); vy = -speed * Math.cos(angle); }

    // 4–9 birds per flock with V-formation jitter
    const count = 4 + ((Math.random() * 6) | 0);
    for (let i = 0; i < count; i++) {
        // V-formation: leader at front, others trail behind on both sides
        const lag = i * 14;
        const lateral = ((i % 2) ? 1 : -1) * Math.ceil(i / 2) * 10;
        const px = bx - (vx / speed) * lag + (-vy / speed) * lateral;
        const py = by - (vy / speed) * lag + ( vx / speed) * lateral;
        birds.push({
            x: px, y: py,
            vx: vx + (Math.random() - 0.5) * 0.1,
            vy: vy + (Math.random() - 0.5) * 0.1,
            flap: Math.random() * Math.PI * 2,
            flapSpd: 0.40 + Math.random() * 0.22,   // smaller birds beat a touch faster
            size: 1.6 + Math.random() * 0.6,
        });
    }
}

// ============================================================
// Fireflies (subtle glowing drifters — atmosphere)
// ============================================================
function spawnFirefly() {
    fireflies.push({
        x: Math.random() * worldPxW,
        y: Math.random() * worldPxH,
        vx: (Math.random() - 0.5) * 0.30,
        vy: (Math.random() - 0.5) * 0.30,
        phase: Math.random() * Math.PI * 2,
        phaseSpd: 0.04 + Math.random() * 0.03,
        size: 1.3 + Math.random() * 0.6,
        life: 0.85 + Math.random() * 0.15,
    });
}

function spawnLeaf() {
    const w = worldPxW, h = worldPxH;
    const wxF = Math.cos(windAngle);
    const wyF = Math.sin(windAngle);
    let x, y;
    if (Math.abs(wxF) > Math.abs(wyF)) {
        x = wxF > 0 ? -10 : w + 10;
        y = Math.random() * h;
    } else {
        y = wyF > 0 ? -10 : h + 10;
        x = Math.random() * w;
    }
    // Seasonal tint overrides the default palette (gold/red in autumn, soft pink
    // blossom in spring); summer keeps the natural mixed-green palette.
    let color;
    if (seasonParam && seasonParam.leafTint) {
        const t = seasonParam.leafTint, j = 0.85 + Math.random() * 0.3;
        color = [Math.min(255, t[0] * j) | 0, Math.min(255, t[1] * j) | 0, Math.min(255, t[2] * j) | 0];
    } else {
        color = LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0];
    }
    // In a gale, some of what the wind carries is pale dandelion-seed fluff, not leaves:
    // smaller, whiter, and it travels faster.
    let size = 1.2 + Math.random() * 1.6, speed = 1;
    if (atmo.gale > 0.25 && Math.random() < 0.40 * atmo.gale) {
        color = [250, 248, 236]; size = 0.8 + Math.random() * 0.9; speed = 1.5;
    }
    leaves.push({
        x, y,
        vx: wxF * (0.7 + Math.random() * 1.0) * speed,
        vy: wyF * (0.7 + Math.random() * 1.0) * speed,
        size,
        rot: Math.random() * Math.PI * 2,
        rotSpd: (Math.random() - 0.5) * 0.12,
        life: 1.0,
        color,
        css: `rgb(${color[0]},${color[1]},${color[2]})`,   // built once, not per frame
    });
}

// ============================================================
// Simulation update
// ============================================================
function update(dt = SIM_DT) {
    simClock += dt;
    // Hold-to-pour — keep igniting at the cursor while the button is held (not just
    // on move), so holding still pours a growing fire.
    if (mouseDown && props.holdToPour && props.mouseInteraction && mouseInside) {
        igniteAt(camX + mouseX / viewZoom, camY + mouseY / viewZoom, props.igniteRadius);
    }
    // Hold right-button → a sustained rain shower on the spot (douses fire).
    if (rightDown && props.rightClickDouse && props.mouseInteraction && mouseInside) {
        douseAt(camX + mouseX / viewZoom, camY + mouseY / viewZoom, Math.max(3, props.igniteRadius + 2));
    }
    // Wind — base + gust burst, audio bass also nudges strength briefly
    windAngle += 0.003 * props.windRotation * dt;
    const effectiveWind = windNow + gustStrength + (props.audioReactive ? audioBass * 0.6 : 0);
    const wxF = Math.cos(windAngle);
    const wyF = Math.sin(windAngle);
    const wMag = 0.020 * effectiveWind;
    const wxN = wxF * wMag;
    const wyN = wyF * wMag;

    // Fire spread responds to weather (drought fans, wet damps) AND season — a
    // snow-covered winter forest barely catches; high summer is a tinderbox.
    // (No global cap — the high spread gate + slower base rate make fires build
    // gradually and burn out organically.)
    const fireMul = weatherFireMul() * (seasonParam ? seasonParam.fireMul : 1);
    const sg = BASE_SPREAD_GRASS * props.spreadRate * fireMul;
    const st = BASE_SPREAD_TREE  * props.spreadRate * fireMul;

    // Random sparks (lightning strikes / dry-heat ignitions)
    // Rate is per-weather: storm peaks, monsoon moderate, drought low but nonzero.
    if (props.autoIgnite) {
        let chance = (1 / (10 * 60)) * props.autoIgniteRate;
        // Self-limiting: the more of the forest is already ablaze, the rarer new
        // strikes become. This is a negative feedback that holds the forest at a
        // healthy dynamic equilibrium (occasional fires over a mostly-green map)
        // for hours, instead of auto-ignite slowly charring everything.
        const burnFrac = burningCount / Math.max(1, grid.length);
        const sup = burnFrac * 320;
        chance /= (1 + sup * sup);
        const wetStormRamp = Math.max(0, Math.min(1, weatherIntensitySmooth));
        // `|| 0` (NOT `|| 1`): a legit 0 (dry/clear/cloudy = no lightning) must stay 0,
        // and the only falsy array value IS 0, so `0 || 0 === 0` is correct. (Avoids the
        // `??` operator for compatibility with older Wallpaper Engine CEF builds.)
        const targetLightning = WEATHER_LIGHTNING[weatherTarget] || 0;
        const currentLightning = WEATHER_LIGHTNING[weatherCurrent] || 0;
        chance *= currentLightning + (targetLightning - currentLightning) * wetStormRamp;
        if (chance > 0 && Math.random() < chance * dt) randomSpark();
    }

    // Collect currently-burning cells so spread uses current state. Into a reused
    // typed buffer (no per-tick array + growth), and no grid scan at all when nothing
    // burns — burningCount is exact, since igniteCell is the only way into a burning
    // state and every exit decrements it.
    if (burnList.length < grid.length) burnList = new Int32Array(grid.length);
    let nBurn = 0;
    if (burningCount > 0) {
        for (let i = 0, n = grid.length; i < n; i++) {
            const s = grid[i];
            if (s === BURN_GRASS || s === BURN_TREE) burnList[nBurn++] = i;
        }
    }

    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);

    // Per-tick constants for the hot loop below: flat neighbour offsets + downwind
    // spread bonus (no nested-array loads, idx() calls or per-neighbour wind maths),
    // the heat-smoothing factor (was a Math.pow per burning cell), and the toggles +
    // particle caps (read once instead of per cell). Caps stay un-truncated floats so
    // every comparison is exactly what it was.
    for (let d = 0; d < 8; d++) {
        const ndx = NEIGHBOURS[d][0], ndy = NEIGHBOURS[d][1];
        NB_OFF[d] = ndy * cols + ndx;
        const wb = ndx * wxN + ndy * wyN;
        NB_WIND[d] = wb > 0 ? wb : 0;
    }
    const heatK = 1 - damp(0.75, dt);
    const showSmoke = props.showSmoke, showEmbers = props.showEmbers, showPlumes = props.showFlamePlumes;
    const smokeCap = MAX_SMOKE * qMul, emberCap = MAX_EMBERS * qMul;
    const sparkCap = MAX_SPARKS * qMul, plumeCap = MAX_PLUMES * qMul;
    const colsM1 = cols - 1, rowsM1 = rows - 1;

    for (let k = 0; k < nBurn; k++) {
        const i = burnList[k];
        burnTimer[i] -= dt;

        const isTree = grid[i] === BURN_TREE;

        if (burnTimer[i] <= 0) {
            grid[i] = isTree ? ASH_TREE : ASH_GRASS;
            burnTimer[i] = (isTree ? 660 : 480) + Math.random() * 460;  // short smoulder phase
            fireHeat[i] = 0;
            burningCount--;
            markStaticDirty(i); // grass tuft → ash patch baked
            if (isTree) treeContentDirty = 12;    // tree vanished → fast banded refresh (no full-rebuild spike)
            continue;
        }

        const y = (i / cols) | 0;
        const x = i - y * cols;

        // --- Lifecycle: smolder → grow → blaze → die ---
        const age = burnMax[i] > 0 ? (1 - burnTimer[i] / burnMax[i]) : 0;
        const intensity = burnIntensity(age);
        // Spread gate: a cell only catches its neighbours once it's a fully
        // established, roaring flame (intensity > 0.72) — a fire has to BUILD before
        // it spreads. This makes fires creep gradually and naturally peter out
        // (no global cap needed) and reads as a slow, watchable burn.
        const spreadGate = Math.max(0, (intensity - 0.72)) / 0.28; // 0 until intensity>0.72 → 1

        // --- Count burning neighbours (clustering "blaze" heat) + fresh-fuel
        //     neighbours (the advancing front) + spread ---
        // Interior cells (the vast majority) use the flat offsets with no bounds
        // checks; only edge cells take the checked path. Same neighbour order and the
        // same random draws as before, so spread behaves identically.
        let burningNeighbors = 0, fuelNeighbors = 0;
        const interior = x > 0 && x < colsM1 && y > 0 && y < rowsM1;
        for (let d = 0; d < 8; d++) {
            let ni;
            if (interior) ni = i + NB_OFF[d];
            else {
                const nx = x + NEIGHBOURS[d][0], ny = y + NEIGHBOURS[d][1];
                if (nx < 0 || nx > colsM1 || ny < 0 || ny > rowsM1) continue;
                ni = ny * cols + nx;
            }
            const ns = grid[ni];
            if (ns === BURN_TREE || ns === BURN_GRASS) { burningNeighbors++; continue; }
            let spread;
            if (ns === GRASS)      spread = sg;
            else if (ns === TREE)  spread = st;
            else continue;
            fuelNeighbors++;
            if (spreadGate <= 0) continue;
            const chance = (spread + NB_WIND[d]) * spreadGate;
            if (chance > 0 && Math.random() < chance * dt) igniteCell(ni);
        }

        // Heat 0..1 from neighbour density, smoothed toward the new value so a
        // packed blaze ramps up its glow rather than snapping.
        const heatTarget = burningNeighbors / 8;
        fireHeat[i] += (heatTarget - fireHeat[i]) * heatK;
        const heat = fireHeat[i];

        // Effective output scales with how big the flame currently is (intensity)
        // plus a conflagration bonus when surrounded by other fire (heat).
        const output = intensity * (1 + heat * 0.6);

        // Smoke — little while smoldering, billowing at blaze peak
        if (showSmoke && smokeParticles.length < smokeCap) {
            const smokeChance = (isTree ? 0.11 : 0.05) * output;
            if (Math.random() < smokeChance * dt) {
                const sMag = 0.7 * windNow;
                // Darker at the base — fresh smoke is sooty and lightens as it rises
                // (the render lightens it with age).
                const shade = isTree
                    ? (58 + Math.random() * 64) | 0
                    : (104 + Math.random() * 64) | 0;
                spawnSmoke(
                    x * cell + cell * 0.5 + (Math.random() - 0.5) * cell,
                    y * cell + cell * 0.5 + (Math.random() - 0.5) * cell,
                    wxF * sMag + (Math.random() - 0.5) * 0.4,
                    wyF * sMag + (Math.random() - 0.5) * 0.4,
                    isTree ? 1.0 : 0.55,
                    (isTree ? 4 : 2) + Math.random() * 3,
                    isTree ? 0.22 : 0.10,
                    shade,
                    Math.random() * 6.28,                   // billowing-turbulence phase
                    0.05 + Math.random() * 0.06);
            }
        }

        // Smolder wisp — a thin, slow grey curl even when barely flaming, so a cell
        // that's just catching or burning out visibly smoulders.
        const smolderAmt = Math.max(0, 1 - intensity * 1.4);
        if (showSmoke && smolderAmt > 0.12 && smokeParticles.length < smokeCap
            && Math.random() < (isTree ? 0.05 : 0.035) * smolderAmt * dt) {
            spawnSmoke(
                x * cell + cell * 0.5 + (Math.random() - 0.5) * cell * 0.5,
                y * cell + cell * 0.4 + (Math.random() - 0.5) * cell * 0.3,
                wxF * 0.3 * windNow + (Math.random() - 0.5) * 0.2,
                -0.4 - Math.random() * 0.4,                 // slow rise
                0.45, 1.3 + Math.random() * 1.2, 0.05,
                110 + (Math.random() * 45 | 0),             // thin grey
                Math.random() * 6.28, 0.05 + Math.random() * 0.05);
        }

        // Creeping front — the advancing edge throws extra sparks as it eats fresh
        // fuel, so a spreading fire's leading line crackles with life.
        if (fuelNeighbors > 0 && showEmbers && intensity > 0.04 && intensity < 0.7
            && sparks.length < sparkCap && Math.random() < 0.10 * dt) {
            const n = 1 + (Math.random() * 2 | 0);
            for (let sN = 0; sN < n; sN++) {
                sparks.push({
                    x: x * cell + cell * 0.5 + jitterX[i], y: y * cell + cell * 0.5 + jitterY[i],
                    vx: wxF * 0.8 * windNow + (Math.random() - 0.5) * 2.0,
                    vy: wyF * 0.8 * windNow - (0.6 + Math.random() * 1.4),
                    life: 0.4 + Math.random() * 0.4, size: 0.5 + Math.random() * 0.6,
                });
            }
        }

        // Settle / log-shift — a hot clustered spot occasionally "collapses" with a
        // shower of sparks and a few lifting embers, like a log settling in a fire.
        if (showEmbers && heat > 0.5 && Math.random() < 0.0006 * dt) {
            const ns = 4 + (Math.random() * 5 | 0);
            for (let sN = 0; sN < ns && sparks.length < (MAX_SPARKS * qMul); sN++) {
                sparks.push({
                    x: x * cell + cell * 0.5 + jitterX[i], y: y * cell + cell * 0.5 + jitterY[i],
                    vx: (Math.random() - 0.5) * 3.6, vy: -(1.6 + Math.random() * 2.8),  // burst upward
                    life: 0.5 + Math.random() * 0.6, size: 0.6 + Math.random() * 0.8,
                });
            }
            for (let e = 0; e < 3 && embers.length < (MAX_EMBERS * qMul); e++) {
                spawnEmber(x * cell + cell * 0.5, y * cell + cell * 0.5,
                    (Math.random() - 0.5) * 1.4, -(1.0 + Math.random() * 1.6),
                    0.9 + Math.random() * 0.5, 1.1 + Math.random() * 1.2, Math.random() * 6.28);
            }
        }

        // Embers — more thrown from a roaring, clustered blaze
        if (showEmbers && embers.length < emberCap) {
            const emberChance = (isTree ? 0.10 : 0.025) * output;
            if (Math.random() < emberChance * dt) {
                spawnEmber(
                    x * cell + cell * 0.5,
                    y * cell + cell * 0.5,
                    wxF * (0.9 + Math.random() * 1.2) * windNow + (Math.random() - 0.5) * 1.2,
                    wyF * (0.9 + Math.random() * 1.2) * windNow + (Math.random() - 0.5) * 1.2,
                    0.7 + Math.random() * 0.5,
                    1.0 + Math.random() * 1.3,
                    Math.random() * 6.28);
            }
        }

        // Flame tongues — frequency AND size grow with the flame's intensity + heat.
        // Each gets a random shape "kind" + a curl direction so the fire is varied.
        if (showPlumes && flamePlumes.length < plumeCap) {
            // Low-intensity floor: even a smoldering/creeping cell throws the odd
            // small lick, so a low burn flickers with little flames instead of
            // sitting as static glow dots. Tapers off as the blaze intensifies
            // (where `output` already drives plenty of plumes).
            const lowLick = (1 - Math.min(1, intensity * 1.6)) * (isTree ? 0.06 : 0.04);
            const plumeChance = (isTree ? 0.34 : 0.13) * output + lowLick;
            if (Math.random() < plumeChance * dt) {
                const sizeBase = (isTree ? 2.2 : 1.2) * (0.25 + intensity * 1.05) * (1 + heat * 0.7);
                // kind: 0 standard, 1 tall wispy, 2 wide squat, 3 curly licker.
                // Occasional taller flare-up at peak intensity.
                let kind = (Math.random() * 4) | 0;
                const flare = (intensity > 0.85 && Math.random() < 0.12) ? 1 : 0;
                // Magic fire: whole blocks of cells burn in one magic colour, so
                // you get coherent patches of cyan / green / purple / blue / pink
                // flame rather than washed-out confetti.
                let mtype = 0;
                if (props.magicFire > 0) {
                    const bx = (x / 6) | 0, by = (y / 6) | 0;
                    const bh = (((bx * 73856093) ^ (by * 19349663)) >>> 0) / 4294967295;
                    if (bh < props.magicFire) mtype = 1 + ((bx * 3 + by * 5) % MAGIC_FIRE.length);
                }
                flamePlumes.push({
                    x: x * cell + cell * 0.5 + jitterX[i] + (Math.random() - 0.5) * cell * 0.35,
                    y: y * cell + cell * 0.5 + jitterY[i] + (Math.random() - 0.5) * cell * 0.35,
                    vx: wxF * 0.35 * windNow + (Math.random() - 0.5) * 0.5,
                    vy: wyF * 0.35 * windNow - 0.25 + (Math.random() - 0.5) * 0.4,
                    size: sizeBase + Math.random() * 1.2,
                    life: 0.6 + Math.random() * 0.4,
                    phase: Math.random() * 100,
                    hot: heat,
                    kind, flare, mtype,
                    curl: (Math.random() - 0.5) * 1.6,     // sideways lick
                });
                // Crackling sparks pop off vigorous, hot flames
                if (showEmbers && sparks.length < sparkCap
                    && Math.random() < (0.12 + heat * 0.3) * intensity * dt) {
                    const n = 1 + (Math.random() * 2 | 0);
                    for (let sN = 0; sN < n; sN++) {
                        sparks.push({
                            x: x * cell + cell * 0.5 + jitterX[i],
                            y: y * cell + cell * 0.5 + jitterY[i],
                            vx: wxF * 0.6 * windNow + (Math.random() - 0.5) * 2.2,
                            vy: wyF * 0.6 * windNow - (0.8 + Math.random() * 1.8), // shoot up
                            life: 0.5 + Math.random() * 0.5,
                            size: 0.6 + Math.random() * 0.8,
                        });
                    }
                }
            }
        }
    }

    // Ash decay + smolder embers + regrowth.
    // Succession: ash → bare dirt → grass → tree. Tree saplings strongly favour
    // ground next to surviving trees (seed fall), so forest grows back from its
    // edges and burn scars near woodland re-fuel naturally.
    // STRIDED: each tick visits 1/4 of the grid with dt×4 — statistically the
    // same rates/timers at a quarter of the per-tick scan cost.
    const regrowGrass    = props.regrowth ? 0.00024 * props.regrowthRate : 0;
    const regrowTreeBase = props.regrowth ? 0.00018 * props.regrowthRate : 0;
    // Scar weathering speed follows the regrowth-rate slider so cranking recovery
    // heals the black/grey/bare stages faster too (floor keeps it from freezing).
    const healStep = (dt * 4) * Math.max(0.5, props.regrowthRate);
    regrowPhase = (regrowPhase + 1) & 3;
    const sdt = dt * 4;
    for (let i = regrowPhase; i < grid.length; i += 4) {
        const s = grid[i];
        if (s === ASH_GRASS || s === ASH_TREE) {
            burnTimer[i] -= sdt;
            // hot smouldering ash → cold charred earth (a lingering burn scar)
            if (burnTimer[i] <= 0) {
                grid[i] = CHARRED;
                burnTimer[i] = 450 + Math.random() * 600;   // fresh char, first of several scar stages
                markStaticDirty(i);
                continue;
            }
            // Smoulder: fresh ash occasionally pops a tiny ember
            if (props.showEmbers && burnTimer[i] > 120
                && embers.length < MAX_EMBERS * qMul && Math.random() < 0.02 * sdt) {
                const y = (i / cols) | 0;
                const x = i - y * cols;
                spawnEmber(
                    x * cell + cell * 0.5 + jitterX[i] + (Math.random() - 0.5) * cell * 0.3,
                    y * cell + cell * 0.5 + jitterY[i] + (Math.random() - 0.5) * cell * 0.3,
                    wxF * 0.25 * windNow + (Math.random() - 0.5) * 0.3,
                    wyF * 0.25 * windNow + (Math.random() - 0.5) * 0.3,
                    0.35 + Math.random() * 0.30,
                    0.7 + Math.random() * 0.5,
                    Math.random() * 6.28);
            }
            // Crackle — a hot coal occasionally snaps off a couple of bright sparks
            if (props.showEmbers && burnTimer[i] > 200 && sparks.length < MAX_SPARKS * qMul
                && Math.random() < 0.012 * sdt) {
                const cy2 = (i / cols) | 0, cx2 = i - cy2 * cols;
                const n = 1 + (Math.random() * 2 | 0);
                for (let sN = 0; sN < n; sN++) {
                    sparks.push({
                        x: cx2 * cell + cell * 0.5 + jitterX[i], y: cy2 * cell + cell * 0.5 + jitterY[i],
                        vx: (Math.random() - 0.5) * 1.6, vy: -(0.5 + Math.random() * 1.3),
                        life: 0.3 + Math.random() * 0.35, size: 0.5 + Math.random() * 0.5,
                    });
                }
            }
        } else if (s === CHARRED) {
            // Fresh black char cools into a grey, ash-dusted bed.
            burnTimer[i] -= healStep;
            if (burnTimer[i] <= 0) {
                grid[i] = CHAR_COOL;
                burnTimer[i] = 550 + Math.random() * 800;
                markStaticDirty(i);
            }
        } else if (s === CHAR_COOL) {
            // Ash weathers away, exposing bare scorched earth.
            burnTimer[i] -= healStep;
            if (burnTimer[i] <= 0) {
                grid[i] = SCORCH;
                burnTimer[i] = 650 + Math.random() * 950;
                terrainRestoreDirt(i);   // clear pre-fire baked grass; scorch covers it opaquely
                markStaticDirty(i);
            }
        } else if (s === SCORCH) {
            // Bare burnt earth. With regrowth on, pioneers break through; otherwise
            // it lingers as a barren scar (a natural firebreak / scorched wasteland).
            if (regrowGrass > 0) {
                burnTimer[i] -= healStep;
                if (burnTimer[i] <= 0) {
                    grid[i] = SPROUT;
                    burnTimer[i] = 500 + Math.random() * 700;
                    markStaticDirty(i);
                }
            }
        } else if (s === SPROUT) {
            // First green fills in → full grass. Burn scars regrow flower-rich
            // (fireweed / poppies bloom after a fire).
            burnTimer[i] -= healStep;
            if (burnTimer[i] <= 0) {
                grid[i] = GRASS;
                grassVar[i] = pickRegrowthVariant();
                terrainDrawGrass(i);
            }
        } else if (s === DIRT && regrowGrass > 0) {
            if (Math.random() < regrowGrass * sdt) {
                grid[i] = GRASS;
                grassVar[i] = pickGrassVariant();
                terrainDrawGrass(i); // incremental: stamp the new tuft onto terrain
            }
        } else if (s === GRASS && regrowTreeBase > 0) {
            // Cheap pre-roll, then a neighbour check decides if a sapling takes.
            if (Math.random() < regrowTreeBase * sdt) {
                const y = (i / cols) | 0, x = i - y * cols;
                let treeNeighbors = 0;
                for (let d = 0; d < NEIGHBOURS.length; d++) {
                    const nx = x + NEIGHBOURS[d][0];
                    const ny = y + NEIGHBOURS[d][1];
                    if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
                    const ns = grid[idx(nx, ny)];
                    if (ns === TREE || ns === BURN_TREE) treeNeighbors++;
                }
                // Pick the species first: pioneer conifers (pine/fir) colonise OPEN
                // burned ground far more readily than the rest, so a fresh scar fills
                // back in with young evergreens first and the slower broadleaves follow
                // later (real post-fire succession). Near existing woodland everything
                // takes readily regardless of species.
                const variant = pickTreeVariant();
                const psp = (variant >> 1) & 15;
                const pioneer = (psp === SPECIES_PINE || psp === SPECIES_FIR);
                const take = treeNeighbors > 0 ? 0.80 : (pioneer ? 0.22 : 0.05);
                if (Math.random() < take) {
                    grid[i] = TREE;
                    treeVar[i] = variant;
                    treeGrowth[i] = 0.12 + Math.random() * 0.08; // starts as a sapling
                    treeContentDirty = 12;   // new sapling → fast banded refresh
                    // grass tuft already baked under the new tree — no terrain edit needed
                }
            }
        } else if (s === TREE && treeGrowth[i] < 1) {
            // Saplings mature into full trees over ~1–2 minutes; the pioneer conifers
            // (pine/fir) put on size a bit quicker so the green canopy fills back first.
            const gsp = (treeVar[i] >> 1) & 15;
            const fast = (gsp === SPECIES_PINE || gsp === SPECIES_FIR) ? 1.5 : 1;
            treeGrowth[i] = Math.min(1, treeGrowth[i] + 0.00045 * fast * Math.max(0.4, props.regrowthRate) * sdt);
        }
    }

    // Wind gusts — occasional burst that shifts angle and boosts speed briefly
    if (props.windGusts) {
        nextGustAt -= dt;
        if (nextGustAt <= 0 && gustTimer <= 0) {
            // Stormier weather makes gusts more frequent and stronger
            const storm = (weatherCurrent >= WEATHER_MONSOON) ? 1 : 0;
            gustStrength = 0.7 + Math.random() * (0.9 + storm * 0.6);
            gustTimer    = 45 + (Math.random() * 60) | 0;
            windAngle   += (Math.random() - 0.5) * (0.6 + storm * 0.4);
            nextGustAt   = ((500 + Math.random() * 900) / (1 + atmo.gale * 1.6)) | 0;   // a windy mood gusts far more often
        }
        if (gustTimer > 0) {
            gustTimer -= dt;
            gustStrength *= damp(0.985, dt);
        } else {
            gustStrength = 0;
        }
    }

    // Periodically resync glowing-mushroom spots (handles burn/regrowth changes)
    glowRefreshAt -= dt;
    if (glowRefreshAt <= 0) refreshGlowSpots();

    // Fish glide in the water; critters graze/flee on land; insects flutter
    updateFish(dt);
    updateCritters(dt);
    updateInsects(dt);

    // Seasons — slow year cycle that re-colours everything + drives snow/leaves
    updateSeason(dt);
    updateSnow(dt);

    // Weather + lightning bolts (+ persistent strike afterglow)
    updateWeather(dt);
    updateRain(dt);
    updateLightning(dt);
    updateLightningGlows(dt);

    // Decay RGB vignette pulse
    if (rgbVignettePulse > 0) rgbVignettePulse = Math.max(0, rgbVignettePulse - 0.02 * dt);

    // Bird flocks — spawn rarely, drift across (skip in storms)
    // Birds keep clear of heavy weather (monsoon / storm)
    // Wildlife thins toward winter and swells in spring (seasonParam.life).
    const seasonLife = seasonParam ? seasonParam.life : 1;
    if (props.showBirds && weatherCurrent < WEATHER_MONSOON
        && birds.length < ((60 * qMul * seasonLife) | 0) && Math.random() < 0.0008 * dt * seasonLife) spawnBirdFlock();
    if (birds.length) {
        const minX = -60, maxX = worldPxW + 60;
        const minY = -60, maxY = worldPxH + 60;
        // Pre-compute the fire centroid (steer-away anchor) once per tick
        let fcx = 0, fcy = 0, fcn = 0;
        if (burningCount > 0) {
            // Cheap sample: scan ~120 grid positions, accumulate centers of burning cells
            const step = Math.max(1, (grid.length / 120) | 0);
            for (let i = 0; i < grid.length; i += step) {
                if (grid[i] === BURN_TREE || grid[i] === BURN_GRASS) {
                    const yc = (i / cols) | 0;
                    const xc = i - yc * cols;
                    fcx += xc * cell + cell * 0.5;
                    fcy += yc * cell + cell * 0.5;
                    fcn++;
                }
            }
            if (fcn > 0) { fcx /= fcn; fcy /= fcn; }
        }
        let writeI = 0;
        for (let i = 0; i < birds.length; i++) {
            const b = birds[i];
            rememberPos(b);
            // Steer away from fire centroid when nearby
            if (fcn > 0) {
                const dx = b.x - fcx, dy = b.y - fcy;
                const d2 = dx * dx + dy * dy;
                const reach = 160 + Math.min(120, fcn * 8);
                if (d2 < reach * reach) {
                    const d = Math.sqrt(d2) || 1;
                    const push = (1 - d / reach) * 0.45;
                    b.vx += (dx / d) * push * dt;
                    b.vy += (dy / d) * push * 0.5 * dt;
                    // Renormalize speed so they don't accelerate forever
                    const sp = Math.hypot(b.vx, b.vy);
                    const targetSp = 1.6;
                    if (sp > 0) {
                        b.vx = (b.vx / sp) * targetSp;
                        b.vy = (b.vy / sp) * targetSp;
                    }
                }
            }
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.flap += b.flapSpd * dt;
            if (b.x > minX && b.x < maxX && b.y > minY && b.y < maxY) {
                birds[writeI++] = b;
            }
        }
        birds.length = writeI;
    }

    // Fireflies — slowly populate up to a target count, drift gently with phase glow
    const TARGET_FIREFLIES = props.showFireflies ? ((40 * qMul * Math.max(seasonLife, 0.6 * atmo.night) * (1 + 2.2 * atmo.night + 0.5 * atmo.fog + 0.4 * atmo.gold)) | 0) : 0;
    if (fireflies.length < TARGET_FIREFLIES && Math.random() < 0.05 * dt) spawnFirefly();
    if (!props.showFireflies && fireflies.length) fireflies = [];
    if (fireflies.length) {
        for (const f of fireflies) {
            rememberPos(f);
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            f.vx += (Math.random() - 0.5) * 0.06 * dt;
            f.vy += (Math.random() - 0.5) * 0.06 * dt;
            const fireflyDamp = damp(0.96, dt);
            f.vx *= fireflyDamp;
            f.vy *= fireflyDamp;
            f.phase += f.phaseSpd * dt;
            // Wrap edges
            if (f.x < -10) f.x = worldPxW + 10;
            if (f.x > worldPxW + 10) f.x = -10;
            if (f.y < -10) f.y = worldPxH + 10;
            if (f.y > worldPxH + 10) f.y = -10;
        }
    }

    // Ambient leaves drifting in wind (independent of fire). Season drives the
    // volume: a blizzard of leaf-fall in autumn, a few blossom petals in spring,
    // suppressed under deep-winter snow.
    const seasonLeaf = seasonParam ? seasonParam.leaf : 1;
    const leafActive = (seasonParam ? seasonParam.snow : 0) < 0.5;
    if (props.showLeaves && leafActive && props.showWindParticles && windNow > 0.05) {
        const spawnRate = 0.25 * Math.min(1, windNow) * (0.2 + seasonLeaf * 2.6) * (1 + 1.6 * atmo.gale);
        if (leaves.length < MAX_LEAVES * qMul && Math.random() < spawnRate * dt) spawnLeaf();
        const wxL = wxF * 0.05 * windNow;
        const wyL = wyF * 0.05 * windNow;
        const minX = -25, maxX = worldPxW + 25;
        const minY = -25, maxY = worldPxH + 25;
        let writeI = 0;
        for (let i = 0; i < leaves.length; i++) {
            const p = leaves[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const leafDamp = damp(0.985, dt);
            p.vx = p.vx * leafDamp + (wxL + (Math.random() - 0.5) * 0.12) * dt;
            p.vy = p.vy * leafDamp + (wyL + (Math.random() - 0.5) * 0.12) * dt;
            if (atmo.gale > 0.02) {          // a gale eddies: leaves and seeds swirl instead of flying straight
                p.vx += Math.cos(simClock * 0.035 + p.rot * 2) * 0.05 * atmo.gale * dt;
                p.vy += Math.sin(simClock * 0.040 + p.rot * 3) * 0.05 * atmo.gale * dt;
            }
            p.rot += p.rotSpd * dt;
            p.life -= 0.0022 * dt;
            if (p.life > 0 && p.x > minX && p.x < maxX && p.y > minY && p.y < maxY) {
                leaves[writeI++] = p;
            }
        }
        leaves.length = writeI;
    } else if (leaves.length) {
        leaves.length = 0;
    }

    // Smoke physics (in-place compaction — no per-frame allocation)
    if (smokeParticles.length) {
        const wxA = wxF * 0.10 * windNow;
        const wyA = wyF * 0.10 * windNow;
        const smokeDamp = damp(0.985, dt);
        let writeI = 0;
        for (let i = 0; i < smokeParticles.length; i++) {
            const p = smokeParticles[i];
            rememberPos(p);
            // Swirling turbulence that grows as the puff ages → billowing column
            if (p.swirl !== undefined) {
                p.swirl += p.swirlSpd * dt;
                const turb = 0.4 + (1 - p.life) * 1.6;
                p.vx += Math.cos(p.swirl) * 0.05 * turb * dt;
                p.vy += (Math.sin(p.swirl * 1.3) * 0.03 - 0.02) * turb * dt;  // swirl + a little extra lift
            }
            p.x += (p.vx + wxA) * dt;
            p.y += (p.vy + wyA) * dt;
            p.vx *= smokeDamp;
            p.vy *= smokeDamp;
            p.size += p.grow * dt;
            p.life -= 0.0075 * dt;
            if (p.life > 0) smokeParticles[writeI++] = p;
            else if (smokePool.length < MAX_SMOKE) smokePool.push(p);   // recycle
        }
        smokeParticles.length = writeI;
    }

    // Flame plume physics (in-place compaction)
    if (flamePlumes.length) {
        const wxA = wxF * 0.06 * windNow;
        const wyA = wyF * 0.06 * windNow;
        let writeI = 0;
        for (let i = 0; i < flamePlumes.length; i++) {
            const p = flamePlumes[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const plumeDamp = damp(0.93, dt);
            p.vx = p.vx * plumeDamp + wxA * dt;
            p.vy = p.vy * plumeDamp + wyA * dt;
            p.size *= damp(1.038, dt);
            p.life -= 0.043 * dt;
            p.phase += dt;
            if (p.life > 0) flamePlumes[writeI++] = p;
        }
        flamePlumes.length = writeI;
    }

    // Spark physics — shoot up, slow, arc back down a touch, flicker out fast
    if (sparks.length) {
        let writeI = 0;
        for (let i = 0; i < sparks.length; i++) {
            const p = sparks[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 0.07 * dt;          // gravity arcs them back down
            p.vx *= damp(0.96, dt);
            p.life -= 0.028 * dt;
            if (p.life > 0) sparks[writeI++] = p;
        }
        sparks.length = writeI;
    }

    // Ember physics (in-place compaction; can ignite cells they land on)
    if (embers.length) {
        const wxA = wxF * 0.08 * windNow;
        const wyA = wyF * 0.08 * windNow;
        const igniteChance = 0.00028 * props.spreadRate;  // rarer spot-fires (lush forest)
        let writeI = 0;
        for (let i = 0; i < embers.length; i++) {
            const p = embers[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const emberDamp = damp(0.94, dt);
            p.vx = p.vx * emberDamp + wxA * dt;
            p.vy = p.vy * emberDamp + wyA * dt;
            p.life -= 0.022 * dt;
            if (p.life > 0) {
                if (Math.random() < igniteChance * dt) {
                    const cx = (p.x / cell) | 0;
                    const cy = (p.y / cell) | 0;
                    if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
                        igniteCell(idx(cx, cy));
                    }
                }
                embers[writeI++] = p;
            } else if (emberPool.length < MAX_EMBERS) {
                emberPool.push(p);   // recycle dead ember
            }
        }
        embers.length = writeI;
    }

    // Wind streaks (subtle ground-level dust trails in wind direction)
    if (props.showWindParticles && windNow > 0.05) {
        if (windStreaks.length < MAX_WIND_PARTS * qMul * (1 + 1.5 * atmo.gale) && Math.random() < (0.5 + 0.8 * atmo.gale) * dt) {
            const w = worldPxW, h = worldPxH;
            let x, y;
            if (Math.abs(wxF) > Math.abs(wyF)) {
                x = wxF > 0 ? -10 : w + 10;
                y = Math.random() * h;
            } else {
                y = wyF > 0 ? -10 : h + 10;
                x = Math.random() * w;
            }
            windStreaks.push({
                x, y,
                len: 10 + Math.random() * 24,
                life: 1.0,
                speed: 1.0 + Math.random() * 1.8,
            });
        }
        const minX = -60, maxX = worldPxW + 60;
        const minY = -60, maxY = worldPxH + 60;
        let writeI = 0;
        for (let i = 0; i < windStreaks.length; i++) {
            const p = windStreaks[i];
            rememberPos(p);
            p.x += wxF * p.speed * windNow * dt;
            p.y += wyF * p.speed * windNow * dt;
            p.life -= 0.005 * dt;
            if (p.life > 0 && p.x > minX && p.x < maxX && p.y > minY && p.y < maxY) {
                windStreaks[writeI++] = p;
            }
        }
        windStreaks.length = writeI;
    } else if (windStreaks.length) {
        windStreaks.length = 0;
    }
}

// ============================================================
// Static-layer cache (water/paths/grass/rocks/ash baked together)
// ============================================================
// A state change at cell i can alter scar-layer pixels up to 2 cells away: its own
// drawing, its neighbours' receded-edge flags, and their ≤1-cell spill (tree-ash
// discs, sprout blades). So dirty every tile that 5×5 block touches. No index →
// everything (legacy callers / unknown change).
function markStaticDirty(i) {
    staticDirty = true;
    if (staticForceFull) return;                       // a full bake is already queued
    if (i === undefined || !staticTilesX) { staticTileDirty.fill(1); return; }
    const y = (i / cols) | 0, x = i - y * cols;
    const tx0 = (Math.max(0, x - 2) / STATIC_TILE) | 0, tx1 = (Math.min(cols - 1, x + 2) / STATIC_TILE) | 0;
    const ty0 = (Math.max(0, y - 2) / STATIC_TILE) | 0, ty1 = (Math.min(rows - 1, y + 2) / STATIC_TILE) | 0;
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) staticTileDirty[ty * staticTilesX + tx] = 1;
}
function markTerrainDirty() { terrainDirty = true; staticDirty = true; staticForceFull = true; }

// Incremental terrain edits — update a single cell on the baked terrain canvas
// instead of re-baking the whole thing (which includes the costly water blur).
// Used by regrowth so the forest can recover without per-event rebake hitches.
function terrainDrawGrass(i) {
    if (!terrainCanvas) { markTerrainDirty(); return; }
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const y = (i / cols) | 0, x = i - y * cols;
    terrainCtx.drawImage(grassSprites, grassVar[i] * grassSpW, 0, grassSpW, grassSpH,
                         x * cell, y * cell, grassSpW, grassSpH);
    markStaticDirty(i);
}
function terrainRestoreDirt(i) {
    if (!terrainCanvas) { markTerrainDirty(); return; }
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const y = (i / cols) | 0, x = i - y * cols;
    // Repaint the bare dirt background for this one cell (clears baked grass)
    terrainCtx.drawImage(bgCanvas, x * cell, y * cell, cell, cell,
                         x * cell, y * cell, cell, cell);
    markStaticDirty(i);
}

// Bake the worldgen-static terrain (dirt + water + paths + lily pads + rocks).
// None of this changes when cells burn/regrow, so it's baked once per world —
// keeping the expensive blurred-water passes out of the per-frame static rebuild.
function bakeTerrain() {
    if (!terrainCanvas) {
        terrainCanvas = document.createElement("canvas");
        terrainCtx    = terrainCanvas.getContext("2d");
    }
    if (terrainCanvas.width !== worldPxW || terrainCanvas.height !== worldPxH) {
        terrainCanvas.width  = worldPxW;
        terrainCanvas.height = worldPxH;
    }
    const sc = terrainCtx;
    const w = terrainCanvas.width;
    const h = terrainCanvas.height;
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);

    sc.clearRect(0, 0, w, h);
    sc.drawImage(bgCanvas, 0, 0);

    // ---- Water (baked) ----
    // Smooth shorelines: uniform colors per layer so overlapping discs MERGE
    // seamlessly (no scalloped ring artifacts from per-disc color or alpha).
    //
    // Layer order at a shoreline cell, outer→inner:
    //   shallow teal rim  →  deep blue body (interior)
    const WATER_DEEP    = "#2a5e96";   // deep body
    const WATER_SHALLOW = "#5aa6c8";   // lighter near shore
    const WATER_DEEP_REFLECT = "#2f6e72"; // greenish deep where trees overhang

    // Smooth water via an offscreen blurred mask — eliminates per-cell disc
    // scalloping. Build a binary water-cell rect mask, blur it, and composite
    // layers from larger (shore) to smaller (deep) so the shoreline is even.
    // Half-resolution mask + blur buffer (see note at the declaration).
    const hw = Math.max(1, Math.ceil(w / 2)), hh = Math.max(1, Math.ceil(h / 2));
    if (!waterMask) {
        waterMask = document.createElement("canvas");
        waterMaskCtx = waterMask.getContext("2d");
        waterMaskBlur = document.createElement("canvas");
        waterMaskBlurCtx = waterMaskBlur.getContext("2d");
    }
    if (waterMask.width !== hw || waterMask.height !== hh) {
        waterMask.width = hw; waterMask.height = hh;
        waterMaskBlur.width = hw; waterMaskBlur.height = hh;
    }
    const mc = waterMaskCtx, wb = waterMaskBlurCtx;
    const blurHalf = Math.max(1, ((cell * 0.42) | 0) >> 1);   // blur radius in half-res space

    // Fill a set of cells (predicate) as overlapping rects on the half-res mask
    // (the 0.5 transform maps world coords → the half-size canvas).
    const paintMask = (color, predicate, pad) => {
        mc.setTransform(0.5, 0, 0, 0.5, 0, 0);
        mc.clearRect(0, 0, w, h);
        mc.fillStyle = color;
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const i = y * cols + x;
                if (grid[i] !== WATER) continue;
                if (predicate && !predicate(x, y, i)) continue;
                mc.fillRect(x * cell - pad, y * cell - pad, cell + pad * 2, cell + pad * 2);
            }
        }
        mc.setTransform(1, 0, 0, 1, 0, 0);
    };
