                const flameR = baseR * (0.12 + intensity * 1.02) * (1 + heat * 0.5) * flicker;
                const jx = isTree ? jitterX[i] : 0;
                const jy = isTree ? jitterY[i] : 0;
                const cxP = x * cell + cell * 0.5 + jx + (Math.random() - 0.5) * cell * 0.20;
                const cyP = y * cell + cell * 0.5 + jy + (Math.random() - 0.5) * cell * 0.20;

                // Magic-fire cells get a matching coloured underglow
                let mGlow = 0;
                if (props.magicFire > 0) {
                    const bx = (x / 6) | 0, by = (y / 6) | 0;
                    const bh = (((bx * 73856093) ^ (by * 19349663)) >>> 0) / 4294967295;
                    if (bh < props.magicFire) mGlow = 1 + ((bx * 3 + by * 5) % MAGIC_FIRE.length);
                }

                if (mGlow) {
                    const mc = MAGIC_FIRE[mGlow - 1];
                    glowCtx.fillStyle = rgbQ(mc[0], mc[1], mc[2]);
                    glowCtx.globalAlpha = 0.5 + intensity * 0.3;
                    glowCtx.beginPath();
                    glowCtx.arc(cxP, cyP, flameR, 0, Math.PI * 2);
                    glowCtx.fill();
                    // lighter inner
                    glowCtx.fillStyle = rgbQ(mc[0] + 90, mc[1] + 60, mc[2] + 60);
                    glowCtx.globalAlpha = 0.4 + intensity * 0.35;
                    glowCtx.beginPath();
                    glowCtx.arc(cxP, cyP, flameR * 0.5, 0, Math.PI * 2);
                    glowCtx.fill();
                } else {
                    // Outer flame — dark ember-red when smoldering, orange at blaze
                    const oG = (60 + intensity * 130 + heat * 40) | 0;
                    const oB = (10 + hot * 70) | 0;
                    glowCtx.fillStyle = rgbQ(255, oG, oB);
                    glowCtx.globalAlpha = 0.55 + intensity * 0.30;
                    glowCtx.beginPath();
                    glowCtx.arc(cxP, cyP, flameR, 0, Math.PI * 2);
                    glowCtx.fill();

                    // Inner core — warm amber
                    const iG = (150 + hot * 70) | 0;
                    const iB = (45 + hot * 90) | 0;
                    glowCtx.fillStyle = rgbQ(255, iG, iB);
                    glowCtx.globalAlpha = 0.40 + intensity * 0.35;
                    glowCtx.beginPath();
                    glowCtx.arc(cxP, cyP, flameR * 0.5, 0, Math.PI * 2);
                    glowCtx.fill();
                }
            }
        }
        glowCtx.globalAlpha = 1;   // reset for the next frame's clear/draws

        // Composite only the fire's bounding region (with padding for the blur
        // spread) so the glow blur cost stays proportional to the fire size, not
        // the whole (large) world canvas.
        const gpad = 36;
        const gx0 = Math.max(0, (fbX0 - gpad) | 0);
        const gy0 = Math.max(0, (fbY0 - gpad) | 0);
        const gx1 = Math.min(worldPxW, (fbX1 + cell + gpad) | 0);
        const gy1 = Math.min(worldPxH, (fbY1 + cell + gpad) | 0);
        const gw = gx1 - gx0, gh = gy1 - gy0;
        if (gw > 0 && gh > 0) {
            if (props.fireGlow > 0) {
                const audioBoost = props.audioReactive ? (1 + audioBass * 0.6 * props.audioIntensity) : 1;
                const glowAmt = props.fireGlow * audioBoost;
                // Half-resolution blur: downscale the glow region 2×, blur at
                // half the radius, and let the upscale smooth it back out —
                // same soft bloom for a quarter of the blur work.
                const hw = Math.max(1, gw >> 1), hh = Math.max(1, gh >> 1);
                if (!glowHalf) { glowHalf = document.createElement("canvas"); glowHalfCtx = glowHalf.getContext("2d"); }
                if (glowHalf.width < hw || glowHalf.height < hh) {
                    glowHalf.width = Math.max(glowHalf.width, hw);
                    glowHalf.height = Math.max(glowHalf.height, hh);
                }
                glowHalfCtx.clearRect(0, 0, hw, hh);
                glowHalfCtx.save();
                glowHalfCtx.filter = `blur(${(5.5 * glowAmt).toFixed(1)}px)`;
                glowHalfCtx.drawImage(glowCanvas, gx0, gy0, gw, gh, 0, 0, hw, hh);
                glowHalfCtx.restore();
                ctx.save();
                ctx.globalAlpha = Math.min(1, 0.5 * glowAmt);
                ctx.globalCompositeOperation = "screen";
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(glowHalf, 0, 0, hw, hh, gx0, gy0, gw, gh);
                ctx.restore();
            }
            // A touch of the sharp glow for the embers/core, kept low
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.globalCompositeOperation = "lighter";
            ctx.drawImage(glowCanvas, gx0, gy0, gw, gh, gx0, gy0, gw, gh);
            ctx.restore();
        }
    }

    // Flame tongues — flickering tapering flames that lick upward, curl and dance.
    // Each plume is a stack of shrinking discs forming a tongue; the shape varies
    // by "kind" (standard / tall-wispy / wide-squat / curly) and the tip curls
    // sideways with wind, so the fire looks alive and varied. Colour ramps deep
    // red base → orange → yellow → white-hot tip (blue-white at the hottest cores).
    if (flamePlumes.length) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const SEGS = 5;
        const windLean = Math.cos(windAngle) * props.windStrength;
        for (const p of flamePlumes) {
            const px = drawX(p), py = drawY(p);
            const a = p.life;
            const hot = p.hot || 0;
            const kind = p.kind || 0;
            // per-kind shape: [heightMul, widthMul, taper, curlMul]
            let hMul = 2.9, wMul = 1.0, taper = 0.74, curlMul = 1.0;
            if (kind === 1)      { hMul = 3.9; wMul = 0.7; taper = 0.84; curlMul = 1.3; } // tall wispy
            else if (kind === 2) { hMul = 2.0; wMul = 1.35; taper = 0.6;  curlMul = 0.6; } // wide squat
            else if (kind === 3) { hMul = 3.1; wMul = 0.9; taper = 0.78; curlMul = 2.2; } // curly licker
            if (p.flare) { hMul *= 1.5; }
            const tongueH = p.size * hMul;
            const flick = 0.72 + 0.28 * Math.sin(p.phase);
            for (let sgi = 0; sgi < SEGS; sgi++) {
                const t = sgi / (SEGS - 1);                 // 0 base → 1 tip
                const segY = py - tongueH * t;
                // dancing waver + a wind-driven curl that grows toward the tip
                const waver = Math.sin(p.phase * 0.6 + t * 3.4) * p.size * 0.5 * t * curlMul;
                const curl  = (p.curl + windLean * 0.8) * p.size * t * t * curlMul;
                const segX = px + waver + curl;
                const segR = Math.max(0.5, p.size * wMul * (1.0 - t * taper));
                const alpha = a * (0.42 - t * 0.12) * flick;
                if (alpha <= 0) continue;
                let r, g, b;
                let segAlpha = alpha;
                if (p.mtype) {
                    // magic flame: stays a saturated hue, only lightening to a
                    // pastel of its own colour at the tip (never pure white), so
                    // the colour reads even amid bright normal flames.
                    const mc = MAGIC_FIRE[p.mtype - 1];
                    const tt = Math.pow(t, 1.6) * 0.55;
                    r = (mc[0] + (255 - mc[0]) * tt) | 0;
                    g = (mc[1] + (255 - mc[1]) * tt) | 0;
                    b = (mc[2] + (255 - mc[2]) * tt) | 0;
                    segAlpha = alpha * 1.25;
                } else {
                    // normal: red base → orange → yellow → white (blue-white hottest)
                    r = 255;
                    g = (50 + t * t * 185 + hot * 25) | 0;
                    b = (6 + Math.pow(t, 2.6) * 215 + hot * 70) | 0;
                    if (g > 255) g = 255; if (b > 255) b = 255;
                }
                ctx.fillStyle = rgbQ(r, g, b);
                ctx.globalAlpha = segAlpha > 1 ? 1 : segAlpha;
                ctx.beginPath();
                ctx.arc(segX, segY, segR, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.restore();
    }

    // Crackling sparks — tiny bright pinpoints that pop off the fire and arc
    if (sparks.length) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const p of sparks) {
            const px = drawX(p), py = drawY(p);
            const a = Math.min(1, p.life);
            const tw = 0.55 + 0.45 * Math.sin(renderTimeSec * 54 + px);   // fast twinkle
            ctx.fillStyle = rgbQ(255, (220 + a * 35) | 0, (140 * a) | 0);
            ctx.globalAlpha = a * tw;
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Embers — glowing floating motes: a soft warm halo + comet trail + bright,
    // gently-pulsing core, so they drift like living sparks of light.
    if (embers.length) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        for (const p of embers) {
            const px = drawX(p), py = drawY(p);
            const a = Math.min(1, p.life);
            const tw = 0.7 + 0.3 * Math.sin((p.phase || 0) + renderTimeSec * 10.8); // soft pulse
            // soft glow halo
            ctx.fillStyle = rgbQ(255, (130 + a * 70) | 0, (40 * a) | 0);
            ctx.globalAlpha = a * 0.16 * tw;
            ctx.beginPath();
            ctx.arc(px, py, p.size * 3.4, 0, Math.PI * 2);
            ctx.fill();
            // comet trail
            ctx.lineWidth = p.size * 0.9;
            ctx.strokeStyle = rgbQ(255, (120 + a * 100) | 0, (20 * a) | 0);
            ctx.globalAlpha = a * 0.45;
            ctx.beginPath();
            ctx.moveTo(px - p.vx * 2.4, py - p.vy * 2.4);
            ctx.lineTo(px, py);
            ctx.stroke();
            // bright core
            ctx.fillStyle = rgbQ(255, (225 + a * 30) | 0, (160 * a) | 0);
            ctx.globalAlpha = a * tw > 1 ? 1 : a * tw;
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Heat-shimmer distortion — over (and rising above) a sizable fire, snapshot
    // the region and redraw it in thin horizontal slices nudged sideways by an
    // animated sine, so the air above the flames ripples like real heat haze.
    if (props.heatShimmer && burningCount > 14 && fbX1 >= fbX0
        && qMul > 0.5 && worldPxW <= canvas.width + 2 && worldPxH <= canvas.height + 2) {
        // (skipped on Low quality and when the world is larger than the screen,
        //  i.e. while panning, since it snapshots the screen canvas)
        const pad = cell * 1.5;
        let x0 = Math.max(0, (fbX0 - pad) | 0);
        let x1 = Math.min(w, (fbX1 + cell + pad) | 0);
        let top = Math.max(0, (fbY0 - cell * 3.5) | 0);          // extend up (heat rises)
        let bot = Math.min(h, (fbY1 + cell) | 0);
        // Clamp the shimmer region around the fire centre so a sprawling blaze
        // doesn't make the snapshot + slice work explode.
        const MAXW = 420, MAXH = 320;
        if (x1 - x0 > MAXW) { const cx = (x0 + x1) >> 1; x0 = Math.max(0, cx - MAXW / 2 | 0); x1 = Math.min(w, x0 + MAXW); }
        if (bot - top > MAXH) { const cy = (top + bot) >> 1; top = Math.max(0, cy - MAXH / 2 | 0); bot = Math.min(h, top + MAXH); }
        const rw = x1 - x0, rh = bot - top;
        if (rw > 6 && rh > 6) {
            if (!hazeCanvas) { hazeCanvas = document.createElement("canvas"); hazeCtx = hazeCanvas.getContext("2d"); }
            if (hazeCanvas.width < rw || hazeCanvas.height < rh) {
                hazeCanvas.width = Math.max(hazeCanvas.width, rw);
                hazeCanvas.height = Math.max(hazeCanvas.height, rh);
            }
            hazeCtx.clearRect(0, 0, rw, rh);
            hazeCtx.drawImage(ctx.canvas, x0, top, rw, rh, 0, 0, rw, rh);
            const amp = Math.min(1.6, cell * 0.12) * Math.min(1, burningCount / 80);
            // taller bands when the region is large, so the slice count stays bounded
            const bandH = rh > 220 ? 4 : 3;
            for (let yy = 0; yy < rh; yy += bandH) {
                const ny = top + yy;
                const rise = 0.35 + 0.65 * (1 - yy / rh);
                const dx = Math.sin(ny * 0.22 + renderTimeSec * 13.2) * amp * rise
                         + Math.sin(ny * 0.5 - renderTimeSec * 7.8) * amp * 0.4 * rise;
                ctx.drawImage(hazeCanvas, 0, yy, rw, bandH, x0 + dx, ny, rw, bandH);
            }
        }
    }

    // Smoke (above fire, below leaves) — per-particle shade for variety
    if (props.showSmoke && smokeParticles.length) {
        ctx.save();
        for (const p of smokeParticles) {
            const px = drawX(p), py = drawY(p);
            const s = p.shade | 0;
            ctx.fillStyle = rgbQ(s, (s * 0.95) | 0, (s * 0.88) | 0);
            ctx.globalAlpha = p.life * 0.14;
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Fireflies (between embers/smoke and birds — drift glow)
    if (fireflies.length) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const f of fireflies) {
            const fx = drawX(f), fy = drawY(f);
            const pulse = 0.45 + Math.sin(f.phase) * 0.45;
            const a = pulse * f.life;
            // Halo (smaller, fainter — keeps the spotlight on the fire)
            ctx.fillStyle = `rgba(220,255,140,${(a * 0.10).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(fx, fy, f.size * 2.4, 0, Math.PI * 2);
            ctx.fill();
            // Core
            ctx.fillStyle = `rgba(240,255,170,${(a * 0.7).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(fx, fy, f.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Ambient leaves (above smoke for that drifting feel)
    if (leaves.length) {
        for (const p of leaves) {
            const px = drawX(p), py = drawY(p);
            const a = (p.life * 0.7).toFixed(2);
            const [r, g, b] = p.color;
            ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
            ctx.beginPath();
            ctx.ellipse(px, py, p.size * 1.5, p.size * 0.55, p.rot, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Bird flocks — small V-silhouettes high above
    if (birds.length) {
        ctx.strokeStyle = "rgba(18,12,8,0.85)";
        ctx.lineCap = "round";
        for (const b of birds) {
            const bx = drawX(b), by = drawY(b);
            const wing = Math.abs(Math.sin(b.flap)) * 0.55 + 0.45;
            ctx.lineWidth = b.size * 0.8;
            ctx.beginPath();
            ctx.moveTo(bx - b.size * 2.5, by - b.size * wing);
            ctx.lineTo(bx, by);
            ctx.lineTo(bx + b.size * 2.5, by - b.size * wing);
            ctx.stroke();
        }
    }

    // Rain — wind-slanted streaks falling
    if (rainDrops.length) {
        ctx.strokeStyle = "rgba(180,210,240,0.65)";
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        for (const r of rainDrops) {
            const rx = drawX(r), ry = drawY(r);
            // Direction = velocity (normalized × streak length)
            const sp = Math.hypot(r.vx, r.vy) || 1;
            const dx = (r.vx / sp) * r.len;
            const dy = (r.vy / sp) * r.len;
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - dx, ry - dy);
            ctx.stroke();
        }
    }

    // Lightning bolts (very top, with flash) — still in world space
    drawLightning();

    // Back to screen space for the full-screen overlays + cursor UI.
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // --- Seasonal colour grade over the whole scene ---
    // Winter desaturates + cools, autumn warms to gold, spring freshens, summer
    // is neutral. Always on (it IS the seasonal look), kept tasteful.
    if (seasonParam) {
        const s = seasonParam;
        if (s.desat > 0.01) {
            ctx.save();
            ctx.globalCompositeOperation = "saturation";
            ctx.fillStyle = "hsl(0,0%,50%)";
            ctx.globalAlpha = s.desat;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (s.ta > 0.005) {
            ctx.save();
            ctx.globalCompositeOperation = s.mode;
            ctx.fillStyle = `rgba(${s.tr | 0},${s.tg | 0},${s.tb | 0},${s.ta.toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (s.bright > 0.005) {
            ctx.save();
            ctx.globalCompositeOperation = "screen";
            ctx.fillStyle = `rgba(255,255,255,${s.bright.toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (s.snow > 0.03) {                 // gentle frost wash over the canopy
            ctx.fillStyle = `rgba(244,248,255,${(s.snow * 0.12).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
        }
    }

    // Falling snow — screen-space flakes in front of the scene
    if (snowFlakes.length) {
        ctx.fillStyle = "#ffffff";
        for (const p of snowFlakes) {
            ctx.globalAlpha = 0.45 + p.depth * 0.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.5 + p.depth * 0.6), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Mouse hover indicator — small ignition-radius preview
    if (props.showMouseHint && props.mouseInteraction && mouseInside) {
        const r = Math.max(1, props.igniteRadius) * cell;
        ctx.save();
        ctx.strokeStyle = "rgba(255,180,80,0.55)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        // Small flame dot in centre
        ctx.fillStyle = "rgba(255,150,60,0.85)";
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Weather ambient tint — a gentle warm haze in drought, cool wash in heavy wet
    // weather. Kept subtle (and behind the "Screen effects" toggle) so it stays
    // easy to look at as a desktop background.
    if (props.screenEffects) {
        const dry = weatherDryness();                         // 0..1 (drought)
        const wet = Math.max(0, weatherIntensitySmooth - 0.3); // 0..0.7 (rain→storm)
        if (dry > 0.02) {
            ctx.save();
            ctx.globalCompositeOperation = "soft-light";
            ctx.fillStyle = `rgba(255,205,120,${(dry * 0.16).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (wet > 0.02) {
            ctx.save();
            ctx.globalCompositeOperation = "multiply";
            const m = Math.min(1, wet);
            ctx.fillStyle = `rgba(${(160 - m*35)|0},${(172 - m*25)|0},${(195 - m*8)|0},${(m * 0.16).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
    }

    // RGB edge vignette — bleed fire / lightning color to screen borders so
    // Wallpaper Engine's iCUE/Aura/Razer/Chroma plugin samples vivid color.
    // (Gentle by default; its own toggle + the Screen-effects toggle both gate it.)
    if (props.rgbEdgeMode && props.screenEffects) {
        // Base intensity scales with burning cells (capped) + lightning pulse
        const fireLoad = Math.min(1, burningCount / 250);
        const intensity = Math.max(rgbVignettePulse * 0.9, fireLoad * 0.65) * props.rgbEdgeStrength;
        if (intensity > 0.03) {
            // Vignette gradient: warm orange outer (fire) or cool blue (lightning)
            const cxg = canvas.width  * 0.5;
            const cyg = canvas.height * 0.5;
            const inner = Math.min(canvas.width, canvas.height) * 0.35;
            const outer = Math.max(canvas.width, canvas.height) * 0.85;
            const grad = ctx.createRadialGradient(cxg, cyg, inner, cxg, cyg, outer);
            const aPeak = (intensity * 0.32).toFixed(3);   // gentler than before
            // Lightning skews tint cool, fire skews warm
            if (rgbVignettePulse > fireLoad * 0.5) {
                grad.addColorStop(0, "rgba(255,150,80,0)");
                grad.addColorStop(0.6, `rgba(255,170,90,${aPeak})`);
                grad.addColorStop(1,   `rgba(255,90,40,${(intensity * 0.55).toFixed(3)})`);
            } else {
                grad.addColorStop(0, "rgba(255,140,60,0)");
                grad.addColorStop(0.6, `rgba(255,150,55,${aPeak})`);
                grad.addColorStop(1,   `rgba(255,100,30,${(intensity * 0.6).toFixed(3)})`);
            }
            ctx.save();
            ctx.globalCompositeOperation = "screen";
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
    }

    if (props.debugOverlay) {
        debugEl.style.display = "block";
        const wMode = WEATHER_NAMES[weatherCurrent] || "?";
        debugEl.textContent =
            `fps=${avgFps.toFixed(0)}  sim=${SIM_HZ}Hz  frame=${frame}  static=${staticDirty?"dirty":"clean"}\n` +
            `burn=${burningCount}  smoke=${smokeParticles.length}  embers=${embers.length}  ` +
            `plumes=${flamePlumes.length}  rain=${rainDrops.length}\n` +
            `leaves=${leaves.length}  fireflies=${fireflies.length}  birds=${birds.length}  ` +
            `clouds=${clouds.length}  bolts=${lightningBolts.length}\n` +
            `weather=${wMode}  windDeg=${((windAngle * 180 / Math.PI) % 360).toFixed(0)}  ` +
            `cell=${cell}  grid=${cols}x${rows}`;
        debugEl.style.whiteSpace = "pre";
    } else {
        debugEl.style.display = "none";
    }
}

// ============================================================
// Loop (idles cheaply when nothing's happening)
// ============================================================
function loop() {
    requestAnimationFrame(loop);

    const now = performance.now();

    // FPS cap — skip render if we haven't waited long enough.
    // Sim still runs on its own time accumulator, so simulation is unaffected.
    if (minFrameMs > 0 && (now - lastRenderMs) < (minFrameMs - 0.5)) {
        // Allow sim to catch up so timing stays correct
        if (lastSimMs === 0) lastSimMs = now;
        return;
    }
    lastRenderMs = now;
    renderTimeSec = now * 0.001;
    frame++;

    // FPS tracking (exponential moving average)
    if (lastFrameMs > 0) {
        const dt = now - lastFrameMs;
        if (dt > 0) avgFps = avgFps * 0.92 + (1000 / dt) * 0.08;
    }
    lastFrameMs = now;

    const isActive =
        burningCount > 0 ||
        smokeParticles.length > 0 ||
        embers.length > 0 ||
        flamePlumes.length > 0 ||
        sparks.length > 0 ||
        leaves.length > 0 ||
        lightningBolts.length > 0 ||
        lightningGlows.length > 0 ||
        birds.length > 0 ||
        fireflies.length > 0 ||
        (props.showFish && fishList.length > 0) ||
        rainDrops.length > 0 ||
        clouds.length > 0 ||
        weatherCurrent !== WEATHER_CLEAR ||
        weatherTarget  !== WEATHER_CLEAR ||
        weatherIntensitySmooth > 0.001 ||
        weatherFrontProgress > 0.001 ||
        props.weatherMode !== "clear" ||   // keep ticking so mode changes apply + auto-cycle runs
        rgbVignettePulse > 0 ||
        gustStrength > 0.01 ||
        audioLevel > 0.02 ||
        mouseInside ||
        props.autoIgnite ||
        (props.showWindParticles && props.windStrength > 0.05);

    // Fixed-timestep simulation: 60 visual ticks/sec independent of render FPS.
    // Constants are scaled from the old 30Hz tuning so gameplay pacing stays intact.
    if (lastSimMs === 0) lastSimMs = now;
    if (isActive) {
        let iters = 0;
        while (now - lastSimMs >= SIM_TICK_MS && iters < MAX_SIM_PER_FRAME) {
            update();
            lastSimMs += SIM_TICK_MS;
            iters++;
        }
        // If we couldn't catch up (long pause/lag), snap to now to avoid death-spiral
        if (now - lastSimMs > SIM_TICK_MS * MAX_SIM_PER_FRAME * 2) {
            lastSimMs = now;
        }
        simAlpha = Math.max(0, Math.min(1, (now - lastSimMs) / SIM_TICK_MS));
    } else {
        lastSimMs = now; // stay in sync while idle so we don't burst on resume
        simAlpha = 1;
    }

    render();
}

// ============================================================
// Input
// ============================================================
let mouseDown = false;
function onIgniteInput(clientX, clientY) {
    if (!props.mouseInteraction) return;
    // map the screen cursor into world coordinates (account for the camera)
    igniteAt(clientX + camX, clientY + camY, props.igniteRadius);
}
canvas.addEventListener("mousedown",  e => { mouseDown = true; onIgniteInput(e.clientX, e.clientY); });
canvas.addEventListener("mouseup",    () => { mouseDown = false; });
canvas.addEventListener("mousemove",  e => {
    mouseX = e.clientX; mouseY = e.clientY; mouseInside = true;
    if (mouseDown) onIgniteInput(e.clientX, e.clientY);
});
canvas.addEventListener("mouseleave", () => { mouseInside = false; mouseDown = false; });
canvas.addEventListener("mouseenter", e => { mouseInside = true; mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener("touchstart", e => { for (const t of e.touches) onIgniteInput(t.clientX, t.clientY); }, { passive: true });
canvas.addEventListener("touchmove",  e => { for (const t of e.touches) onIgniteInput(t.clientX, t.clientY); }, { passive: true });
window.addEventListener("resize", resize);

// ============================================================
// Wallpaper Engine property listener
// ============================================================
function applyProperty(key, raw) {
    if (raw == null) return;
    const v = raw.value;
    if (v === undefined) return;

    let needRebuild = false;
    let needBg = false;

    switch (key) {
        case "treeDensity":
        case "grassDensity":
        case "rockDensity":
            props[key] = Number(v);
            needRebuild = true;
            needBg = true;
            break;
        case "cellSize":
            props.cellSize = Math.max(1, parseInt(v, 10) || props.cellSize);
            needRebuild = true;
            needBg = true;
            break;
        case "igniteRadius":
            props.igniteRadius = Math.max(1, parseInt(v, 10) || props.igniteRadius);
            break;
        case "spreadRate":
        case "treeBurnDuration":
        case "grassBurnDuration":
        case "windStrength":
        case "windRotation":
        case "autoIgniteRate":
        case "regrowthRate":
        case "fireGlow":
        case "weatherChangeSpeed":
        case "rainIntensity":
        case "rainScatter":
        case "rgbEdgeStrength":
        case "audioIntensity":
        case "magicFire":
        case "panX":
        case "panY":
        case "panSpeed":
            props[key] = Number(v);
            break;
        case "treeScale":
            props.treeScale = Number(v);
            buildScaledTreeAtlas();   // rebake the pre-scaled tree sizes
            treeLayerCountdown = 0;
            break;
        case "worldSize":
            props.worldSize = Math.max(1, Number(v) || 1);
            resize();   // regenerate the (resized) world + camera bounds
            break;
        case "autoIgnite":
        case "regrowth":
        case "showSmoke":
        case "showEmbers":
        case "showFlamePlumes":
        case "heatShimmer":
        case "showWindParticles":
        case "showClouds":
        case "rainExtinguishes":
        case "showBirds":
        case "showFireflies":
        case "showLeaves":
        case "showRocks":
        case "showElevation":
        case "rgbEdgeMode":
        case "screenEffects":
        case "mousePan":
        case "mouseInteraction":
        case "audioReactive":
        case "showMouseHint":
        case "windGusts":
        case "seedFireOnStart":
        case "debugOverlay":
            props[key] = !!v;
            break;
        case "showFish":
            props.showFish = !!v;
            spawnFish();   // (re)populate or clear the fish
            break;
        case "showRivers":
        case "showLilyPads":
        case "showPaths":
            props[key] = !!v;
            needRebuild = true;
            needBg = true;
            break;
        case "season":
            props.season = String(v);
            break;
        case "seasonLength":
        case "snowAmount":
            props[key] = Number(v);
            break;
        case "weatherMode":
            props.weatherMode = String(v);
            break;
        case "weatherDirection":
            props.weatherDirection = String(v);
            break;
        case "quality":
            props.quality = String(v);
            applyQuality(props.quality);
            break;
        case "fpsCap":
            props.fpsCap = String(v);
            applyFpsCap(props.fpsCap);
            break;
        case "resetButton":
            if (v) { needRebuild = true; needBg = true; }
            break;
    }

    if (needRebuild) rebuildGrid();
    if (needBg) drawDirtBackground();
}

window.wallpaperPropertyListener = {
    applyUserProperties(properties) {
        for (const key in properties) applyProperty(key, properties[key]);
    },
    applyGeneralProperties() { },
};

// ============================================================
// Wallpaper Engine audio reactivity
// API: window.wallpaperRegisterAudioListener(cb) where cb receives 64 floats (0..1)
// ============================================================
function audioCallback(audioArray) {
    if (!audioArray || !audioArray.length) return;
    let sum = 0, bass = 0;
    const bassN = Math.min(8, audioArray.length);
    for (let i = 0; i < audioArray.length; i++) sum += audioArray[i];
    for (let i = 0; i < bassN; i++) bass += audioArray[i];
    // Smooth (exponential moving average) so flicker is gentle
    const sFull = sum / audioArray.length;
    const sBass = bass / bassN;
    audioLevel = audioLevel * 0.78 + sFull * 0.22;
    audioBass  = audioBass  * 0.70 + sBass * 0.30;
}
if (typeof window.wallpaperRegisterAudioListener === "function") {
    window.wallpaperRegisterAudioListener(audioCallback);
}

// ============================================================
// Boot
// ============================================================
applyQuality(props.quality);
applyFpsCap(props.fpsCap);
resize();
// Seed a starter fire so the wallpaper opens with visible action
if (props.seedFireOnStart) {
    setTimeout(() => {
        // near the world centre (roughly where the default camera looks)
        const x = worldPxW * (0.4 + Math.random() * 0.2);
        const y = worldPxH * (0.4 + Math.random() * 0.2);
        igniteAt(x, y, 2);
    }, 200);
}
loop();
</script>
