// Smoothly-interpolated fire-spread multiplier (drought boosts, wet damps).
function weatherFireMul() {
    return WEATHER_FIRE_MUL[weatherCurrent] || 1.0;
}
// Dryness 0..1 — peaks in drought, used for the warm/parched ambient tint.
function weatherDryness() {
    return weatherCurrent === WEATHER_DROUGHT ? (1 - weatherIntensitySmooth) : 0;
}

function targetWeatherFromMode() {
    switch (props.weatherMode) {
        case "drought": return WEATHER_DROUGHT;
        case "clear":   return WEATHER_CLEAR;
        case "cloudy":  return WEATHER_CLOUDY;
        case "rain":    return WEATHER_RAIN;
        case "monsoon": return WEATHER_MONSOON;
        case "storm":   return WEATHER_STORM;
        default: return null; // auto
    }
}

// Advance the year wheel. Auto mode drifts continuously; a forced season eases
// toward its slot along the shortest path so manual changes still transition.
function updateSeason(dt) {
    if (props.season === "auto") {
        const yearSec = Math.max(32, props.seasonLength * 4);
        seasonPos += (4 / (yearSec * SIM_BASE_HZ)) * dt;
        if (seasonPos >= 4) seasonPos -= 4;
    } else {
        const target = (SEASON_IDX[props.season] != null) ? SEASON_IDX[props.season] : 1;
        let d = target - seasonPos;
        if (d > 2) d -= 4; else if (d < -2) d += 4;           // shortest wrapped path
        const step = (0.5 / SIM_BASE_HZ) * dt;                // ~0.5 season-units / sec
        if (Math.abs(d) <= step) seasonPos = target;
        else seasonPos += Math.sign(d) * step;
        if (seasonPos >= 4) seasonPos -= 4; else if (seasonPos < 0) seasonPos += 4;
    }
    computeSeasonParams();
}

// Interpolate the look of the current moment between its two bracketing seasons.
function computeSeasonParams() {
    const p0 = Math.floor(seasonPos) % 4;
    const p1 = (p0 + 1) % 4;
    const f  = seasonPos - Math.floor(seasonPos);
    const A = SEASON_KF[p0], B = SEASON_KF[p1];
    const s = seasonParam || (seasonParam = {});
    s.tr = lerpN(A.tr, B.tr, f); s.tg = lerpN(A.tg, B.tg, f); s.tb = lerpN(A.tb, B.tb, f);
    s.ta = lerpN(A.ta, B.ta, f);
    s.desat  = lerpN(A.desat, B.desat, f);
    s.snow   = lerpN(A.snow, B.snow, f) * Math.max(0, Math.min(1.5, props.snowAmount));
    s.ice    = lerpN(A.ice, B.ice, f);
    s.leaf   = lerpN(A.leaf, B.leaf, f);
    s.bright = lerpN(A.bright, B.bright, f);
    s.mode   = (A.ta >= B.ta) ? A.mode : B.mode;
    const l0 = A.leafTint, l1 = B.leafTint;
    if (l0 && l1)      s.leafTint = [lerpN(l0[0], l1[0], f), lerpN(l0[1], l1[1], f), lerpN(l0[2], l1[2], f)];
    else if (l0 && f < 0.5) s.leafTint = l0;
    else if (l1 && f >= 0.5) s.leafTint = l1;
    else s.leafTint = null;
    return s;
}

// Falling snow — screen-space drifting flakes (decoupled from the camera, like an
// atmospheric overlay). Count scales with the current snow intensity.
function updateSnow(dt) {
    const sp = seasonParam ? seasonParam.snow : 0;
    if (sp <= 0.03) { if (snowFlakes.length) snowFlakes.length = 0; return; }
    const cap = (MAX_SNOW * qMul) | 0;
    const target = (cap * Math.min(1, sp)) | 0;
    let toSpawn = Math.min(7, target - snowFlakes.length);
    while (toSpawn-- > 0 && snowFlakes.length < cap) {
        snowFlakes.push({
            x: Math.random() * canvas.width,
            y: -5 - Math.random() * 30,
            vx: (Math.random() - 0.5) * 0.3,
            vy: 0.6 + Math.random() * 0.9,
            size: 0.8 + Math.random() * 1.7,
            sway: Math.random() * 6.28,
            swaySpd: 0.02 + Math.random() * 0.05,
            depth: 0.5 + Math.random() * 0.5,
        });
    }
    const wxF = Math.cos(windAngle) * props.windStrength;
    const W = canvas.width, H = canvas.height;
    let wI = 0;
    for (let i = 0; i < snowFlakes.length; i++) {
        const p = snowFlakes[i];
        p.sway += p.swaySpd * dt;
        p.x += (p.vx + wxF * 0.5 + Math.sin(p.sway) * 0.5) * dt;
        p.y += (p.vy * (0.7 + p.depth)) * dt;
        if (p.x < -10) p.x += W + 20; else if (p.x > W + 10) p.x -= W + 20;
        if (p.y < H + 12) snowFlakes[wI++] = p;
    }
    snowFlakes.length = wI;
}

// Cached speckle texture that adds subtle sparkle/texture to the snow blanket.
function buildSnowPattern() {
    const t = document.createElement("canvas");
    t.width = 96; t.height = 96;
    const c = t.getContext("2d");
    for (let k = 0; k < 220; k++) {
        const a = Math.random();
        c.fillStyle = a < 0.5 ? `rgba(255,255,255,${(0.15 + Math.random() * 0.3).toFixed(2)})`
                              : `rgba(196,210,232,${(0.10 + Math.random() * 0.2).toFixed(2)})`;
        c.fillRect((Math.random() * 96) | 0, (Math.random() * 96) | 0, 1, 1);
    }
    snowPattern = ctx.createPattern(t, "repeat");
}

function updateWeather(dt) {
    const forced = targetWeatherFromMode();
    if (forced !== null) {
        weatherTarget = forced;
    } else {
        // Auto-cycle: random-walk one step along the spectrum so changes are
        // gradual and sensible (never jumps sunny → storm). Mild mean-reversion
        // toward the middle keeps it from parking at an extreme.
        weatherTimer -= props.weatherChangeSpeed * dt;
        if (weatherTimer <= 0 && weatherCurrent === weatherTarget) {
            const mid = (WEATHER_COUNT - 1) / 2;
            const towardMid = weatherTarget < mid ? 0.62 : (weatherTarget > mid ? 0.38 : 0.5);
            let step = Math.random() < towardMid ? 1 : -1;
            weatherTarget = Math.max(0, Math.min(WEATHER_COUNT - 1, weatherTarget + step));
            weatherTimer = 900 + Math.random() * 2200;
        }
    }

    // Step current toward target one stage at a time, easing the blend each stage
    if (weatherCurrent !== weatherTarget) {
        weatherBlend -= (forced !== null ? 0.010 : 0.007) * props.weatherChangeSpeed * dt;
        if (weatherBlend <= 0) {
            weatherCurrent += (weatherTarget > weatherCurrent ? 1 : -1); // one stage at a time
            weatherBlend = 1.0;
        }
    }

    // Smooth moisture toward the target mode, not just the stage label.
    // This lets forced Storm/Rain begin as a light scattered front and escalate
    // gradually while weatherCurrent still walks through the intermediate modes.
    const targetIntensity = WEATHER_MOISTURE[weatherTarget];
    const intensityStep   = 0.0018 * props.weatherChangeSpeed * dt;
    if (weatherIntensitySmooth < targetIntensity) {
        weatherIntensitySmooth = Math.min(targetIntensity, weatherIntensitySmooth + intensityStep);
    } else if (weatherIntensitySmooth > targetIntensity) {
        weatherIntensitySmooth = Math.max(targetIntensity, weatherIntensitySmooth - intensityStep * 1.4);
    }

    // Front progress — advances when weather is (heading) wet, recedes when drying.
    const wantsFront    = WEATHER_MOISTURE[weatherTarget] > 0.10
                       || weatherIntensitySmooth > 0.10;
    const frontStep     = 0.0032 * props.weatherChangeSpeed * dt;
    const targetFront   = wantsFront ? 1.0 : 0.0;
    if (weatherFrontProgress < targetFront) {
        weatherFrontProgress = Math.min(1.0, weatherFrontProgress + frontStep);
    } else if (weatherFrontProgress > targetFront) {
        weatherFrontProgress = Math.max(0.0, weatherFrontProgress - frontStep);
    }
}

// Map weatherDirection property to a vector (vx, vy) and an inFront(x, y) test
function weatherFrontCovers(px, py) {
    return weatherFrontAmount(px, py) > 0.12;
}

function smooth01(t) {
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
}

function damp(base, dt) {
    return Math.pow(base, dt);
}

function rememberPos(p) {
    p.px = p.x;
    p.py = p.y;
}

function drawX(p) {
    return p.px === undefined ? p.x : p.px + (p.x - p.px) * simAlpha;
}

function drawY(p) {
    return p.py === undefined ? p.y : p.py + (p.y - p.py) * simAlpha;
}

function weatherFrontAmount(px, py) {
    if (weatherFrontProgress <= 0) return 0;
    const w = worldPxW, h = worldPxH;
    const fx = px / w;
    const fy = py / h;
    const feather = 0.16;
    let distanceInside;
    switch (props.weatherDirection) {
        case "rightToLeft":  distanceInside = fx - (1 - weatherFrontProgress); break;
        case "topToBottom":  distanceInside = weatherFrontProgress - fy; break;
        case "bottomToTop":  distanceInside = fy - (1 - weatherFrontProgress); break;
        case "static":       distanceInside = 1; break;
        case "leftToRight":
        default:             distanceInside = weatherFrontProgress - fx; break;
    }
    if (distanceInside <= 0) return 0;

    const frontSoftness = props.weatherDirection === "static"
        ? 1
        : smooth01(distanceInside / feather);
    const scatter = Math.max(0, Math.min(1, props.rainScatter));
    if (scatter <= 0.01) return frontSoftness;

    const driftX = simClock * 0.004 * Math.cos(windAngle);
    const driftY = simClock * 0.004 * Math.sin(windAngle);
    const patch = fbm(px * 0.006 + driftX, py * 0.006 + driftY, terrainSeed + 931, 3);
    const patchFactor = 1 - scatter + scatter * smooth01((patch - 0.24) / 0.56);
    return frontSoftness * patchFactor;
}

// Where new rain particles should spawn — returns (xFrac, yFrac) in 0..1
function weatherFrontSpawn() {
    const w = worldPxW, h = worldPxH;
    for (let tries = 0; tries < 24; tries++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const amount = weatherFrontAmount(x, y);
        if (amount > 0.05 && Math.random() < amount) return [x, y, amount];
    }
    switch (props.weatherDirection) {
        case "rightToLeft":  return [w * (1 - weatherFrontProgress * Math.random()), Math.random() * h, 0.5];
        case "topToBottom":  return [Math.random() * w, h * weatherFrontProgress * Math.random(), 0.5];
        case "bottomToTop":  return [Math.random() * w, h * (1 - weatherFrontProgress * Math.random()), 0.5];
        case "static":       return [Math.random() * w, Math.random() * h, 0.7];
        case "leftToRight":
        default:             return [w * weatherFrontProgress * Math.random(), Math.random() * h, 0.5];
    }
}

// ============================================================
// Clouds — large drifting dark patches that shadow the ground
// ============================================================
function spawnCloud() {
    const w = worldPxW, h = worldPxH;
    const wxF = Math.cos(windAngle);
    const wyF = Math.sin(windAngle);
    let cx, cy;
    if (Math.abs(wxF) > Math.abs(wyF)) {
        cx = wxF > 0 ? -200 : w + 200;
        cy = Math.random() * h;
    } else {
        cy = wyF > 0 ? -200 : h + 200;
        cx = Math.random() * w;
    }
    clouds.push({
        x: cx, y: cy,
        vx: wxF * 0.25,
        vy: wyF * 0.25,
        size: 180 + Math.random() * 220,
        opacity: 0.18 + Math.random() * 0.18,
    });
}

function updateClouds(dt) {
    const intensity = weatherIntensity();
    if (!props.showClouds || intensity < 0.2) {
        // Fade existing clouds out (in place)
        let writeI = 0;
        for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            c.opacity -= 0.005 * dt;
            if (c.opacity > 0) clouds[writeI++] = c;
        }
        clouds.length = writeI;
        return;
    }
    const targetClouds = Math.ceil(intensity * MAX_CLOUDS);
    if (clouds.length < targetClouds && Math.random() < 0.06 * dt) spawnCloud();

    const wxF = Math.cos(windAngle);
    const wyF = Math.sin(windAngle);
    let writeI = 0;
    for (let i = 0; i < clouds.length; i++) {
        const c = clouds[i];
        rememberPos(c);
        const cloudDamp = damp(0.97, dt);
        c.vx = c.vx * cloudDamp + wxF * 0.25 * 0.05 * (1 + props.windStrength) * dt;
        c.vy = c.vy * cloudDamp + wyF * 0.25 * 0.05 * (1 + props.windStrength) * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        if (c.x > -c.size && c.x < worldPxW + c.size
         && c.y > -c.size && c.y < worldPxH + c.size) {
            clouds[writeI++] = c;
        }
    }
    clouds.length = writeI;
}

// ============================================================
// Rain — falling streaks influenced by wind; can extinguish fires
// ============================================================
function updateRain(dt) {
    // Use smoothed intensity so escalation is gradual
    const intensity = weatherIntensitySmooth;
    const isWet = intensity > 0.05 && weatherFrontProgress > 0.01;

    if (isWet && props.rainIntensity > 0) {
        const wxF = Math.cos(windAngle);
        const wyF = Math.sin(windAngle);
        const rainSpawnFloat = Math.min(60, 18 * intensity * props.rainIntensity + 8 * intensity * intensity) * dt;
        const rainSpawn = (rainSpawnFloat | 0) + (Math.random() < (rainSpawnFloat % 1) ? 1 : 0);
        const rainCap = (MAX_RAIN * qMul) | 0;
        for (let n = 0; n < rainSpawn; n++) {
            if (rainDrops.length >= rainCap) break;
            // Spawn position constrained to the advancing, patchy front.
            const [sx, sy, localAmount] = weatherFrontSpawn();
            rainDrops.push({
                x: sx,
                y: sy - 18 - Math.random() * 32,
                vx: wxF * 2.0 * props.windStrength + (Math.random() - 0.5) * 0.75,
                vy: 7 + Math.random() * 4 + intensity * 3,
                len: (5 + Math.random() * 6 + intensity * 4) * (0.75 + localAmount * 0.5),
            });
        }

        // Occasionally extinguish a burning cell
        if (props.rainExtinguishes && burningCount > 0) {
            const tries = Math.ceil(intensity * 3);
            const cell = Math.max(2, props.cellSize | 0);
            for (let t = 0; t < tries; t++) {
                if (Math.random() < intensity * 0.6 * dt) {
                    // Find a random burning cell and extinguish it
                    const sampleStart = (Math.random() * grid.length) | 0;
                    for (let k = 0; k < 200; k++) {
                        const i = (sampleStart + k) % grid.length;
                        if (grid[i] === BURN_GRASS || grid[i] === BURN_TREE) {
                            const py = ((i / cols) | 0) * cell + cell * 0.5;
                            const px = (i % cols) * cell + cell * 0.5;
                            if (weatherFrontAmount(px, py) < Math.random() * 0.85) continue;
                            const isTree = grid[i] === BURN_TREE;
                            grid[i] = isTree ? ASH_TREE : ASH_GRASS;
                            burnTimer[i] = (isTree ? 420 : 280) + Math.random() * 300;
                            burningCount--;
                            markStaticDirty();
                            if (isTree) treeLayerCountdown = 0;   // tree vanished → refresh layer
                            // Steam puff
                            if (smokeParticles.length < MAX_SMOKE) {
                                smokeParticles.push({
                                    x: px,
                                    y: py,
                                    vx: 0, vy: -1.0,
                                    life: 0.5, size: 5, grow: 0.3,
                                });
                            }
                            break;
                        }
                    }
                }
            }
        }
    }

    // Physics + cull (in-place)
    if (rainDrops.length) {
        const maxY = worldPxH + 20;
        const minX = -50;
        const maxX = worldPxW + 50;
        let writeI = 0;
        for (let i = 0; i < rainDrops.length; i++) {
            const r = rainDrops[i];
            rememberPos(r);
            r.x += r.vx * dt;
            r.y += r.vy * dt;
            if (r.y < maxY && r.x > minX && r.x < maxX) {
                rainDrops[writeI++] = r;
            }
        }
        rainDrops.length = writeI;
    }
}

// ============================================================
// Birds (flocks crossing the screen periodically)
// ============================================================
function spawnBirdFlock() {
    const w = worldPxW, h = worldPxH;
    const side = (Math.random() * 4) | 0;
    const angle = Math.random() * 0.6 - 0.3; // mostly horizontal
    const speed = 1.4 + Math.random() * 1.0;
    let bx, by, vx, vy;
    if (side === 0)      { bx = -30; by = Math.random() * h; vx =  speed * Math.cos(angle); vy = speed * Math.sin(angle); }
    else if (side === 1) { bx = w + 30; by = Math.random() * h; vx = -speed * Math.cos(angle); vy = speed * Math.sin(angle); }
    else if (side === 2) { bx = Math.random() * w; by = -30; vx = speed * Math.sin(angle); vy =  speed * Math.cos(angle); }
    else                 { bx = Math.random() * w; by = h + 30; vx = speed * Math.sin(angle); vy = -speed * Math.cos(angle); }

    // 4–9 birds per flock with V-formation jitter
    const count = 4 + ((Math.random() * 6) | 0);
    for (let i = 0; i < count; i++) {
        // V-formation: leader at front, others trail behind on both sides
        const lag = i * 14;
        const lateral = ((i % 2) ? 1 : -1) * Math.ceil(i / 2) * 10;
        const px = bx - (vx / speed) * lag + (-vy / speed) * lateral;
        const py = by - (vy / speed) * lag + ( vx / speed) * lateral;
        birds.push({
            x: px, y: py,
            vx: vx + (Math.random() - 0.5) * 0.1,
            vy: vy + (Math.random() - 0.5) * 0.1,
            flap: Math.random() * Math.PI * 2,
            flapSpd: 0.32 + Math.random() * 0.10,
            size: 1.6 + Math.random() * 0.6,
        });
    }
}

// ============================================================
// Fireflies (subtle glowing drifters — atmosphere)
// ============================================================
function spawnFirefly() {
    fireflies.push({
        x: Math.random() * worldPxW,
        y: Math.random() * worldPxH,
        vx: (Math.random() - 0.5) * 0.30,
        vy: (Math.random() - 0.5) * 0.30,
        phase: Math.random() * Math.PI * 2,
        phaseSpd: 0.04 + Math.random() * 0.03,
        size: 1.3 + Math.random() * 0.6,
        life: 0.85 + Math.random() * 0.15,
    });
}

function spawnLeaf() {
    const w = worldPxW, h = worldPxH;
    const wxF = Math.cos(windAngle);
    const wyF = Math.sin(windAngle);
    let x, y;
    if (Math.abs(wxF) > Math.abs(wyF)) {
        x = wxF > 0 ? -10 : w + 10;
        y = Math.random() * h;
    } else {
        y = wyF > 0 ? -10 : h + 10;
        x = Math.random() * w;
    }
    // Seasonal tint overrides the default palette (gold/red in autumn, soft pink
    // blossom in spring); summer keeps the natural mixed-green palette.
    let color;
    if (seasonParam && seasonParam.leafTint) {
        const t = seasonParam.leafTint, j = 0.85 + Math.random() * 0.3;
        color = [Math.min(255, t[0] * j) | 0, Math.min(255, t[1] * j) | 0, Math.min(255, t[2] * j) | 0];
    } else {
        color = LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0];
    }
    leaves.push({
        x, y,
        vx: wxF * (0.7 + Math.random() * 1.0),
        vy: wyF * (0.7 + Math.random() * 1.0),
        size: 1.2 + Math.random() * 1.6,
        rot: Math.random() * Math.PI * 2,
        rotSpd: (Math.random() - 0.5) * 0.12,
        life: 1.0,
        color,
    });
}

// ============================================================
// Simulation update
// ============================================================
function update(dt = SIM_DT) {
    simClock += dt;
    // Wind — base + gust burst, audio bass also nudges strength briefly
    windAngle += 0.003 * props.windRotation * dt;
    const effectiveWind = props.windStrength + gustStrength + (props.audioReactive ? audioBass * 0.6 : 0);
    const wxF = Math.cos(windAngle);
    const wyF = Math.sin(windAngle);
    const wMag = 0.020 * effectiveWind;
    const wxN = wxF * wMag;
    const wyN = wyF * wMag;

    // Fire spread also responds to weather: drought fans it, wet damps it.
    const fireMul = weatherFireMul();
    const sg = BASE_SPREAD_GRASS * props.spreadRate * fireMul;
    const st = BASE_SPREAD_TREE  * props.spreadRate * fireMul;

    // Random sparks (lightning strikes / dry-heat ignitions)
    // Rate is per-weather: storm peaks, monsoon moderate, drought low but nonzero.
    if (props.autoIgnite) {
        let chance = (1 / (10 * 60)) * props.autoIgniteRate;
        const wetStormRamp = Math.max(0, Math.min(1, weatherIntensitySmooth));
        const targetLightning = WEATHER_LIGHTNING[weatherTarget] || 1;
        const currentLightning = WEATHER_LIGHTNING[weatherCurrent] || 1;
        chance *= currentLightning + (targetLightning - currentLightning) * wetStormRamp;
        if (Math.random() < chance * dt) randomSpark();
    }

    // Collect currently-burning cells so spread uses current state
    const burningList = [];
    for (let i = 0; i < grid.length; i++) {
        const s = grid[i];
        if (s === BURN_GRASS || s === BURN_TREE) burningList.push(i);
    }

    const cell = Math.max(2, props.cellSize | 0);

    for (let k = 0; k < burningList.length; k++) {
        const i = burningList[k];
        burnTimer[i] -= dt;

        const isTree = grid[i] === BURN_TREE;

        if (burnTimer[i] <= 0) {
            grid[i] = isTree ? ASH_TREE : ASH_GRASS;
            burnTimer[i] = (isTree ? 420 : 280) + Math.random() * 300;  // short smoulder phase
            fireHeat[i] = 0;
            burningCount--;
            markStaticDirty(); // grass tuft → ash patch baked
            if (isTree) treeLayerCountdown = 0;   // tree vanished → refresh layer
            continue;
        }

        const y = (i / cols) | 0;
        const x = i - y * cols;

        // --- Lifecycle: smolder → grow → blaze → die ---
        const age = burnMax[i] > 0 ? (1 - burnTimer[i] / burnMax[i]) : 0;
        const intensity = burnIntensity(age);
        // Spread gate: a cell can only spread once it's an established flame,
        // and only while it's hot. This stops the instant-leap fast spread.
        const spreadGate = Math.max(0, (intensity - 0.50)) / 0.50; // 0 until intensity>0.50 → 1

        // --- Count burning neighbours (the clustering "blaze" heat) + spread ---
        let burningNeighbors = 0;
        for (let d = 0; d < NEIGHBOURS.length; d++) {
            const dx = NEIGHBOURS[d][0];
            const dy = NEIGHBOURS[d][1];
            const nx = x + dx;
            const ny = y + dy;
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
            const ni = idx(nx, ny);
            const ns = grid[ni];
            if (ns === BURN_TREE || ns === BURN_GRASS) { burningNeighbors++; continue; }
            if (spreadGate <= 0) continue;
            let spread;
            if (ns === GRASS)      spread = sg;
            else if (ns === TREE)  spread = st;
            else continue;
            const windBonus = dx * wxN + dy * wyN;
            const chance = (spread + Math.max(0, windBonus)) * spreadGate;
            if (chance > 0 && Math.random() < chance * dt) {
                igniteCell(ni);
            }
        }

        // Heat 0..1 from neighbour density, smoothed toward the new value so a
        // packed blaze ramps up its glow rather than snapping.
        const heatTarget = burningNeighbors / 8;
        fireHeat[i] += (heatTarget - fireHeat[i]) * (1 - damp(0.75, dt));
        const heat = fireHeat[i];

        // Effective output scales with how big the flame currently is (intensity)
        // plus a conflagration bonus when surrounded by other fire (heat).
        const output = intensity * (1 + heat * 0.6);

        // Smoke — little while smoldering, billowing at blaze peak
        if (props.showSmoke && smokeParticles.length < (MAX_SMOKE * qMul) | 0) {
            const smokeChance = (isTree ? 0.11 : 0.05) * output;
            if (Math.random() < smokeChance * dt) {
                const sMag = 0.7 * props.windStrength;
                const shade = isTree
                    ? (95 + Math.random() * 90) | 0
                    : (160 + Math.random() * 70) | 0;
                smokeParticles.push({
                    x:    x * cell + cell * 0.5 + (Math.random() - 0.5) * cell,
                    y:    y * cell + cell * 0.5 + (Math.random() - 0.5) * cell,
                    vx:   wxF * sMag + (Math.random() - 0.5) * 0.4,
                    vy:   wyF * sMag + (Math.random() - 0.5) * 0.4,
                    life: isTree ? 1.0 : 0.55,
                    size: (isTree ? 4 : 2) + Math.random() * 3,
                    grow: isTree ? 0.22 : 0.10,
                    shade,
                });
            }
        }

        // Embers — more thrown from a roaring, clustered blaze
        if (props.showEmbers && embers.length < (MAX_EMBERS * qMul) | 0) {
            const emberChance = (isTree ? 0.10 : 0.025) * output;
            if (Math.random() < emberChance * dt) {
                embers.push({
                    x: x * cell + cell * 0.5,
                    y: y * cell + cell * 0.5,
                    vx: wxF * (0.9 + Math.random() * 1.2) * props.windStrength + (Math.random() - 0.5) * 1.2,
                    vy: wyF * (0.9 + Math.random() * 1.2) * props.windStrength + (Math.random() - 0.5) * 1.2,
                    life: 0.7 + Math.random() * 0.5,
                    size: 1.0 + Math.random() * 1.3,
                    phase: Math.random() * 6.28,
                });
            }
        }

        // Flame tongues — frequency AND size grow with the flame's intensity + heat.
        // Each gets a random shape "kind" + a curl direction so the fire is varied.
        if (props.showFlamePlumes && flamePlumes.length < (MAX_PLUMES * qMul) | 0) {
            const plumeChance = (isTree ? 0.34 : 0.13) * output;
            if (Math.random() < plumeChance * dt) {
                const sizeBase = (isTree ? 2.2 : 1.2) * (0.25 + intensity * 1.05) * (1 + heat * 0.7);
                // kind: 0 standard, 1 tall wispy, 2 wide squat, 3 curly licker.
                // Occasional taller flare-up at peak intensity.
                let kind = (Math.random() * 4) | 0;
                const flare = (intensity > 0.85 && Math.random() < 0.12) ? 1 : 0;
                // Magic fire: whole blocks of cells burn in one magic colour, so
                // you get coherent patches of cyan / green / purple / blue / pink
                // flame rather than washed-out confetti.
                let mtype = 0;
                if (props.magicFire > 0) {
                    const bx = (x / 6) | 0, by = (y / 6) | 0;
                    const bh = (((bx * 73856093) ^ (by * 19349663)) >>> 0) / 4294967295;
                    if (bh < props.magicFire) mtype = 1 + ((bx * 3 + by * 5) % MAGIC_FIRE.length);
                }
                flamePlumes.push({
                    x: x * cell + cell * 0.5 + jitterX[i] + (Math.random() - 0.5) * cell * 0.35,
                    y: y * cell + cell * 0.5 + jitterY[i] + (Math.random() - 0.5) * cell * 0.35,
                    vx: wxF * 0.35 * props.windStrength + (Math.random() - 0.5) * 0.5,
                    vy: wyF * 0.35 * props.windStrength - 0.25 + (Math.random() - 0.5) * 0.4,
                    size: sizeBase + Math.random() * 1.2,
                    life: 0.6 + Math.random() * 0.4,
                    phase: Math.random() * 100,
                    hot: heat,
                    kind, flare, mtype,
                    curl: (Math.random() - 0.5) * 1.6,     // sideways lick
                });
                // Crackling sparks pop off vigorous, hot flames
                if (props.showEmbers && sparks.length < (MAX_SPARKS * qMul) | 0
                    && Math.random() < (0.12 + heat * 0.3) * intensity * dt) {
                    const n = 1 + (Math.random() * 2 | 0);
                    for (let sN = 0; sN < n; sN++) {
                        sparks.push({
                            x: x * cell + cell * 0.5 + jitterX[i],
                            y: y * cell + cell * 0.5 + jitterY[i],
                            vx: wxF * 0.6 * props.windStrength + (Math.random() - 0.5) * 2.2,
                            vy: wyF * 0.6 * props.windStrength - (0.8 + Math.random() * 1.8), // shoot up
                            life: 0.5 + Math.random() * 0.5,
                            size: 0.6 + Math.random() * 0.8,
                        });
                    }
                }
            }
        }
    }

    // Ash decay + smolder embers + regrowth.
    // Succession: ash → bare dirt → grass → tree. Tree saplings strongly favour
    // ground next to surviving trees (seed fall), so forest grows back from its
    // edges and burn scars near woodland re-fuel naturally.
    // STRIDED: each tick visits 1/4 of the grid with dt×4 — statistically the
    // same rates/timers at a quarter of the per-tick scan cost.
    const regrowGrass    = props.regrowth ? 0.00016 * props.regrowthRate : 0;
    const regrowTreeBase = props.regrowth ? 0.00016 * props.regrowthRate : 0;
    // Scar weathering speed follows the regrowth-rate slider so cranking recovery
    // heals the black/grey/bare stages faster too (floor keeps it from freezing).
    const healStep = (dt * 4) * Math.max(0.5, props.regrowthRate);
    regrowPhase = (regrowPhase + 1) & 3;
    const sdt = dt * 4;
    for (let i = regrowPhase; i < grid.length; i += 4) {
        const s = grid[i];
        if (s === ASH_GRASS || s === ASH_TREE) {
            burnTimer[i] -= sdt;
            // hot smouldering ash → cold charred earth (a lingering burn scar)
            if (burnTimer[i] <= 0) {
                grid[i] = CHARRED;
                burnTimer[i] = 700 + Math.random() * 900;   // fresh char, first of several scar stages
                markStaticDirty();
                continue;
            }
            // Smoulder: fresh ash occasionally pops a tiny ember
            if (props.showEmbers && burnTimer[i] > 120
                && embers.length < (MAX_EMBERS * qMul) | 0 && Math.random() < 0.02 * sdt) {
                const y = (i / cols) | 0;
                const x = i - y * cols;
                embers.push({
                    x: x * cell + cell * 0.5 + jitterX[i] + (Math.random() - 0.5) * cell * 0.3,
                    y: y * cell + cell * 0.5 + jitterY[i] + (Math.random() - 0.5) * cell * 0.3,
                    vx: wxF * 0.25 * props.windStrength + (Math.random() - 0.5) * 0.3,
                    vy: wyF * 0.25 * props.windStrength + (Math.random() - 0.5) * 0.3,
                    life: 0.35 + Math.random() * 0.30,
                    size: 0.7 + Math.random() * 0.5,
                    phase: Math.random() * 6.28,
                });
            }
        } else if (s === CHARRED) {
            // Fresh black char cools into a grey, ash-dusted bed.
            burnTimer[i] -= healStep;
            if (burnTimer[i] <= 0) {
                grid[i] = CHAR_COOL;
                burnTimer[i] = 900 + Math.random() * 1300;
                markStaticDirty();
            }
        } else if (s === CHAR_COOL) {
            // Ash weathers away, exposing bare scorched earth.
            burnTimer[i] -= healStep;
            if (burnTimer[i] <= 0) {
                grid[i] = SCORCH;
                burnTimer[i] = 1000 + Math.random() * 1500;
                terrainRestoreDirt(i);   // clear pre-fire baked grass; scorch covers it opaquely
                markStaticDirty();
            }
        } else if (s === SCORCH) {
            // Bare burnt earth. With regrowth on, pioneers break through; otherwise
            // it lingers as a barren scar (a natural firebreak / scorched wasteland).
            if (regrowGrass > 0) {
                burnTimer[i] -= healStep;
                if (burnTimer[i] <= 0) {
                    grid[i] = SPROUT;
                    burnTimer[i] = 500 + Math.random() * 700;
                    markStaticDirty();
                }
            }
        } else if (s === SPROUT) {
            // First green fills in → full grass. Burn scars regrow flower-rich
            // (fireweed / poppies bloom after a fire).
            burnTimer[i] -= healStep;
            if (burnTimer[i] <= 0) {
                grid[i] = GRASS;
                grassVar[i] = pickRegrowthVariant();
                terrainDrawGrass(i);
            }
        } else if (s === DIRT && regrowGrass > 0) {
            if (Math.random() < regrowGrass * sdt) {
                grid[i] = GRASS;
                grassVar[i] = pickGrassVariant();
                terrainDrawGrass(i); // incremental: stamp the new tuft onto terrain
            }
        } else if (s === GRASS && regrowTreeBase > 0) {
            // Cheap pre-roll, then a neighbour check decides if a sapling takes.
            if (Math.random() < regrowTreeBase * sdt) {
                const y = (i / cols) | 0, x = i - y * cols;
                let treeNeighbors = 0;
                for (let d = 0; d < NEIGHBOURS.length; d++) {
                    const nx = x + NEIGHBOURS[d][0];
                    const ny = y + NEIGHBOURS[d][1];
                    if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
                    const ns = grid[idx(nx, ny)];
                    if (ns === TREE || ns === BURN_TREE) treeNeighbors++;
                }
                // Near woodland: saplings take readily. Out in the open: rarely.
                const take = treeNeighbors > 0 ? 0.80 : 0.06;
                if (Math.random() < take) {
                    grid[i] = TREE;
                    treeVar[i] = pickTreeVariant();
                    treeGrowth[i] = 0.12 + Math.random() * 0.08; // starts as a sapling
                    treeLayerCountdown = 0;   // new sapling → refresh layer
                    // grass tuft already baked under the new tree — no terrain edit needed
                }
            }
        } else if (s === TREE && treeGrowth[i] < 1) {
            // Saplings mature into full trees over ~1–2 minutes
            treeGrowth[i] = Math.min(1, treeGrowth[i] + 0.00045 * Math.max(0.4, props.regrowthRate) * sdt);
        }
    }

    // Wind gusts — occasional burst that shifts angle and boosts speed briefly
    if (props.windGusts) {
        nextGustAt -= dt;
        if (nextGustAt <= 0 && gustTimer <= 0) {
            // Stormier weather makes gusts more frequent and stronger
            const storm = (weatherCurrent >= WEATHER_MONSOON) ? 1 : 0;
            gustStrength = 0.7 + Math.random() * (0.9 + storm * 0.6);
            gustTimer    = 45 + (Math.random() * 60) | 0;
            windAngle   += (Math.random() - 0.5) * (0.6 + storm * 0.4);
            nextGustAt   = (500 + Math.random() * 900) | 0;
        }
        if (gustTimer > 0) {
            gustTimer -= dt;
            gustStrength *= damp(0.985, dt);
        } else {
            gustStrength = 0;
        }
    }

    // Periodically resync glowing-mushroom spots (handles burn/regrowth changes)
    glowRefreshAt -= dt;
    if (glowRefreshAt <= 0) refreshGlowSpots();

    // Fish glide in the water
    updateFish(dt);

    // Seasons — slow year cycle that re-colours everything + drives snow/leaves
    updateSeason(dt);
    updateSnow(dt);

    // Weather + lightning bolts (+ persistent strike afterglow)
    updateWeather(dt);
    updateClouds(dt);
    updateRain(dt);
    updateLightning(dt);
    updateLightningGlows(dt);

    // Decay RGB vignette pulse
    if (rgbVignettePulse > 0) rgbVignettePulse = Math.max(0, rgbVignettePulse - 0.02 * dt);

    // Bird flocks — spawn rarely, drift across (skip in storms)
    // Birds keep clear of heavy weather (monsoon / storm)
    if (props.showBirds && weatherCurrent < WEATHER_MONSOON
        && birds.length < (60 * qMul) | 0 && Math.random() < 0.0008 * dt) spawnBirdFlock();
    if (birds.length) {
        const minX = -60, maxX = worldPxW + 60;
        const minY = -60, maxY = worldPxH + 60;
        // Pre-compute the fire centroid (steer-away anchor) once per tick
        let fcx = 0, fcy = 0, fcn = 0;
        if (burningCount > 0) {
            // Cheap sample: scan ~120 grid positions, accumulate centers of burning cells
            const step = Math.max(1, (grid.length / 120) | 0);
            for (let i = 0; i < grid.length; i += step) {
                if (grid[i] === BURN_TREE || grid[i] === BURN_GRASS) {
                    const yc = (i / cols) | 0;
                    const xc = i - yc * cols;
                    fcx += xc * cell + cell * 0.5;
                    fcy += yc * cell + cell * 0.5;
                    fcn++;
                }
            }
            if (fcn > 0) { fcx /= fcn; fcy /= fcn; }
        }
        let writeI = 0;
        for (let i = 0; i < birds.length; i++) {
            const b = birds[i];
            rememberPos(b);
            // Steer away from fire centroid when nearby
            if (fcn > 0) {
                const dx = b.x - fcx, dy = b.y - fcy;
                const d2 = dx * dx + dy * dy;
                const reach = 160 + Math.min(120, fcn * 8);
                if (d2 < reach * reach) {
                    const d = Math.sqrt(d2) || 1;
                    const push = (1 - d / reach) * 0.45;
                    b.vx += (dx / d) * push * dt;
                    b.vy += (dy / d) * push * 0.5 * dt;
                    // Renormalize speed so they don't accelerate forever
                    const sp = Math.hypot(b.vx, b.vy);
                    const targetSp = 1.6;
                    if (sp > 0) {
                        b.vx = (b.vx / sp) * targetSp;
                        b.vy = (b.vy / sp) * targetSp;
                    }
                }
            }
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.flap += b.flapSpd * dt;
            if (b.x > minX && b.x < maxX && b.y > minY && b.y < maxY) {
                birds[writeI++] = b;
            }
        }
        birds.length = writeI;
    }

    // Fireflies — slowly populate up to a target count, drift gently with phase glow
    const TARGET_FIREFLIES = props.showFireflies ? ((40 * qMul) | 0) : 0;
    if (fireflies.length < TARGET_FIREFLIES && Math.random() < 0.05 * dt) spawnFirefly();
    if (!props.showFireflies && fireflies.length) fireflies = [];
    if (fireflies.length) {
        for (const f of fireflies) {
            rememberPos(f);
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            f.vx += (Math.random() - 0.5) * 0.06 * dt;
            f.vy += (Math.random() - 0.5) * 0.06 * dt;
            const fireflyDamp = damp(0.96, dt);
            f.vx *= fireflyDamp;
            f.vy *= fireflyDamp;
            f.phase += f.phaseSpd * dt;
            // Wrap edges
            if (f.x < -10) f.x = worldPxW + 10;
            if (f.x > worldPxW + 10) f.x = -10;
            if (f.y < -10) f.y = worldPxH + 10;
            if (f.y > worldPxH + 10) f.y = -10;
        }
    }

    // Ambient leaves drifting in wind (independent of fire). Season drives the
    // volume: a blizzard of leaf-fall in autumn, a few blossom petals in spring,
    // suppressed under deep-winter snow.
    const seasonLeaf = seasonParam ? seasonParam.leaf : 1;
    const leafActive = (seasonParam ? seasonParam.snow : 0) < 0.5;
    if (props.showLeaves && leafActive && props.showWindParticles && props.windStrength > 0.05) {
        const spawnRate = 0.25 * Math.min(1, props.windStrength) * (0.2 + seasonLeaf * 2.6);
        if (leaves.length < (MAX_LEAVES * qMul) | 0 && Math.random() < spawnRate * dt) spawnLeaf();
        const wxL = wxF * 0.05 * props.windStrength;
        const wyL = wyF * 0.05 * props.windStrength;
        const minX = -25, maxX = worldPxW + 25;
        const minY = -25, maxY = worldPxH + 25;
        let writeI = 0;
        for (let i = 0; i < leaves.length; i++) {
            const p = leaves[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const leafDamp = damp(0.985, dt);
            p.vx = p.vx * leafDamp + (wxL + (Math.random() - 0.5) * 0.12) * dt;
            p.vy = p.vy * leafDamp + (wyL + (Math.random() - 0.5) * 0.12) * dt;
            p.rot += p.rotSpd * dt;
            p.life -= 0.0022 * dt;
            if (p.life > 0 && p.x > minX && p.x < maxX && p.y > minY && p.y < maxY) {
                leaves[writeI++] = p;
            }
        }
        leaves.length = writeI;
    } else if (leaves.length) {
        leaves.length = 0;
    }

    // Smoke physics (in-place compaction — no per-frame allocation)
    if (smokeParticles.length) {
        const wxA = wxF * 0.10 * props.windStrength;
        const wyA = wyF * 0.10 * props.windStrength;
        let writeI = 0;
        for (let i = 0; i < smokeParticles.length; i++) {
            const p = smokeParticles[i];
            rememberPos(p);
            p.x += (p.vx + wxA) * dt;
            p.y += (p.vy + wyA) * dt;
            const smokeDamp = damp(0.985, dt);
            p.vx *= smokeDamp;
            p.vy *= smokeDamp;
            p.size += p.grow * dt;
            p.life -= 0.0075 * dt;
            if (p.life > 0) smokeParticles[writeI++] = p;
        }
        smokeParticles.length = writeI;
    }

    // Flame plume physics (in-place compaction)
    if (flamePlumes.length) {
        const wxA = wxF * 0.06 * props.windStrength;
        const wyA = wyF * 0.06 * props.windStrength;
        let writeI = 0;
        for (let i = 0; i < flamePlumes.length; i++) {
            const p = flamePlumes[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const plumeDamp = damp(0.93, dt);
            p.vx = p.vx * plumeDamp + wxA * dt;
            p.vy = p.vy * plumeDamp + wyA * dt;
            p.size *= damp(1.038, dt);
            p.life -= 0.043 * dt;
            p.phase += dt;
            if (p.life > 0) flamePlumes[writeI++] = p;
        }
        flamePlumes.length = writeI;
    }

    // Spark physics — shoot up, slow, arc back down a touch, flicker out fast
    if (sparks.length) {
        let writeI = 0;
        for (let i = 0; i < sparks.length; i++) {
            const p = sparks[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 0.07 * dt;          // gravity arcs them back down
            p.vx *= damp(0.96, dt);
            p.life -= 0.028 * dt;
            if (p.life > 0) sparks[writeI++] = p;
        }
        sparks.length = writeI;
    }

    // Ember physics (in-place compaction; can ignite cells they land on)
    if (embers.length) {
        const wxA = wxF * 0.08 * props.windStrength;
        const wyA = wyF * 0.08 * props.windStrength;
        const igniteChance = 0.00028 * props.spreadRate;  // rarer spot-fires (lush forest)
        let writeI = 0;
        for (let i = 0; i < embers.length; i++) {
            const p = embers[i];
            rememberPos(p);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            const emberDamp = damp(0.94, dt);
            p.vx = p.vx * emberDamp + wxA * dt;
            p.vy = p.vy * emberDamp + wyA * dt;
            p.life -= 0.022 * dt;
            if (p.life > 0) {
                if (Math.random() < igniteChance * dt) {
                    const cx = (p.x / cell) | 0;
                    const cy = (p.y / cell) | 0;
                    if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
                        igniteCell(idx(cx, cy));
                    }
                }
                embers[writeI++] = p;
            }
        }
        embers.length = writeI;
    }

    // Wind streaks (subtle ground-level dust trails in wind direction)
    if (props.showWindParticles && props.windStrength > 0.05) {
        if (windStreaks.length < (MAX_WIND_PARTS * qMul) | 0 && Math.random() < 0.5 * dt) {
            const w = worldPxW, h = worldPxH;
            let x, y;
            if (Math.abs(wxF) > Math.abs(wyF)) {
                x = wxF > 0 ? -10 : w + 10;
                y = Math.random() * h;
            } else {
                y = wyF > 0 ? -10 : h + 10;
                x = Math.random() * w;
            }
            windStreaks.push({
                x, y,
                len: 10 + Math.random() * 24,
                life: 1.0,
                speed: 1.0 + Math.random() * 1.8,
            });
        }
        const minX = -60, maxX = worldPxW + 60;
        const minY = -60, maxY = worldPxH + 60;
        let writeI = 0;
        for (let i = 0; i < windStreaks.length; i++) {
            const p = windStreaks[i];
            rememberPos(p);
            p.x += wxF * p.speed * props.windStrength * dt;
            p.y += wyF * p.speed * props.windStrength * dt;
            p.life -= 0.005 * dt;
            if (p.life > 0 && p.x > minX && p.x < maxX && p.y > minY && p.y < maxY) {
                windStreaks[writeI++] = p;
            }
        }
        windStreaks.length = writeI;
    } else if (windStreaks.length) {
        windStreaks.length = 0;
    }
}

// ============================================================
// Static-layer cache (water/paths/grass/rocks/ash baked together)
// ============================================================
function markStaticDirty() { staticDirty = true; }
function markTerrainDirty() { terrainDirty = true; staticDirty = true; }

// Incremental terrain edits — update a single cell on the baked terrain canvas
// instead of re-baking the whole thing (which includes the costly water blur).
// Used by regrowth so the forest can recover without per-event rebake hitches.
function terrainDrawGrass(i) {
    if (!terrainCanvas) { markTerrainDirty(); return; }
    const cell = Math.max(2, props.cellSize | 0);
    const y = (i / cols) | 0, x = i - y * cols;
    terrainCtx.drawImage(grassSprites, grassVar[i] * grassSpW, 0, grassSpW, grassSpH,
                         x * cell, y * cell, grassSpW, grassSpH);
    markStaticDirty();
}
function terrainRestoreDirt(i) {
    if (!terrainCanvas) { markTerrainDirty(); return; }
    const cell = Math.max(2, props.cellSize | 0);
    const y = (i / cols) | 0, x = i - y * cols;
    // Repaint the bare dirt background for this one cell (clears baked grass)
    terrainCtx.drawImage(bgCanvas, x * cell, y * cell, cell, cell,
                         x * cell, y * cell, cell, cell);
    markStaticDirty();
}

// Bake the worldgen-static terrain (dirt + water + paths + lily pads + rocks).
// None of this changes when cells burn/regrow, so it's baked once per world —
// keeping the expensive blurred-water passes out of the per-frame static rebuild.
function bakeTerrain() {
    if (!terrainCanvas) {
        terrainCanvas = document.createElement("canvas");
        terrainCtx    = terrainCanvas.getContext("2d");
    }
    if (terrainCanvas.width !== worldPxW || terrainCanvas.height !== worldPxH) {
        terrainCanvas.width  = worldPxW;
        terrainCanvas.height = worldPxH;
    }
    const sc = terrainCtx;
    const w = terrainCanvas.width;
    const h = terrainCanvas.height;
    const cell = Math.max(2, props.cellSize | 0);

    sc.clearRect(0, 0, w, h);
    sc.drawImage(bgCanvas, 0, 0);

    // ---- Water (baked) ----
    // Smooth shorelines: uniform colors per layer so overlapping discs MERGE
    // seamlessly (no scalloped ring artifacts from per-disc color or alpha).
    //
    // Layer order at a shoreline cell, outer→inner:
    //   shallow teal rim  →  deep blue body (interior)
    const WATER_DEEP    = "#2a5e96";   // deep body
    const WATER_SHALLOW = "#5aa6c8";   // lighter near shore
    const WATER_DEEP_REFLECT = "#2f6e72"; // greenish deep where trees overhang

    // Smooth water via an offscreen blurred mask — eliminates per-cell disc
    // scalloping. Build a binary water-cell rect mask, blur it, and composite
    // layers from larger (shore) to smaller (deep) so the shoreline is even.
    if (!waterMask) {
        waterMask = document.createElement("canvas");
        waterMaskCtx = waterMask.getContext("2d");
    }
    if (waterMask.width !== w || waterMask.height !== h) {
        waterMask.width = w; waterMask.height = h;
    }
    const mc = waterMaskCtx;
    const blurPx = Math.max(1, (cell * 0.42) | 0);

    // Reusable: fill a set of cells (predicate) as overlapping rects on the mask
    const paintMask = (color, predicate, pad) => {
        mc.clearRect(0, 0, w, h);
        mc.fillStyle = color;
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const i = y * cols + x;
                if (grid[i] !== WATER) continue;
                if (predicate && !predicate(x, y, i)) continue;
                mc.fillRect(x * cell - pad, y * cell - pad, cell + pad * 2, cell + pad * 2);
            }
        }
    };

    // 1) Shallow halo — all water cells, blurred → smooth soft outer shape
    paintMask(WATER_SHALLOW, null, 1);
    sc.save();
    sc.filter = `blur(${blurPx}px)`;
    sc.drawImage(waterMask, 0, 0);
    // draw twice to firm up opacity (blur thins it out)
    sc.drawImage(waterMask, 0, 0);
    sc.restore();

    // 2) Deep body — interior cells only (erode by 1), blurred → soft deep,
    //    leaving an even shallow rim at the shore
    const isInterior = (x, y) => {
        for (let d = 0; d < NEIGHBOURS.length; d++) {
            const nx = x + NEIGHBOURS[d][0];
            const ny = y + NEIGHBOURS[d][1];
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return false;
            if (grid[idx(nx, ny)] !== WATER) return false;
        }
        return true;
    };
    paintMask(WATER_DEEP, isInterior, 1);
    sc.save();
    sc.filter = `blur(${blurPx}px)`;
    sc.drawImage(waterMask, 0, 0);
    sc.drawImage(waterMask, 0, 0);
    sc.restore();

    // 3) Greenish reflection where trees overhang — interior reflect cells, blurred
    paintMask(WATER_DEEP_REFLECT, (x, y, i) => isInterior(x, y) && (waterPhase[i] & 0x10), 1);
    sc.save();
    sc.filter = `blur(${blurPx}px)`;
    sc.globalAlpha = 0.85;
    sc.drawImage(waterMask, 0, 0);
    sc.restore();
    // 4) Lily pads
    for (let y = 0; y < rows; y++) {
        const rowBase = y * cols;
        for (let x = 0; x < cols; x++) {
            const i = rowBase + x;
            if (grid[i] !== WATER || !(waterPhase[i] & 0x40)) continue;
            const cxP = x * cell + cell * 0.5;
            const cyP = y * cell + cell * 0.5;
            const padR = cell * 0.36;
            sc.fillStyle = "rgba(0,30,40,0.40)";
            sc.beginPath(); sc.arc(cxP + 0.6, cyP + 0.8, padR, 0, Math.PI * 2); sc.fill();
            sc.fillStyle = "rgb(36,80,32)";
            sc.beginPath(); sc.arc(cxP, cyP, padR, 0, Math.PI * 2); sc.fill();
            sc.fillStyle = "rgb(62,118,48)";
            sc.beginPath(); sc.arc(cxP - padR * 0.15, cyP - padR * 0.15, padR * 0.72, 0, Math.PI * 2); sc.fill();
            sc.fillStyle = "rgb(28,72,108)";
            sc.beginPath();
            sc.moveTo(cxP, cyP);
            sc.lineTo(cxP + padR * 1.05, cyP - padR * 0.10);
            sc.lineTo(cxP + padR * 1.05, cyP + padR * 0.10);
            sc.closePath();
            sc.fill();
            if (waterPhase[i] & 0x20) {
                sc.fillStyle = "rgba(255,228,232,0.95)";
                sc.beginPath(); sc.arc(cxP - padR * 0.18, cyP - padR * 0.18, padR * 0.30, 0, Math.PI * 2); sc.fill();
                sc.fillStyle = "rgba(255,240,120,0.95)";
                sc.beginPath(); sc.arc(cxP - padR * 0.18, cyP - padR * 0.18, padR * 0.12, 0, Math.PI * 2); sc.fill();
            }
        }
    }
    // 5) Dirt paths — soft, blurred worn-earth trails that melt into the ground
    //    (no hard grid tiles). Painted as overlapping discs on the mask, blurred,
    //    and composited at low opacity so it reads as packed earth, not a road.
    {
        let anyPath = false;
        mc.clearRect(0, 0, w, h);
        mc.fillStyle = "#7a5c39"; // packed sandy earth — clearly lighter than dirt
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const i = y * cols + x;
                if (grid[i] !== DIRT || !(waterPhase[i] & 0x80)) continue;
                anyPath = true;
                const cxP = x * cell + cell * 0.5;
                const cyP = y * cell + cell * 0.5;
                mc.beginPath();
                mc.arc(cxP, cyP, cell * 0.82, 0, Math.PI * 2);
                mc.fill();
            }
        }
        if (anyPath) {
            // Lighter blur than water — paths are thin trails, so a big blur would
            // wash the colour out. Keep edges soft but the trail clearly visible.
            const pathBlur = Math.max(1, (cell * 0.22) | 0);
            sc.save();
            sc.filter = `blur(${pathBlur}px)`;
            sc.globalAlpha = 0.7;
            sc.drawImage(waterMask, 0, 0);
            sc.drawImage(waterMask, 0, 0); // second draw firms up the colour
            sc.restore();
        }
    }

    // ---- Rocks (worldgen-static) ----
    for (let y = 0; y < rows; y++) {
        const rowBase = y * cols;
        for (let x = 0; x < cols; x++) {
            const i = rowBase + x;
            if (grid[i] !== ROCK) continue;
            const px = x * cell + jitterX[i] * 0.4;
            const py = y * cell + jitterY[i] * 0.4;
            sc.drawImage(rockSprites, rockVar[i] * rockSpW, 0, rockSpW, rockSpH,
                         px, py, rockSpW, rockSpH);
        }
    }

    // ---- Grass tufts (rarely change; baked here so the per-fire static
    //      rebuild stays cheap). Drawn under grass / tree / burning-tree cells.
    //      A burned cell keeps its grass baked underneath — the ash patch is
    //      drawn over it in the static layer, so it's hidden until ash→dirt
    //      (which marks terrain dirty to clear the stale grass).
    for (let y = 0; y < rows; y++) {
        const rowBase = y * cols;
        for (let x = 0; x < cols; x++) {
            const i = rowBase + x;
            const s = grid[i];
            if (s !== GRASS && s !== TREE && s !== BURN_GRASS && s !== BURN_TREE) continue;
            sc.drawImage(grassSprites, grassVar[i] * grassSpW, 0, grassSpW, grassSpH,
                         x * cell, y * cell, grassSpW, grassSpH);
        }
    }

    terrainDirty = false;
}

// Composite the cached terrain with the layers that DO change as cells burn/regrow
// (grass tufts + ash). Cheap — no blur, just sprite blits.
// Deterministic 0..1 hash for a cell seed + sub-index — lets a cell scatter
// several stable details (no per-rebuild shimmer, no allocation).
function hash01(seed, n) {
    let h = (seed ^ Math.imul(n, 0x9e3779b9)) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Build a clip path for a burn-scar cell that BORDERS WATER: the water-facing
// edges are pulled in and rounded so the opaque scar recedes organically from
// the shoreline (revealing the soft bank beneath) instead of cutting a hard
// square into the river. Land-facing edges stay at full extent (square corners)
// so adjacent scar cells still tile seamlessly with no gaps.
function scarLandPath(c, px, py, cell, wN, wE, wS, wW) {
    const inset = cell * 0.34;
    const rad = cell * 0.30;
    const xL = px + (wW ? inset : 0);
    const xR = px + cell - (wE ? inset : 0);
    const yT = py + (wN ? inset : 0);
    const yB = py + cell - (wS ? inset : 0);
    const rTL = (wN || wW) ? rad : 0;
    const rTR = (wN || wE) ? rad : 0;
    const rBR = (wS || wE) ? rad : 0;
    const rBL = (wS || wW) ? rad : 0;
    c.beginPath();
    c.moveTo(xL + rTL, yT);
    c.lineTo(xR - rTR, yT);
    if (rTR) c.arcTo(xR, yT, xR, yT + rTR, rTR); else c.lineTo(xR, yT);
    c.lineTo(xR, yB - rBR);
    if (rBR) c.arcTo(xR, yB, xR - rBR, yB, rBR); else c.lineTo(xR, yB);
    c.lineTo(xL + rBL, yB);
    if (rBL) c.arcTo(xL, yB, xL, yB - rBL, rBL); else c.lineTo(xL, yB);
    c.lineTo(xL, yT + rTL);
    if (rTL) c.arcTo(xL, yT, xL + rTL, yT, rTL); else c.lineTo(xL, yT);
    c.closePath();
}

function renderStaticLayer() {
    if (!staticCanvas) {
        staticCanvas = document.createElement("canvas");
        staticCtx    = staticCanvas.getContext("2d");
    }
    if (staticCanvas.width !== worldPxW || staticCanvas.height !== worldPxH) {
        staticCanvas.width  = worldPxW;
        staticCanvas.height = worldPxH;
    }
    if (terrainDirty) bakeTerrain();

    const sc = staticCtx;
    const w = staticCanvas.width;
    const h = staticCanvas.height;
    const cell = Math.max(2, props.cellSize | 0);

    sc.clearRect(0, 0, w, h);
    sc.drawImage(terrainCanvas, 0, 0);

    // ---- Burn states: smouldering ash, then cold charred-earth scars ----
    for (let y = 0; y < rows; y++) {
        const rowBase = y * cols;
        for (let x = 0; x < cols; x++) {
            const i = rowBase + x;
            const s = grid[i];
            const px = x * cell;
            const py = y * cell;
            // Burn-scar cells that touch water get an organic, receded edge so the
            // opaque scar melts into the river bank instead of cutting a hard
            // square. Only the few shoreline scar cells pay the clip cost.
            let clipped = false;
            if (s === ASH_GRASS || s === ASH_TREE || s === CHARRED ||
                s === CHAR_COOL || s === SCORCH || s === SPROUT) {
                const wN = y > 0        && grid[i - cols] === WATER;
                const wS = y < rows - 1 && grid[i + cols] === WATER;
                const wW = x > 0        && grid[i - 1]    === WATER;
                const wE = x < cols - 1 && grid[i + 1]    === WATER;
                if (wN || wS || wW || wE) {
                    sc.save();
                    scarLandPath(sc, px, py, cell, wN, wE, wS, wW);
                    sc.clip();
                    clipped = true;
                }
            }
            if (s === ASH_GRASS) {
                sc.fillStyle = "rgba(26,15,9,0.78)";       // warm-black smouldering ash
                sc.fillRect(px, py, cell, cell);
            } else if (s === ASH_TREE) {
                const ax = px + cell * 0.5 + jitterX[i];
                const ay = py + cell * 0.5 + jitterY[i];
                sc.fillStyle = "rgba(14,8,5,0.9)";
                sc.beginPath();
                sc.arc(ax, ay, cell * 0.52, 0, Math.PI * 2);
                sc.fill();
                sc.fillStyle = "rgba(40,24,12,1)";          // charred stump
                sc.beginPath();
                sc.arc(ax, ay, Math.max(1, cell * 0.13), 0, Math.PI * 2);
                sc.fill();
            } else if (s === CHARRED) {
                // Fresh black char — opaque, charcoal chunks + deep crack, with a
                // faint warm ember still lurking in the crack.
                const seed = (i * 2654435761) >>> 0;
                sc.fillStyle = "#140f0c";
                sc.fillRect(px, py, cell, cell);
                sc.fillStyle = "rgba(48,41,36,0.6)";        // charcoal chunk
                sc.fillRect(px + hash01(seed, 1) * cell * 0.6, py + hash01(seed, 2) * cell * 0.6,
                            Math.max(1, (cell * 0.36) | 0), Math.max(1, (cell * 0.34) | 0));
                sc.fillStyle = "rgba(33,27,23,0.6)";
                sc.fillRect(px + hash01(seed, 3) * cell * 0.7, py + hash01(seed, 4) * cell * 0.7,
                            Math.max(1, (cell * 0.28) | 0), Math.max(1, (cell * 0.26) | 0));
                sc.fillStyle = "rgba(4,3,2,0.9)";           // deep crack
                sc.fillRect((px + hash01(seed, 5) * cell) | 0, py, 1, cell);
                if ((seed & 7) < 3) {                        // warm ember in the crack
                    sc.fillStyle = "rgba(156,48,12,0.5)";
                    sc.fillRect((px + hash01(seed, 6) * cell) | 0, py + hash01(seed, 7) * cell,
                                1, Math.max(1, (cell * 0.32) | 0));
                }
            } else if (s === CHAR_COOL) {
                // Cooled grey charcoal + settled ash — warmth gone, pale ash dusts it.
                const seed = (i * 2654435761) >>> 0;
                sc.fillStyle = "#272019";
                sc.fillRect(px, py, cell, cell);
                sc.fillStyle = "rgba(76,69,61,0.6)";        // grey charcoal lump
                sc.fillRect(px + hash01(seed, 1) * cell * 0.6, py + hash01(seed, 2) * cell * 0.6,
                            Math.max(1, (cell * 0.34) | 0), Math.max(1, (cell * 0.3) | 0));
                sc.fillStyle = "rgba(15,11,9,0.8)";         // black bit
                sc.fillRect(px + hash01(seed, 3) * cell * 0.8, py + hash01(seed, 4) * cell * 0.8,
                            Math.max(1, (cell * 0.2) | 0), Math.max(1, (cell * 0.2) | 0));
                sc.fillStyle = "rgba(170,162,150,0.5)";     // pale ash dusting
                for (let a = 0; a < 4; a++) {
                    sc.fillRect((px + hash01(seed, 10 + a) * cell) | 0,
                                (py + hash01(seed, 20 + a) * cell) | 0, 1, 1);
                }
            } else if (s === SCORCH) {
                // Bare scorched earth — burnt-umber dirt, charcoal flecks, faint crack.
                const seed = (i * 2654435761) >>> 0;
                sc.fillStyle = "#3a2a1c";
                sc.fillRect(px, py, cell, cell);
                sc.fillStyle = "rgba(88,65,44,0.45)";       // recovering-dirt mottle
                sc.fillRect(px + hash01(seed, 1) * cell * 0.6, py + hash01(seed, 2) * cell * 0.6,
                            Math.max(1, (cell * 0.4) | 0), Math.max(1, (cell * 0.34) | 0));
                sc.fillStyle = "rgba(20,14,10,0.8)";        // charcoal flecks
                for (let a = 0; a < 3; a++) {
                    sc.fillRect((px + hash01(seed, 5 + a) * cell) | 0,
                                (py + hash01(seed, 8 + a) * cell) | 0, 1, 1);
                }
                sc.fillStyle = "rgba(28,18,10,0.55)";       // crack
                sc.fillRect(px, (py + hash01(seed, 15) * cell) | 0, cell, 1);
                if ((seed & 3) === 0) {                      // pale ash bit
                    sc.fillStyle = "rgba(150,140,126,0.4)";
                    sc.fillRect((px + hash01(seed, 16) * cell) | 0, (py + hash01(seed, 17) * cell) | 0, 1, 1);
                }
            } else if (s === SPROUT) {
                // Pioneer regrowth — scorched dirt with first moss + tiny green sprouts.
                const seed = (i * 2654435761) >>> 0;
                sc.fillStyle = "#3f2f20";                   // slightly recovered earth
                sc.fillRect(px, py, cell, cell);
                sc.fillStyle = "rgba(24,16,11,0.7)";        // lingering charcoal fleck
                sc.fillRect((px + hash01(seed, 1) * cell) | 0, (py + hash01(seed, 2) * cell) | 0, 1, 1);
                sc.fillStyle = "rgba(72,112,46,0.55)";      // moss patch
                sc.fillRect(px + hash01(seed, 3) * cell * 0.6, py + cell * 0.5 + hash01(seed, 4) * cell * 0.4,
                            Math.max(1, (cell * 0.3) | 0), Math.max(1, (cell * 0.22) | 0));
                const sprouts = 3 + ((seed >> 5) & 1) + ((seed >> 6) & 1);
                sc.strokeStyle = "rgba(98,152,58,0.85)";    // tiny green sprout blades
                sc.lineWidth = 1;
                sc.beginPath();
                for (let a = 0; a < sprouts; a++) {
                    const sxp = px + hash01(seed, 30 + a) * cell;
                    const syb = py + cell - 1;
                    const sh  = Math.max(2, cell * (0.22 + hash01(seed, 40 + a) * 0.2));
                    sc.moveTo(sxp, syb);
                    sc.lineTo(sxp + (hash01(seed, 50 + a) - 0.5) * 2, syb - sh);
                }
                sc.stroke();
                if ((seed & 7) === 0) {                      // first pioneer flower bud
                    sc.fillStyle = (seed & 8) ? "rgba(232,90,120,0.9)" : "rgba(248,210,90,0.9)";
                    sc.fillRect((px + hash01(seed, 60) * cell) | 0, (py + hash01(seed, 61) * cell * 0.6) | 0, 1, 1);
                }
            }
            if (clipped) sc.restore();
        }
    }

    staticDirty = false;
    staticThrottle = STATIC_REBUILD_MIN_GAP;
}

// ============================================================
// Render
// ============================================================
function updateCamera() {
    const maxX = Math.max(0, worldPxW - canvas.width);
    const maxY = Math.max(0, worldPxH - canvas.height);
    if (props.mousePan && mouseInside && (maxX > 0 || maxY > 0)) {
        // View slews toward the mouse: off-centre mouse → pan that way.
        const cxs = canvas.width * 0.5, cys = canvas.height * 0.5;
        let nx = (mouseX - cxs) / cxs;
        let ny = (mouseY - cys) / cys;
        const dead = 0.12;                      // small dead-zone near centre
        if (Math.abs(nx) < dead) nx = 0;
        if (Math.abs(ny) < dead) ny = 0;
        const sp = 3.2 * props.panSpeed;
        camX += nx * sp;
        camY += ny * sp;
    } else if (!props.mousePan) {
        // Ease toward the manual pan position
        camX += (props.panX * maxX - camX) * 0.08;
        camY += (props.panY * maxY - camY) * 0.08;
    }
    camX = Math.max(0, Math.min(maxX, camX));
    camY = Math.max(0, Math.min(maxY, camY));
}

// Blit only the visible window of a world-sized cached canvas (drawn in world
// coords, under the camera translate) — avoids processing the whole big canvas.
function drawWorldLayer(src, cx, cy, vw, vh) {
    cx = cx | 0; cy = cy | 0;
    const sw = Math.min(vw, src.width - cx);
    const sh = Math.min(vh, src.height - cy);
    if (sw > 0 && sh > 0) ctx.drawImage(src, cx, cy, sw, sh, cx, cy, sw, sh);
}

function render() {
    const w = canvas.width;
    const h = canvas.height;
    const cell = Math.max(2, props.cellSize | 0);

    updateCamera();

    // Background: cached static layer (dirt + water + paths + grass + rocks + ash)
    if (staticDirty && staticThrottle <= 0) renderStaticLayer();
    if (staticThrottle > 0) staticThrottle--;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // Shift into world space for the camera; world layers draw at world coords and
    // only the visible window lands on screen.
    ctx.translate(-camX, -camY);
    // Blit only the visible region of the (large) world ground canvas — cheap.
    drawWorldLayer(staticCanvas, camX, camY, w, h);

    // Cheap water sparkles + ripple bands (animated on top of baked water).
    // Sample only the VISIBLE cell window so every sample can land on screen
    // (keeps the intended sparkle density regardless of map size).
    {
        const bandPhase = (renderTimeSec * 0.72) % (Math.PI * 2);
        const wx0 = Math.max(0, (camX / cell) | 0);
        const wy0 = Math.max(0, (camY / cell) | 0);
        const wcw = Math.min(cols - wx0, Math.ceil(w / cell) + 1);
        const wch = Math.min(rows - wy0, Math.ceil(h / cell) + 1);
        for (let k = 0; k < 36; k++) {
            const x = wx0 + ((Math.random() * wcw) | 0);
            const y = wy0 + ((Math.random() * wch) | 0);
            const i = y * cols + x;
            if (grid[i] !== WATER) continue;
            const sx = x * cell + ((Math.random() * cell) | 0);
            const sy = y * cell + ((Math.random() * cell) | 0);
            // Brighter sparkle where sine band peaks
            const phase = (sx * 0.018 + sy * 0.013 + bandPhase);
            const b = Math.sin(phase) * 0.5 + 0.5; // 0..1
            const alpha = (0.30 + b * 0.55).toFixed(2);
            ctx.fillStyle = `rgba(240,250,255,${alpha})`;
            ctx.fillRect(sx, sy, 1, 1);
        }
    }

    // Fish — dark shadows gliding just under the water surface
    if (props.showFish && fishList.length) {
        ctx.fillStyle = "rgba(8,24,32,0.42)";
        for (const f of fishList) {
            const fx = drawX(f), fy = drawY(f);
            const wag = Math.sin(f.wob) * 0.4 * f.size;
            ctx.save();
            ctx.translate(fx, fy);
            ctx.rotate(f.ang);
            ctx.beginPath();                                   // body
            ctx.ellipse(0, 0, f.size, f.size * 0.42, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();                                   // wagging tail
            ctx.moveTo(-f.size * 0.85, 0);
            ctx.lineTo(-f.size * 1.5, -f.size * 0.45 + wag);
            ctx.lineTo(-f.size * 1.5,  f.size * 0.45 + wag);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // Wind streaks (slightly above ground level — warm dust tint)
    if (props.showWindParticles && windStreaks.length) {
        const wxF = Math.cos(windAngle);
        const wyF = Math.sin(windAngle);
        ctx.lineWidth = 1.3;
        for (const p of windStreaks) {
            const px = drawX(p), py = drawY(p);
            const a = p.life * 0.30;
            ctx.strokeStyle = `rgba(240,215,185,${a.toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px - wxF * p.len, py - wyF * p.len);
            ctx.stroke();
        }
    }

    // Per-frame smoulder glow on hot ash (fades as the ash cools toward charred).
    // Visible cell window only — off-screen glow can't be seen.
    {
    const sx0 = Math.max(0, (camX / cell) | 0);
    const sx1 = Math.min(cols - 1, Math.ceil((camX + w) / cell));
    const sy0 = Math.max(0, (camY / cell) | 0);
    const sy1 = Math.min(rows - 1, Math.ceil((camY + h) / cell));
    for (let y = sy0; y <= sy1; y++) {
        const rowBase = y * cols;
        for (let x = sx0; x <= sx1; x++) {
            const i = rowBase + x;
            const s = grid[i];
            if (s !== ASH_TREE && s !== ASH_GRASS) continue;
            const heat = Math.min(1, burnTimer[i] / 350);   // hottest right after burning
            if (heat <= 0.05) continue;
            if (Math.random() < 0.5) {
                const ax = x * cell + cell * 0.5 + jitterX[i];
                const ay = y * cell + cell * 0.5 + jitterY[i];
                ctx.fillStyle = "rgb(255,90,25)";
                ctx.globalAlpha = heat * 0.6;
                ctx.beginPath();
                ctx.arc(ax, ay, Math.max(1, cell * 0.16), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    ctx.globalAlpha = 1;
    }

    // Glowing-mushroom halos — soft cyan pulse at ground level (below trees, so a
    // canopy occludes one beneath it). Brighter when the scene is dark/wet.
    if (glowSpots.length) {
        const moodBoost = 1 + weatherIntensitySmooth * 0.4; // pops a little in storm gloom
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const s of glowSpots) {
            const pulse = 0.55 + Math.sin(renderTimeSec * 3.0 + s.phase) * 0.45;
            const a = pulse * 0.24 * moodBoost;          // much subtler than before
            const rr = s.r * 0.7;                          // smaller halo
            const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr);
            grad.addColorStop(0,   `rgba(120,230,215,${(a).toFixed(3)})`);
            grad.addColorStop(0.5, `rgba(60,190,185,${(a * 0.4).toFixed(3)})`);
            grad.addColorStop(1,   "rgba(40,160,170,0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(s.x, s.y, rr, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Cloud shadows — soft dark patches on the ground (below trees)
    if (props.showClouds && clouds.length) {
        ctx.save();
        ctx.globalCompositeOperation = "multiply";
        for (const c of clouds) {
            const cx = drawX(c), cy = drawY(c);
            // Radial gradient shadow
            const grad = ctx.createRadialGradient(cx, cy, c.size * 0.20, cx, cy, c.size);
            const a = c.opacity.toFixed(3);
            grad.addColorStop(0, `rgba(40,40,55,${a})`);
            grad.addColorStop(1, "rgba(80,80,95,0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, c.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // --- Winter ground: snow blanket over the land + pale ice on the water ---
    // Drawn UNDER the trees so trunks/canopy stand above the snow. World-space.
    if (seasonParam && (seasonParam.snow > 0.03 || seasonParam.ice > 0.03)) {
        const sp = seasonParam.snow, ip = seasonParam.ice;
        if (ip > 0.03) {
            // Frozen water — pale icy sheen on the visible water cells
            const ix0 = Math.max(0, (camX / cell) | 0);
            const ix1 = Math.min(cols - 1, Math.ceil((camX + w) / cell));
            const iy0 = Math.max(0, (camY / cell) | 0);
            const iy1 = Math.min(rows - 1, Math.ceil((camY + h) / cell));
            ctx.fillStyle = `rgba(206,228,242,${(ip * 0.55).toFixed(3)})`;
            for (let y = iy0; y <= iy1; y++) {
                const rb = y * cols;
                for (let x = ix0; x <= ix1; x++) {
                    if (grid[rb + x] === WATER) ctx.fillRect(x * cell, y * cell, cell, cell);
                }
            }
        }
        if (sp > 0.03) {
            // Snow blanket — bluish white over the whole visible world + speckle
            if (!snowPattern) buildSnowPattern();
            ctx.fillStyle = `rgba(238,244,255,${(sp * 0.72).toFixed(3)})`;
            ctx.fillRect(camX, camY, w, h);
            if (snowPattern) {
                ctx.save();
                ctx.globalAlpha = sp * 0.5;
                ctx.fillStyle = snowPattern;
                ctx.fillRect(camX, camY, w, h);
                ctx.restore();
            }
        }
    }

    // PASS 3 — side-view trees, drawn into a cached layer (rebuilt every few
    // frames) then blitted. Rows go top→bottom so nearer trees overlap the ones
    // behind (depth); each sprite's BASE anchors near the cell's lower-centre and
    // the canopy rises up; growth × treeScale sizes each tree.
    if (!treeLayerCanvas) {
        treeLayerCanvas = document.createElement("canvas");
        treeLayerCtx    = treeLayerCanvas.getContext("2d");
    }
    if (treeLayerCanvas.width !== worldPxW || treeLayerCanvas.height !== worldPxH) {
        treeLayerCanvas.width = worldPxW; treeLayerCanvas.height = worldPxH;
        treeLayerCountdown = 0;
    }
    // If a slider jump teleports the camera further than the rebuild margin,
    // refresh immediately so no blank strip can reach the screen.
    if (Math.abs(camX - treeLayerCamX) > 48 || Math.abs(camY - treeLayerCamY) > 48) {
        treeLayerCountdown = 0;
    }
    if (treeLayerCountdown <= 0) {
        const tlc = treeLayerCtx;
        // Full-canvas clear (one cheap GPU fill), then draw ONLY the trees that
        // can reach the visible window (+ margin). No clip state — clipping
        // forces slow paths in some canvas backends. Off-screen stays blank;
        // the margin + the jump guard above keep blanks off the screen.
        tlc.clearRect(0, 0, worldPxW, worldPxH);
        tlc.imageSmoothingEnabled = false;   // 1:1 blits — no resampling needed
        treeLayerCamX = camX; treeLayerCamY = camY;

        const maxDw = treeScaledCellW, maxDh = treeScaledCellH;
        const MX = (maxDw >> 1) + 64, MY = maxDh + 64;
        const rx0 = Math.max(0, (camX - MX) | 0);
        const ry0 = Math.max(0, (camY - MY) | 0);
        const rx1 = Math.min(worldPxW, (camX + w + MX) | 0);
        const ry1 = Math.min(worldPxH, (camY + h + MY) | 0);

        const swayScale = Math.min(1.4, props.windStrength) * cell * 0.10;
        const swayWxF = Math.cos(windAngle);
        const swayT = renderTimeSec * 3.0;
        // Sway phases only depend on (treeVar, i&31): 320 combos — precompute
        // the final x-offsets once instead of a Math.sin per tree.
        for (let k = 0; k < 320; k++) {
            treeSinTab[k] = swayWxF * Math.sin(swayT + (k >> 5) * 0.4 + (k & 31) * 0.21) * swayScale;
        }
        // Cell bounds for every tree whose sprite can reach into the region
        const cx0 = Math.max(0, ((rx0 - maxDw / 2 - cell) / cell) | 0);
        const cx1 = Math.min(cols - 1, Math.ceil((rx1 + maxDw / 2 + cell) / cell));
        const cy0 = Math.max(0, ((ry0 - cell) / cell) | 0);
        const cy1 = Math.min(rows - 1, Math.ceil((ry1 + maxDh + cell) / cell));
        const B1 = TREE_SIZE_BUCKETS - 1;
        for (let y = cy0; y <= cy1; y++) {
            const rowBase = y * cols;
            for (let x = cx0; x <= cx1; x++) {
                const i = rowBase + x;
                const s = grid[i];
                if (s !== TREE && s !== BURN_TREE) continue;
                const tv = treeVar[i];
                const swX = treeSinTab[(tv << 5) | (i & 31)];
                const g = treeGrowth[i] || 1;
                // Pre-scaled bucket → unscaled integer blit (fast + crisp)
                const b = (g * B1 + 0.5) | 0;
                const dw = treeScaledW[b];
                const dh = treeScaledH[b];
                const baseX = x * cell + cell * 0.5 + jitterX[i] * 0.7 + swX;
                const baseY = y * cell + cell * 0.92 + jitterY[i] * 0.4;
                tlc.drawImage(treeScaled,
                              tv * treeScaledCellW, b * treeScaledCellH, dw, dh,
                              (baseX - dw * 0.5 + 0.5) | 0, (baseY - dh + 0.5) | 0, dw, dh);
            }
        }
        // Calm wind = snapped sway is permanently 0, so the layer only changes
        // when trees change or the camera moves: drop to a slow fallback cadence
        // (tree changes below and the camera jump-guard force instant refreshes).
        treeLayerCountdown = (swayScale < 0.5) ? 30 : TREE_LAYER_GAP;
    }
    treeLayerCountdown--;
    drawWorldLayer(treeLayerCanvas, camX, camY, w, h);

    // Lightning afterglow (under fire, on top of trees)
    drawLightningGlows();

    // --- Fire glow pass ---
    // Track the fire's pixel bounding box for the heat-shimmer pass.
    let fbX0 = 1e9, fbY0 = 1e9, fbX1 = -1e9, fbY1 = -1e9;
    if (burningCount > 0) {
        // Only the visible region matters: off-screen glow is never composited,
        // so scan/draw/clear just the on-screen cell window (+ a glow margin).
        const gPad = 48;
        const vx0 = Math.max(0, ((camX - gPad) / cell) | 0);
        const vx1 = Math.min(cols - 1, Math.ceil((camX + w + gPad) / cell));
        const vy0 = Math.max(0, ((camY - gPad) / cell) | 0);
        const vy1 = Math.min(rows - 1, Math.ceil((camY + h + gPad) / cell));
        glowCtx.clearRect(Math.max(0, camX - gPad), Math.max(0, camY - gPad),
                          w + gPad * 2, h + gPad * 2);
        for (let y = vy0; y <= vy1; y++) {
            const rowBase = y * cols;
            for (let x = vx0; x <= vx1; x++) {
                const i = rowBase + x;
                const s = grid[i];
                if (s !== BURN_GRASS && s !== BURN_TREE) continue;
                const isTree = s === BURN_TREE;
                const pxL = x * cell, pxT = y * cell;
                if (pxL < fbX0) fbX0 = pxL; if (pxL > fbX1) fbX1 = pxL;
                if (pxT < fbY0) fbY0 = pxT; if (pxT > fbY1) fbY1 = pxT;

                // Lifecycle intensity (small smolder → big blaze → die) + clustering heat
                const age = burnMax[i] > 0 ? (1 - burnTimer[i] / burnMax[i]) : 0;
                const intensity = burnIntensity(age);
                const heat = fireHeat[i];          // 0..1 from burning neighbours
                // White-hot reserved mostly for dense clusters; a lone flame stays orange/yellow
                const hot = Math.min(1, intensity * 0.30 + heat * 0.95);

                const flicker = 0.75 + Math.random() * 0.5;
                // Flame radius grows with intensity; a clustered blaze flares larger
                const baseR = (isTree ? cell * 0.80 : cell * 0.46);
                // Lower size floor so a young smoldering cell is a tiny flame,
                // growing to full size as intensity climbs.
