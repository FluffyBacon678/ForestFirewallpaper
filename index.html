let gustStrength = 0;       // 0..1.5 boost added to windStrength
let gustTimer    = 0;       // frames remaining in current gust
let nextGustAt   = 600;     // frames until next possible gust

// Mouse hover indicator
let mouseX = -100, mouseY = -100;
let mouseInside = false;

// Lightning afterglow — vertical fading column at strike points
let lightningGlows = [];

function applyQuality(q) {
    // qMul scales particle caps; qBandMul spreads the tree-canopy rebuild over more
    // frames (cheaper per frame, slower sway) on weaker tiers; qGlowBlur drops the
    // soft fire-glow bloom on Low. Render cost — not just particle count — scales.
    switch (q) {
        case "low":    qMul = 0.40; qBandMul = 2.0; qGlowBlur = false; break;
        case "medium": qMul = 0.70; qBandMul = 1.5; qGlowBlur = true;  break;
        case "high":   qMul = 1.00; qBandMul = 1.0; qGlowBlur = true;  break;
        case "ultra":  qMul = 1.60; qBandMul = 1.0; qGlowBlur = true;  break;
        default:       qMul = 1.00; qBandMul = 1.0; qGlowBlur = true;
    }
}

// ── Capability tiering ──────────────────────────────────────────────────────
// Wallpaper Engine runs mostly on gaming rigs, so on "Auto" we match the quality
// to the GPU class read from the WebGL renderer string: a strong card (RTX /
// modern Radeon / Arc) opens at Ultra, a mid card (GTX 10/16-series) at High,
// integrated graphics at Medium, and a software rasteriser at Low. The adaptive
// governor still trims within the chosen tier. A real device choice (Low..Ultra)
// always wins. Defined once so the result is stable for the session.
let gpuRenderer = "", autoQualityCache = "";
function gpuQualityAuto() {
    if (autoQualityCache) return autoQualityCache;
    if (!glGlow) return "medium";                 // no WebGL host → CPU-bound, stay modest
    try {
        const gl = glGlow.gl, dbg = gl.getExtension("WEBGL_debug_renderer_info");
        gpuRenderer = dbg ? (gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "") : "";
    } catch (e) { gpuRenderer = ""; }
    const r = gpuRenderer.toLowerCase();
    let q;
    if (!r) q = "high";                           // masked string → safe upper-middle
    else if (/swiftshader|llvmpipe|software|basic render|microsoft basic/.test(r)) q = "low";
    else if (/rtx|geforce rtx|radeon rx (6|7|9)\d{3}|\barc\b|a7\d0|a5\d0/.test(r)) q = "ultra";
    else if (/gtx 1[0678]|gtx 9|geforce gtx|radeon rx (4|5)\d{2}|vega|quadro|radeon pro/.test(r)) q = "high";
    else if (/intel|uhd graphics|hd graphics|iris/.test(r)) q = "medium";
    else q = "high";                              // unknown discrete card → assume capable
    autoQualityCache = q;
    return q;
}
// Resolve the quality property, mapping "auto" through the GPU probe. Call AFTER
// the GL context exists (post-resize) so the renderer string is available.
function resolveQuality() {
    const q = (props.quality === "auto") ? gpuQualityAuto() : props.quality;
    applyQuality(q);
    return q;
}

function applyFpsCap(v) {
    if (v === "unlimited" || v === "0" || v === 0) {
        minFrameMs = 0;
    } else {
        const n = parseFloat(v);
        minFrameMs = (n > 0 && isFinite(n)) ? (1000 / n) : 0;
    }
}

// ============================================================
// Dirt background (procedural, baked once per resize)
// ============================================================
function drawDirtBackground() {
    const w = bgCanvas.width;
    const h = bgCanvas.height;
    const c = bgCtx;

    // Base ground colour — lush mossy jungle floor (green-dominant, not bare brown)
    c.fillStyle = "#2f3d1e";
    c.fillRect(0, 0, w, h);

    // --- Smooth ground variation (warm/cool brown patches + elevation) ---
    // Rendered at low resolution from coherent noise, then upscaled with bilinear
    // smoothing. This avoids both the perfect-circle blobs and the per-cell grid
    // boxes the old approach produced — it's continuous, organic shading.
    const LOW = 14;                       // px per low-res sample
    const nw = Math.ceil(w / LOW) + 1;
    const nh = Math.ceil(h / LOW) + 1;
    const noiseCanvas = document.createElement("canvas");
    noiseCanvas.width = nw; noiseCanvas.height = nh;
    const nc = noiseCanvas.getContext("2d");
    const img = nc.createImageData(nw, nh);
    const data = img.data;
    const elevOn = props.showElevation ? 1 : 0;
    const seedE = terrainSeed + 9000;
    const seedP = terrainSeed + 3000;
    for (let yy = 0; yy < nh; yy++) {
        for (let xx = 0; xx < nw; xx++) {
            const px = xx * LOW, py = yy * LOW;
            // elevation: large rolling features; patch: medium warm/cool variation
            const e = fbm(px * 0.0023, py * 0.0023, seedE, 3) - 0.5; // -0.5..0.5
            const p = fbm(px * 0.0060, py * 0.0060, seedP, 3) - 0.5; // -0.5..0.5
            const elev = e * elevOn;
            // Mossy green floor: green channel leads, with patches drifting between
            // mossy green (p high) and earthy green-brown (p low).
            let R = 44 + elev * 30 + p * 40;
            let G = 60 + elev * 40 + p * 26;
            let B = 28 + elev * 20 + p * 14;
            R = R < 0 ? 0 : R > 255 ? 255 : R;
            G = G < 0 ? 0 : G > 255 ? 255 : G;
            B = B < 0 ? 0 : B > 255 ? 255 : B;
            const o = (yy * nw + xx) * 4;
            data[o] = R; data[o + 1] = G; data[o + 2] = B; data[o + 3] = 255;
        }
    }
    nc.putImageData(img, 0, 0);
    c.imageSmoothingEnabled = true;
    c.drawImage(noiseCanvas, 0, 0, nw, nh, 0, 0, w, h);

    // Pixel grain: mossy green flecks (~1 per 45 px — the lush jungle-floor texture)
    // then darker specks (~1 per 140 px). Each used to be its own 1×1 fillRect with a
    // fresh rgba() string — ~550k canvas calls, ~0.85 s of every world build at 4K
    // (load, zoom steps, density sliders). Now they're rasterised straight into pixel
    // strips and each strip is composited once. Source-over is associative, so it's
    // the same image (same densities, colours and light-then-dark order).
    const STRIP = 256;
    const grain = document.createElement("canvas");
    grain.width = w; grain.height = Math.min(STRIP, h);
    const gctx = grain.getContext("2d");
    const over = (d, o, r, g, b, a) => {              // non-premultiplied source-over
        const da = d[o + 3] / 255;
        if (da === 0) { d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = a * 255; return; }
        const k = da * (1 - a), oa = a + k;
        d[o] = (r * a + d[o] * k) / oa; d[o + 1] = (g * a + d[o + 1] * k) / oa;
        d[o + 2] = (b * a + d[o + 2] * k) / oa; d[o + 3] = oa * 255;
    };
    for (let y0 = 0; y0 < h; y0 += STRIP) {
        const sh = Math.min(STRIP, h - y0);
        const id = gctx.createImageData(w, sh), d = id.data;
        const lightSpecks = (w * sh) / 45;
        for (let i = 0; i < lightSpecks; i++) {
            const x = (Math.random() * w) | 0, y = (Math.random() * sh) | 0;
            const a = 0.10 + Math.random() * 0.20;
            const moss = Math.random() < 0.7;
            const r = moss ? (55 + Math.random() * 30 | 0) : (95 + Math.random() * 30 | 0);
            const g = moss ? (85 + Math.random() * 40 | 0) : (75 + Math.random() * 25 | 0);
            const b = moss ? (40 + Math.random() * 22 | 0) : (45 + Math.random() * 20 | 0);
            over(d, (y * w + x) * 4, r, g, b, a);
        }
        const darkSpecks = (w * sh) / 140;
        for (let i = 0; i < darkSpecks; i++) {
            const x = (Math.random() * w) | 0, y = (Math.random() * sh) | 0;
            const a = 0.18 + Math.random() * 0.28;
            const o = (y * w + x) * 4;
            over(d, o, 14, 8, 4, a);
            if (Math.random() < 0.3 && x + 1 < w) over(d, o + 4, 14, 8, 4, a);   // some are 2px wide
        }
        gctx.putImageData(id, 0, 0);
        c.drawImage(grain, 0, 0, w, sh, 0, y0, w, sh);
    }

    // Sparse pebbles (small, intentional — not the big circular blobs)
    const pebbles = (w * h) / 1500;
    for (let i = 0; i < pebbles; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 1 + Math.random() * 1.6;
        const pr = 115 + Math.random() * 35 | 0;
        const pg = 100 + Math.random() * 28 | 0;
        const pb = 80 + Math.random() * 28 | 0;
        c.fillStyle = `rgba(${pr},${pg},${pb},0.6)`;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = "rgba(0,0,0,0.26)";
        c.beginPath();
        c.arc(x + 0.6, y + 0.7, r * 0.85, 0, Math.PI * 2);
        c.fill();
    }

    // Dirt background changed → terrain (and therefore static) needs a rebuild
    markTerrainDirty();
}

// ============================================================
// Sprite atlases — trees (top-down round canopies) + grass tufts
// ============================================================
function buildSpriteAtlases() {
    refreshDpiScale();
    const cell = Math.max(4, (props.cellSize * dpiScale) | 0);
    // Detailed SIDE-VIEW trees that stand up from their cell. Kept fairly compact
    // and "planty" so a dense forest reads as a lush canopy rather than giant
    // towers; the treeScale property fine-tunes their size. Anchored at the base.
    treeSpW = Math.ceil(cell * 2.1);
    treeSpH = Math.ceil(cell * 3.0);
    // Grass stays in-cell so it's cheap and clean over dirt.
    grassSpW = cell;
    grassSpH = cell;

    if (!treeSprites) treeSprites = document.createElement("canvas");
    treeSprites.width  = treeSpW * TREE_NUM_VARIANTS;
    treeSprites.height = treeSpH;
    const tc = treeSprites.getContext("2d");
    tc.clearRect(0, 0, treeSprites.width, treeSprites.height);
    for (let v = 0; v < TREE_NUM_VARIANTS; v++) {
        renderTreeTopDown(tc, v * treeSpW, 0, treeSpW, treeSpH, v);
    }

    if (!grassSprites) grassSprites = document.createElement("canvas");
    grassSprites.width  = grassSpW * GRASS_NUM_VARIANTS;
    grassSprites.height = grassSpH;
    const gc = grassSprites.getContext("2d");
    gc.clearRect(0, 0, grassSprites.width, grassSprites.height);
    for (let v = 0; v < GRASS_NUM_VARIANTS; v++) {
        renderGrassTopDown(gc, v * grassSpW, 0, grassSpW, grassSpH, v);
    }

    buildScaledTreeAtlas();
}

// ============================================================
// Pre-scaled tree atlas — the per-frame tree pass blits these 1:1 instead of
// scaling treeSprites every draw (scaled drawImage was the #1 frame cost).
// Growth (0..1) maps to TREE_SIZE_BUCKETS pre-baked sizes; the ~1.8% size
// quantization is invisible, and 1:1 integer blits render crisper too.
// ============================================================
const TREE_SIZE_BUCKETS = 20;
let treeScaled = null;          // canvas: TREE_SIZE_BUCKETS rows × TREE_NUM_VARIANTS cols
let treeScaledW = [], treeScaledH = [];   // per-bucket sprite dims (ints)
let treeScaledCellW = 0, treeScaledCellH = 0; // atlas grid cell (max sprite dims)

function buildScaledTreeAtlas() {
    const ts = props.treeScale || 1;
    const maxScale = (0.30 + 0.70) * ts;            // growth=1
    treeScaledCellW = Math.ceil(treeSpW * maxScale);
    treeScaledCellH = Math.ceil(treeSpH * maxScale);
    if (!treeScaled) treeScaled = document.createElement("canvas");
    treeScaled.width  = treeScaledCellW * TREE_NUM_VARIANTS;
    treeScaled.height = treeScaledCellH * TREE_SIZE_BUCKETS;
    const c = treeScaled.getContext("2d");
    c.clearRect(0, 0, treeScaled.width, treeScaled.height);
    c.imageSmoothingEnabled = true;                 // quality scaling, baked once
    treeScaledW.length = 0; treeScaledH.length = 0;
    for (let b = 0; b < TREE_SIZE_BUCKETS; b++) {
        const scale = (0.30 + (b / (TREE_SIZE_BUCKETS - 1)) * 0.70) * ts;
        const dw = Math.max(1, Math.round(treeSpW * scale));
        const dh = Math.max(1, Math.round(treeSpH * scale));
        treeScaledW.push(dw); treeScaledH.push(dh);
        for (let v = 0; v < TREE_NUM_VARIANTS; v++) {
            c.drawImage(treeSprites, v * treeSpW, 0, treeSpW, treeSpH,
                        v * treeScaledCellW, b * treeScaledCellH, dw, dh);
        }
    }
    treeAtlasVer++;   // the GPU tree path re-uploads this atlas on the next frame
}

// ============================================================
// Detailed SIDE-VIEW trees (trunk + dappled textured canopy).
// Sprite origin is top-left of the slice; the tree BASE sits at the sprite
// bottom (baseY) and the canopy rises toward the top.
// ============================================================
function renderTreeTopDown(c, ox, oy, w, h, variant) {
    const species = (variant >> 1) & 15;
    const sizeIdx = variant & 1;
    const cx = ox + w / 2;
    const baseY = oy + h - 1;
    switch (species) {
        case SPECIES_PINE:   drawConiferSide(c, cx, baseY, w, h, sizeIdx); break;
        case SPECIES_FIR:    drawFirSide(c, cx, baseY, w, h, sizeIdx); break;
        case SPECIES_POPLAR: drawPoplarSide(c, cx, baseY, w, h, sizeIdx); break;
        case SPECIES_WILLOW: drawWillowSide(c, cx, baseY, w, h, sizeIdx); break;
        case SPECIES_BIRCH:  drawBroadleafSide(c, cx, baseY, w, h, sizeIdx, "birch"); break;
        case SPECIES_MAPLE:  drawBroadleafSide(c, cx, baseY, w, h, sizeIdx, "maple"); break;
        case SPECIES_AUTUMN: drawBroadleafSide(c, cx, baseY, w, h, sizeIdx, "autumn"); break;
        case SPECIES_CHERRY: drawBroadleafSide(c, cx, baseY, w, h, sizeIdx, "cherry"); break;
        case SPECIES_DEAD:   drawDeadSide(c, cx, baseY, w, h, sizeIdx); break;
    }
}

// Soft ground contact shadow (an ellipse where the trunk meets the ground)
function drawGroundShadow(c, cx, baseY, rx) {
    c.fillStyle = "rgba(0,0,0,0.22)";
    c.beginPath();
    c.ellipse(cx + rx * 0.12, baseY, rx, Math.max(1, rx * 0.32), 0, 0, Math.PI * 2);
    c.fill();
}

// A vertical trunk with light/shaded edges; birch = pale bark with dark marks.
function drawTrunkSide(c, cx, baseY, tw, th, birch) {
    const x0 = Math.round(cx - tw / 2);
    const wq = Math.max(1, Math.round(tw));
    if (birch) {
        c.fillStyle = "#d9d3c4";
        c.fillRect(x0, baseY - th, wq, th);
        c.fillStyle = "rgba(150,148,135,0.55)";              // shaded right edge
        c.fillRect(x0 + wq - 1, baseY - th, 1, th);
        c.fillStyle = "rgba(40,35,28,0.85)";                 // dark birch flecks
        const marks = Math.max(2, (th * 0.22) | 0);
        for (let m = 0; m < marks; m++) {
            c.fillRect(x0 + ((Math.random() * wq) | 0),
                       (baseY - th + Math.random() * th) | 0,
                       1 + (Math.random() < 0.4 ? 1 : 0), 1);
        }
    } else {
        c.fillStyle = "#5b3d23";
        c.fillRect(x0, baseY - th, wq, th);
        c.fillStyle = "rgba(112,80,46,0.6)";                 // lit left edge
        c.fillRect(x0, baseY - th, 1, th);
        c.fillStyle = "rgba(34,22,12,0.6)";                  // shaded right edge
        c.fillRect(x0 + wq - 1, baseY - th, 1, th);
        // bark texture flecks
        c.fillStyle = "rgba(30,18,10,0.45)";
        for (let m = 0; m < Math.max(2, (th * 0.18) | 0); m++)
            c.fillRect(x0 + ((Math.random() * wq) | 0), (baseY - th + Math.random() * th) | 0, 1, 1);
    }
}

// Scatter leaf-cluster dabs inside an ellipse (cx,cy / rx,ry) for a dappled canopy.
function leafCluster(c, cx, cy, rx, ry, col, n, fill) {
    c.fillStyle = col;
    const br = Math.max(1.1, rx * 0.17);
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const rr = Math.sqrt(Math.random()) * fill;
        c.beginPath();
        c.arc(cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr, br, 0, Math.PI * 2);
        c.fill();
    }
}

// Broadleaf tree (oak-like): trunk + big dappled rounded canopy.
function drawBroadleafSide(c, cx, baseY, w, h, sizeIdx, kind) {
    const trunkH = h * (0.30 + sizeIdx * 0.02);
    const trunkW = Math.max(2, w * 0.14);
    const birch = kind === "birch";

    // palette: [outline/dark, mid, lit, highlight]
    let pal;
    if (birch)            pal = ["#274d1c", "#3c7a2a", "#5fa843", "#84c662"];
    else if (kind === "maple")  pal = ["#5f5018", "#9c8327", "#caa53c", "#e6cb63"];
    else if (kind === "autumn") pal = ["#742612", "#a8451c", "#cc6a2a", "#e8a24e"];
    else if (kind === "cherry") pal = ["#a8567a", "#d98ab0", "#efb2cd", "#fbe1ed"]; // pink blossom
    else                  pal = ["#1f4a1b", "#2f6e27", "#4e9a3a", "#74c057"]; // oak green
    const [dark, mid, lite, hi] = pal;

    drawGroundShadow(c, cx, baseY, w * 0.32);
    drawTrunkSide(c, cx, baseY, trunkW, trunkH, birch);

    const canRx = w * (0.44 + sizeIdx * 0.03);
    const canRy = h * (0.31 + sizeIdx * 0.03);
    const canCy = baseY - trunkH * 0.55 - canRy * 0.92;

    leafCluster(c, cx, canCy, canRx, canRy, dark, 30, 1.0);                       // silhouette
    leafCluster(c, cx, canCy, canRx * 0.9, canRy * 0.9, mid, 34, 0.94);          // mid fill
    leafCluster(c, cx - canRx * 0.22, canCy - canRy * 0.24, canRx * 0.62, canRy * 0.62, lite, 24, 0.9); // lit side
    leafCluster(c, cx - canRx * 0.30, canCy - canRy * 0.30, canRx * 0.4, canRy * 0.4, hi, 11, 0.85);     // highlights
    leafCluster(c, cx + canRx * 0.24, canCy + canRy * 0.22, canRx * 0.3, canRy * 0.3, dark, 7, 0.7);     // shadow pocket
}

// Conifer (pine/fir): brown trunk + stacked triangular tiers.
function drawConiferSide(c, cx, baseY, w, h, sizeIdx) {
    const trunkH = h * 0.14;
    const trunkW = Math.max(2, w * 0.12);
    drawGroundShadow(c, cx, baseY, w * 0.28);
    drawTrunkSide(c, cx, baseY, trunkW, trunkH, false);

    const dark = "#163d18", mid = "#235c24", lite = "#3f8138";
    const topY = baseY - h * 0.97;
    const botY = baseY - trunkH * 0.5;
    const tiers = 4 + sizeIdx;
    const tierH = (botY - topY) / tiers;

    for (let t = 0; t < tiers; t++) {
        const ty = topY + t * tierH;
        const tw = w * (0.16 + (t / tiers) * 0.40);   // wider toward the bottom
        // dark base triangle
        c.fillStyle = dark;
        c.beginPath();
        c.moveTo(cx, ty - tierH * 0.35);
        c.lineTo(cx + tw, ty + tierH * 1.05);
        c.lineTo(cx - tw, ty + tierH * 1.05);
        c.closePath(); c.fill();
        // mid layer
        c.fillStyle = mid;
        c.beginPath();
        c.moveTo(cx, ty - tierH * 0.2);
        c.lineTo(cx + tw * 0.82, ty + tierH * 0.92);
        c.lineTo(cx - tw * 0.82, ty + tierH * 0.92);
        c.closePath(); c.fill();
        // lit left facet
        c.fillStyle = lite;
        c.beginPath();
        c.moveTo(cx - tw * 0.15, ty);
        c.lineTo(cx - tw * 0.78, ty + tierH * 0.88);
        c.lineTo(cx - tw * 0.30, ty + tierH * 0.88);
        c.closePath(); c.fill();
    }
    // crown tip highlight
    c.fillStyle = lite;
    c.fillRect((cx - 0.5) | 0, topY | 0, 1, 2);
}

// Fir: the conifer's softer sibling — same stacked tiers, but each tier is a row
// of overlapping ROUNDED lobes (scalloped branch tips) instead of a sharp triangle,
// in a slightly cooler green. Reads as the same evergreen family with a fuller,
// rounded foliage shape.
function drawFirSide(c, cx, baseY, w, h, sizeIdx) {
    const trunkH = h * 0.13;
    const trunkW = Math.max(2, w * 0.12);
    drawGroundShadow(c, cx, baseY, w * 0.30);
    drawTrunkSide(c, cx, baseY, trunkW, trunkH, false);

    const dark = "#143f20", mid = "#236d33", lite = "#3f9a4c", hi = "#63bd6a"; // cooler green + highlight
    const topY = baseY - h * 0.96;
    const botY = baseY - trunkH * 0.5;
    const tiers = 4 + sizeIdx;
    const tierH = (botY - topY) / tiers;

    for (let t = 0; t < tiers; t++) {
        const ty = topY + t * tierH;
        const tw = w * (0.14 + (t / tiers) * 0.42);   // wider toward the bottom
        const lobes = 2 + t;                           // more rounded lobes lower down
        const lobeR = (tw / Math.max(1, lobes)) * 1.30;
        const by = ty + tierH * 1.0;                   // tier baseline
        // dark scalloped silhouette — a row of overlapping circles (rounded branch tips)
        c.fillStyle = dark;
        for (let l = 0; l <= lobes; l++) {
            const lx = cx - tw + (2 * tw) * (l / lobes);
            c.beginPath(); c.arc(lx, by, lobeR, 0, Math.PI * 2); c.fill();
        }
        // dappled foliage texture over the tier, lit toward the upper-left
        const fcy = by - tierH * 0.30;
        leafCluster(c, cx, fcy, tw * 0.95, tierH * 0.62, mid, 9 + t * 3, 0.98);              // mid fill
        leafCluster(c, cx - tw * 0.34, fcy - tierH * 0.16, tw * 0.55, tierH * 0.48, lite, 5 + t * 2, 0.9); // lit
        leafCluster(c, cx - tw * 0.44, fcy - tierH * 0.22, tw * 0.30, tierH * 0.30, hi, 2 + t, 0.85);      // highlight
        leafCluster(c, cx + tw * 0.42, by - tierH * 0.06, tw * 0.30, tierH * 0.30, dark, 3 + t, 0.7);      // shadow pocket (low-right)
    }
    // dappled crown tuft
    leafCluster(c, cx, topY + tierH * 0.32, w * 0.12, tierH * 0.5, mid, 6, 0.95);
    leafCluster(c, cx - w * 0.04, topY + tierH * 0.22, w * 0.07, tierH * 0.34, lite, 3, 0.85);
    c.fillStyle = hi; c.fillRect((cx - 0.5) | 0, topY | 0, 1, 2);
}

// Poplar: tall, NARROW columnar broadleaf — stacked vertical leaf clusters that
// taper to a point, a flame/column silhouette quite unlike the round oak.
function drawPoplarSide(c, cx, baseY, w, h, sizeIdx) {
    const trunkH = h * 0.16, trunkW = Math.max(2, w * 0.09);
    drawGroundShadow(c, cx, baseY, w * 0.18);
    drawTrunkSide(c, cx, baseY, trunkW, trunkH, false);
    const dark = "#244e19", mid = "#3a7c2a", lite = "#5cab42", hi = "#88c863";
    const cw = w * 0.27;                              // narrow column
    const topY = baseY - h * 0.99;
    const botY = baseY - trunkH * 0.55;
    const colH = botY - topY;
    const segs = 5 + sizeIdx;
    for (let s = 0; s < segs; s++) {
        const f = s / (segs - 1);                    // 0 top → 1 bottom
        const cy = topY + colH * (0.08 + f * 0.84);
        const rx = cw * (0.32 + f * 0.82);           // narrow up top, wider low
        const ry = colH * 0.17;
        leafCluster(c, cx, cy, rx, ry, dark, 16, 1.0);                            // silhouette
        leafCluster(c, cx, cy - ry * 0.10, rx * 0.86, ry * 0.90, mid, 16, 0.95);  // mid fill
        leafCluster(c, cx - rx * 0.34, cy - ry * 0.28, rx * 0.50, ry * 0.55, lite, 9, 0.9);  // lit (upper-left)
        leafCluster(c, cx - rx * 0.44, cy - ry * 0.34, rx * 0.28, ry * 0.32, hi, 4, 0.85);   // highlight
        leafCluster(c, cx + rx * 0.34, cy + ry * 0.20, rx * 0.30, ry * 0.34, dark, 4, 0.7);  // shadow (lower-right)
    }
    leafCluster(c, cx - cw * 0.12, topY + colH * 0.16, cw * 0.36, colH * 0.14, hi, 5, 0.8);  // bright crown tip
}

// Willow: rounded crown + long DROOPING fronds that drape from its underside
// (longest in the middle) — a soft weeping silhouette, lovely near the water.
function drawWillowSide(c, cx, baseY, w, h, sizeIdx) {
    const trunkH = h * 0.24, trunkW = Math.max(2, w * 0.12);
    drawGroundShadow(c, cx, baseY, w * 0.34);
    drawTrunkSide(c, cx, baseY, trunkW, trunkH, false);
    const dark = "#33571f", mid = "#588534", lite = "#86b657", hi = "#aed079";
    const canRx = w * (0.46 + sizeIdx * 0.03);
    const canRy = h * 0.15;
    const canCy = baseY - h * 0.72;              // crown high → room for the curtain to drape
    // full dappled dome crown, lit toward the upper-left
    leafCluster(c, cx, canCy, canRx, canRy, dark, 30, 1.0);
    leafCluster(c, cx, canCy - canRy * 0.10, canRx * 0.92, canRy * 0.88, mid, 28, 0.96);
    leafCluster(c, cx, canCy + canRy * 0.55, canRx * 0.86, canRy * 0.70, mid, 16, 1.0);   // fuller underside
    leafCluster(c, cx - canRx * 0.26, canCy - canRy * 0.22, canRx * 0.55, canRy * 0.52, lite, 16, 0.9);
    leafCluster(c, cx - canRx * 0.34, canCy - canRy * 0.30, canRx * 0.30, canRy * 0.32, hi, 7, 0.85);
    // WEEPING skirt — a continuous draping curtain whose RAGGED bottom edge (each
    // tendril a different length, longest in the middle) gives the weep; the left
    // strands catch the light. Dense enough to read full, varied enough to weep.
    const br = Math.max(1, w * 0.05);
    const sy = canCy + canRy * 0.85;             // start at the crown's underside
    const bottom = baseY - trunkH * 0.25;        // drape to just above the trunk base
    const span = canRx * 1.7;
    const nt = Math.max(8, Math.round(span / (br * 1.2)));
    for (let i = 0; i <= nt; i++) {
        const fx = cx - span / 2 + span * (i / nt) + (Math.random() - 0.5) * br;
        const mid01 = 1 - Math.abs(fx - cx) / (span * 0.55);    // 1 centre → 0 edge
        const len = (0.30 + 0.70 * Math.max(0, mid01)) * (bottom - sy) * (0.70 + Math.random() * 0.6);
        const leftLit = fx < cx;
        let wob = 0;
        const step = br * 1.15;
        for (let d = 0; d < len; d += step) {
            const t = d / len;
            wob += (Math.random() - 0.5) * br * 0.6;
            if (wob >  w * 0.05) wob =  w * 0.05;
            if (wob < -w * 0.05) wob = -w * 0.05;
            const rnd = Math.random();
            c.fillStyle = (leftLit && rnd < 0.5) ? lite : (rnd < 0.8 ? mid : dark);
            c.beginPath(); c.arc(fx + wob, sy + d, br * (1 - t * 0.4), 0, Math.PI * 2); c.fill();
        }
    }
}

// Dead tree: bare branching skeleton (pale grey or reddish-brown).
function drawDeadSide(c, cx, baseY, w, h, sizeIdx) {
    const reddish = sizeIdx === 1;
    const limb = reddish ? "#6e3b2a" : "#cfc9bb";
    const tipCol = reddish ? "#84513a" : "#e7e2d6";
    drawGroundShadow(c, cx, baseY, w * 0.22);

    c.lineCap = "round";
    const draw = (x, y, ang, len, wdt, depth) => {
        if (depth <= 0 || len < 2) return;
        const ex = x + Math.cos(ang) * len;
        const ey = y + Math.sin(ang) * len;
        c.lineWidth = Math.max(1, wdt);
        c.strokeStyle = depth <= 1 ? tipCol : limb;
        c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
        draw(ex, ey, ang - 0.35 - Math.random() * 0.35, len * 0.72, wdt * 0.66, depth - 1);
        draw(ex, ey, ang + 0.35 + Math.random() * 0.35, len * 0.72, wdt * 0.66, depth - 1);
        if (Math.random() < 0.45)
            draw(ex, ey, ang + (Math.random() - 0.5) * 0.4, len * 0.6, wdt * 0.6, depth - 1);
    };
    draw(cx, baseY, -Math.PI / 2, h * 0.42, Math.max(2, w * 0.15), 5 + sizeIdx);
}

// ============================================================
// Rock sprites — small gray pebble/boulder shapes
// ============================================================
function buildRockSprites() {
    const cell = Math.max(4, (props.cellSize * dpiScale) | 0);
    rockSpW = cell;
    rockSpH = cell;
    if (!rockSprites) rockSprites = document.createElement("canvas");
    rockSprites.width  = rockSpW * ROCK_NUM_VARIANTS;
    rockSprites.height = rockSpH;
    const c = rockSprites.getContext("2d");
    c.clearRect(0, 0, rockSprites.width, rockSprites.height);
    for (let v = 0; v < ROCK_NUM_VARIANTS; v++) {
        renderRockSprite(c, v * rockSpW, 0, rockSpW, rockSpH, v);
    }
}

function renderRockSprite(c, ox, oy, w, h, variant) {
    const cx = ox + w / 2;
    const cy = oy + h / 2;
    const r = w * (0.30 + (variant & 1) * 0.08);

    // Drop shadow
    c.fillStyle = "rgba(0,0,0,0.45)";
    c.beginPath();
    c.arc(cx + 1, cy + 1.2, r * 1.05, 0, Math.PI * 2);
    c.fill();

    // Boulder body — base gray
    const baseR = 105 + (variant * 7);
    const baseG = 100 + (variant * 6);
    const baseB = 95  + (variant * 5);
    c.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    c.fill();
    // Bumps for irregular shape
    const bumps = 3 + (variant % 2);
    for (let i = 0; i < bumps; i++) {
        const a = (Math.PI * 2 / bumps) * i + variant * 0.3;
        const d = r * 0.35;
        c.beginPath();
        c.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * 0.5, 0, Math.PI * 2);
        c.fill();
    }
    // Lit highlight (upper-left)
    c.fillStyle = `rgba(${baseR + 35},${baseG + 35},${baseB + 30},0.75)`;
    c.beginPath();
    c.arc(cx - r * 0.25, cy - r * 0.25, r * 0.50, 0, Math.PI * 2);
    c.fill();
    // Small darker crack/divot
    c.fillStyle = `rgba(${(baseR * 0.55) | 0},${(baseG * 0.55) | 0},${(baseB * 0.55) | 0},0.6)`;
    c.beginPath();
    c.arc(cx + r * 0.15, cy + r * 0.20, r * 0.18, 0, Math.PI * 2);
    c.fill();
}

// Weighted variant picker
//   48% pine — dark green
//   16% birch — light green w/ white trunk
//   14% maple — warm gold (buffer between birch and autumn)
//   13% autumn — red/orange
//    9% dead — skeletal
function pickTreeVariant() {
    const r = Math.random();
    let species;
    if      (r < 0.24) species = SPECIES_PINE;
    else if (r < 0.40) species = SPECIES_FIR;      // ~16% — soft rounded conifer sibling
    else if (r < 0.48) species = SPECIES_POPLAR;   // ~8%  — tall columnar broadleaf
    else if (r < 0.55) species = SPECIES_WILLOW;   // ~7%  — weeping broadleaf
    else if (r < 0.68) species = SPECIES_BIRCH;
    else if (r < 0.79) species = SPECIES_MAPLE;
    else if (r < 0.89) species = SPECIES_AUTUMN;
    else if (r < 0.94) species = SPECIES_CHERRY;   // ~5% — occasional flowering accent
    else               species = SPECIES_DEAD;
    const sz = (Math.random() < 0.5) ? 0 : 1;
    return (species << 1) | sz;
}

// A single grass blade: short vertical streak, dark base → light tip, slight lean.
function drawBlade(c, x, y, hgt, lean, rBase, gBase, bBase, a) {
    const steps = Math.max(2, hgt | 0);
    for (let s = 0; s < steps; s++) {
        const t = s / steps;                       // 0 base → ~1 tip
        const px = x + lean * t;
        const py = y - s;
        const r = Math.min(255, (rBase + t * 45) | 0);
        const g = Math.min(255, (gBase + t * 55) | 0);
        const b = Math.min(255, (bBase + t * 25) | 0);
        c.fillStyle = `rgba(${r},${g},${b},${(a).toFixed(2)})`;
        c.fillRect(px | 0, py | 0, 1, 1);
    }
}

// Dispatch a ground-cover sprite by variant index.
function renderGrassTopDown(c, ox, oy, w, h, variant) {
    if (variant < 10)      drawLushGrass(c, ox, oy, w, h, variant);
    else if (variant < 13) drawTallGrass(c, ox, oy, w, h, variant - 10);
    else if (variant < 16) drawDryGrass(c, ox, oy, w, h, variant - 13);
    else if (variant < 22) drawWildflowers(c, ox, oy, w, h, variant - 16);
    else if (variant === 22) drawClover(c, ox, oy, w, h);
    else if (variant === 23) drawFern(c, ox, oy, w, h);
    else if (variant === 24) drawShrub(c, ox, oy, w, h);
    else if (variant === 25) drawDandelion(c, ox, oy, w, h);
    else if (variant === 26) drawMushrooms(c, ox, oy, w, h);
    else if (variant === 27) drawBerryBush(c, ox, oy, w, h);
    else if (variant === 28) drawFlowerPatch(c, ox, oy, w, h);
    else if (variant === 29) drawLavender(c, ox, oy, w, h);
    else if (variant === 30) drawTulips(c, ox, oy, w, h);
    else if (variant === 31) drawPampas(c, ox, oy, w, h);
    else if (variant === 32) drawReeds(c, ox, oy, w, h);
    else if (variant === 33) drawGlowMushrooms(c, ox, oy, w, h);
    else if (variant === 34) drawBroadleaf(c, ox, oy, w, h);
    else if (variant === 35) drawJungleFern(c, ox, oy, w, h);
    else if (variant === 36) drawElephantEar(c, ox, oy, w, h);
    else if (variant === 37) drawDaisies(c, ox, oy, w, h);
    else if (variant === 38) drawPoppies(c, ox, oy, w, h);
    else if (variant === 39) drawFireweed(c, ox, oy, w, h);
    else if (variant === 40) drawButtercups(c, ox, oy, w, h);
    else if (variant === 41) drawPebbles(c, ox, oy, w, h);
    else if (variant === 42) drawLeafLitter(c, ox, oy, w, h);
    else if (variant === GRASS_CORNFLOWER) drawCornflowers(c, ox, oy, w, h);
    else if (variant === GRASS_BENT)       drawBentGrass(c, ox, oy, w, h);
    else if (variant === GRASS_LUPINE)     drawLupines(c, ox, oy, w, h);
    else if (variant === GRASS_BELL)       drawBellflowers(c, ox, oy, w, h);
    else if (variant === GRASS_TOADSTOOL)  drawToadstools(c, ox, oy, w, h);
    else if (variant === GRASS_LOG)        drawFallenLog(c, ox, oy, w, h);
    else if (variant === GRASS_STUMP)      drawStump(c, ox, oy, w, h);
    else if (variant === GRASS_SUNFLOWER)  drawSunflowers(c, ox, oy, w, h);
    else if (variant === GRASS_HEATHER)    drawHeather(c, ox, oy, w, h);
    else if (variant === GRASS_CATTAIL)    drawCattails(c, ox, oy, w, h);
    else if (variant === GRASS_BROWNMUSH)  drawBrownMushrooms(c, ox, oy, w, h);
    else if (variant === GRASS_STRAWBERRY) drawStrawberries(c, ox, oy, w, h);
    else if (variant === GRASS_BOULDER)    drawBoulder(c, ox, oy, w, h);
    else if (variant === GRASS_DAFFODIL)   drawDaffodils(c, ox, oy, w, h);
    else if (variant === GRASS_FOXGLOVE)   drawFoxgloves(c, ox, oy, w, h);
    else                     drawWildflowerMeadow(c, ox, oy, w, h);   // 43 + fallback
}

// --- Lush grass (10 shade/density variations) — rich jungle greens ---
function drawLushGrass(c, ox, oy, w, h, v) {
    // shade: v alternates greener/yellower & darker/lighter; density scales with v
    const yellow = (v % 3) * 0.07;          // only a touch of yellow-green
    const dark   = ((v >> 1) % 2) * 14;     // some darker
    const rB = 34 + yellow * 55 - dark;
    const gB = 108 + yellow * 26 - dark;    // greener, more saturated
    const bB = 32 + yellow * 8  - dark * 0.4;
    const count = 9 + (v % 4) + ((w / 3) | 0);  // denser tufts
    for (let i = 0; i < count; i++) {
        const x = ox + 1 + Math.random() * (w - 2);
        const y = oy + h - 1 - Math.random() * (h * 0.35);
        const hgt = 2 + Math.random() * (h * 0.42);
        const lean = (Math.random() - 0.5) * 2.2;
        drawBlade(c, x, y, hgt, lean, rB, gB, bB, 0.78 + Math.random() * 0.22);
    }
}

// --- Tall grass: fewer but long blades reaching up ---
function drawTallGrass(c, ox, oy, w, h, v) {
    drawLushGrass(c, ox, oy, w, h, 2);   // short underlayer
    const count = 5 + (w / 4 | 0);
    for (let i = 0; i < count; i++) {
        const x = ox + 1 + Math.random() * (w - 2);
        const y = oy + h - 1;
        const hgt = h * (0.6 + Math.random() * 0.38);
        const lean = (Math.random() - 0.5) * 3.2;
        drawBlade(c, x, y, hgt, lean, 46, 96, 30, 0.85);
    }
}

// --- Dry / golden grass: tan, sparse, bent ---
function drawDryGrass(c, ox, oy, w, h, v) {
    const count = 6 + (w / 4 | 0);
    for (let i = 0; i < count; i++) {
        const x = ox + 1 + Math.random() * (w - 2);
        const y = oy + h - 1 - Math.random() * (h * 0.3);
        const hgt = 2 + Math.random() * (h * 0.4);
        const lean = (Math.random() - 0.5) * 3.0;     // more bent
        const golden = 0.5 + Math.random() * 0.5;
        drawBlade(c, x, y, hgt, lean,
                  120 + golden * 50, 95 + golden * 40, 35 + golden * 20,
                  0.7 + Math.random() * 0.25);
    }
}

// --- Wildflowers: lush grass base + colored blossoms ---
const FLOWER_COLORS = [
    [240, 240, 235],  // white
    [248, 214, 70],   // yellow
    [220, 70,  70],   // red
    [240, 130, 180],  // pink
    [170, 110, 220],  // purple
    [90,  150, 235],  // blue
];
function drawWildflowers(c, ox, oy, w, h, colorIdx) {
    drawLushGrass(c, ox, oy, w, h, 1);
    const [fr, fg, fb] = FLOWER_COLORS[colorIdx % FLOWER_COLORS.length];
    const blooms = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < blooms; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const cy = oy + 2 + Math.random() * (h - 4);
        const pr = Math.max(1, w * 0.12);
        // petals (4 dots around)
        c.fillStyle = `rgba(${fr},${fg},${fb},0.95)`;
        c.beginPath(); c.arc(cx, cy, pr, 0, Math.PI * 2); c.fill();
        // bright center
        c.fillStyle = "rgba(255,240,120,0.95)";
        c.fillRect((cx - 0.5) | 0, (cy - 0.5) | 0, 1, 1);
    }
}

// --- Clover: little trefoil leaf clusters ---
function drawClover(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 0);
    const clusters = 2 + (Math.random() * 2 | 0);
    for (let i = 0; i < clusters; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const cy = oy + 2 + Math.random() * (h - 4);
        const lr = Math.max(1, w * 0.1);
        c.fillStyle = "rgba(60,140,55,0.95)";
        for (let a = 0; a < 3; a++) {
            const ang = (Math.PI * 2 / 3) * a - Math.PI / 2;
            c.beginPath();
            c.arc(cx + Math.cos(ang) * lr, cy + Math.sin(ang) * lr, lr, 0, Math.PI * 2);
            c.fill();
        }
    }
}

// --- Fern: central stem with side leaflets ---
function drawFern(c, ox, oy, w, h) {
    const fronds = 2 + (Math.random() * 2 | 0);
    for (let f = 0; f < fronds; f++) {
        const baseX = ox + 2 + Math.random() * (w - 4);
        const baseY = oy + h - 1;
        const topY  = oy + 1 + Math.random() * (h * 0.2);
        const curve = (Math.random() - 0.5) * 3;
        c.fillStyle = "rgba(40,105,38,0.92)";
        const steps = (baseY - topY) | 0;
        for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const sx = baseX + curve * t * t;
            const sy = baseY - s;
            c.fillRect(sx | 0, sy | 0, 1, 1);
            // side leaflets
            if (s % 2 === 0) {
                const ll = (1 - t) * w * 0.28;
                c.fillRect((sx - ll) | 0, sy | 0, 1, 1);
                c.fillRect((sx + ll) | 0, sy | 0, 1, 1);
            }
        }
    }
}

// --- Shrub: small rounded bush clump ---
function drawShrub(c, ox, oy, w, h) {
    const cx = ox + w * 0.5, cy = oy + h * 0.55;
    const r = w * 0.34;
    c.fillStyle = "rgba(0,0,0,0.25)";
    c.beginPath(); c.arc(cx + 0.6, cy + 0.8, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgb(34,86,32)";
    for (let i = 0; i < 5; i++) {
        const a = (Math.PI * 2 / 5) * i + Math.random() * 0.4;
        c.beginPath();
        c.arc(cx + Math.cos(a) * r * 0.4, cy + Math.sin(a) * r * 0.4, r * 0.6, 0, Math.PI * 2);
        c.fill();
    }
    c.fillStyle = "rgba(70,130,55,0.85)";
    c.beginPath(); c.arc(cx - r * 0.2, cy - r * 0.2, r * 0.5, 0, Math.PI * 2); c.fill();
}

// --- Dandelion: grass + white/yellow puff balls ---
function drawDandelion(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 4);
    const puffs = 1 + (Math.random() * 2 | 0);
    for (let i = 0; i < puffs; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const cy = oy + 2 + Math.random() * (h - 4);
        const pr = Math.max(1, w * 0.16);
        const white = Math.random() < 0.5;
        c.fillStyle = white ? "rgba(238,242,235,0.9)" : "rgba(250,225,90,0.95)";
        c.beginPath(); c.arc(cx, cy, pr, 0, Math.PI * 2); c.fill();
        if (white) { // fluffy specks
            c.fillStyle = "rgba(255,255,255,0.6)";
            for (let s = 0; s < 4; s++)
                c.fillRect((cx + (Math.random()-0.5)*pr*2.4)|0, (cy + (Math.random()-0.5)*pr*2.4)|0, 1, 1);
        }
    }
}

// --- Mushrooms: small cluster of caps ---
function drawMushrooms(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 0);
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const cy = oy + h * 0.4 + Math.random() * (h * 0.4);
        const cr = Math.max(1, w * 0.13);
        // stem
        c.fillStyle = "rgba(225,215,195,0.95)";
        c.fillRect(cx | 0, cy | 0, 1, Math.max(1, (cr) | 0));
        // cap (red or tan)
        const red = Math.random() < 0.55;
        c.fillStyle = red ? "rgba(200,60,45,0.97)" : "rgba(165,120,80,0.97)";
        c.beginPath(); c.arc(cx, cy, cr, Math.PI, 0); c.fill();
        if (red) { // white spots
            c.fillStyle = "rgba(255,255,255,0.9)";
            c.fillRect((cx - cr*0.4)|0, (cy - cr*0.3)|0, 1, 1);
        }
    }
}

// --- Berry bush: green clump with berry dots ---
function drawBerryBush(c, ox, oy, w, h) {
    drawShrub(c, ox, oy, w, h);
    const berries = 3 + (Math.random() * 4 | 0);
    const red = Math.random() < 0.5;
    for (let i = 0; i < berries; i++) {
        const bx = ox + w * 0.3 + Math.random() * (w * 0.4);
        const by = oy + h * 0.35 + Math.random() * (h * 0.4);
        c.fillStyle = red ? "rgba(205,40,45,0.97)" : "rgba(80,40,140,0.97)";
        c.beginPath(); c.arc(bx, by, Math.max(1, w * 0.08), 0, Math.PI * 2); c.fill();
    }
}

// --- Flower patch: dense bed of mixed-colour blooms ---
function drawFlowerPatch(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 1);
    const cols2 = [0, 1, 3, 4]; // white, yellow, pink, purple (from FLOWER_COLORS)
    const blooms = 7 + (Math.random() * 6 | 0);
    for (let i = 0; i < blooms; i++) {
        const cx = ox + 1.5 + Math.random() * (w - 3);
        const cy = oy + 1.5 + Math.random() * (h - 3);
        const [fr, fg, fb] = FLOWER_COLORS[cols2[(Math.random() * cols2.length) | 0]];
        const pr = Math.max(1, w * 0.1);
        c.fillStyle = `rgba(${fr},${fg},${fb},0.95)`;
        c.beginPath(); c.arc(cx, cy, pr, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(255,240,120,0.9)";
        c.fillRect(cx | 0, cy | 0, 1, 1);
    }
}

// --- Lavender: tall thin stems topped with purple flower spikes ---
function drawLavender(c, ox, oy, w, h) {
    const stems = 4 + (Math.random() * 3 | 0);
    for (let i = 0; i < stems; i++) {
        const x = ox + 2 + Math.random() * (w - 4);
        const baseY = oy + h - 1;
        const topY = oy + 1 + Math.random() * (h * 0.18);
        // stem
        c.fillStyle = "rgba(70,120,70,0.9)";
        for (let y = baseY; y > topY + (h * 0.35); y--) c.fillRect(x | 0, y | 0, 1, 1);
        // purple spike of dotted blossoms on the upper third
        for (let y = topY + (h * 0.35); y > topY; y -= 1.4) {
            const sway = Math.sin(y) * 0.8;
            c.fillStyle = `rgba(${150 + (Math.random()*40|0)},${90 + (Math.random()*30|0)},210,0.95)`;
            c.fillRect((x + sway) | 0, y | 0, 1, 1);
        }
    }
}

// --- Tulips: stems with bright colour cups ---
function drawTulips(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 0);
    const tulipCols = [[225,60,60],[245,200,60],[240,130,180],[235,235,235]];
    const stems = 3 + (Math.random() * 2 | 0);
    for (let i = 0; i < stems; i++) {
        const x = ox + 2 + Math.random() * (w - 4);
        const baseY = oy + h - 1;
        const topY = oy + 1 + Math.random() * (h * 0.25);
        c.fillStyle = "rgba(55,120,55,0.95)";
        for (let y = baseY; y > topY; y--) c.fillRect(x | 0, y | 0, 1, 1);
        // leaf
        c.fillRect((x - 1) | 0, (baseY - h * 0.3) | 0, 1, 1);
        // cup
        const [r, g, b] = tulipCols[(Math.random() * tulipCols.length) | 0];
        const cr = Math.max(1.2, w * 0.16);
        c.fillStyle = `rgb(${r},${g},${b})`;
        c.beginPath(); c.arc(x, topY, cr, Math.PI, 0); c.fill();        // rounded cup top
        c.fillRect((x - cr) | 0, topY | 0, Math.max(1, (cr * 2) | 0), 1);
    }
}

// --- Pampas / feather grass: tall stems with soft cream plumes ---
function drawPampas(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 2);
    const stems = 3 + (Math.random() * 2 | 0);
    for (let i = 0; i < stems; i++) {
        const x = ox + 2 + Math.random() * (w - 4);
        const baseY = oy + h - 1;
        const topY = oy + 1 + Math.random() * (h * 0.15);
        const lean = (Math.random() - 0.5) * 2;
        c.fillStyle = "rgba(120,130,80,0.85)";
        const steps = (baseY - topY) | 0;
        for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            c.fillRect((x + lean * t) | 0, (baseY - s) | 0, 1, 1);
        }
        // feathery plume blob at top (soft cream)
        const px = x + lean, py = topY;
        for (let p = 0; p < 10; p++) {
            const a = (0.4 + Math.random() * 0.4).toFixed(2);
            c.fillStyle = `rgba(232,222,190,${a})`;
            c.fillRect((px + (Math.random() - 0.5) * w * 0.35) | 0,
                       (py + (Math.random() - 0.2) * h * 0.28) | 0, 1, 1);
        }
    }
}

// --- Reeds / cattails: tall green reeds with brown seed heads ---
function drawReeds(c, ox, oy, w, h) {
    const stems = 4 + (Math.random() * 3 | 0);
    for (let i = 0; i < stems; i++) {
        const x = ox + 2 + Math.random() * (w - 4);
        const baseY = oy + h - 1;
        const topY = oy + 1 + Math.random() * (h * 0.1);
        const lean = (Math.random() - 0.5) * 1.6;
        c.fillStyle = "rgba(60,120,60,0.92)";
        const steps = (baseY - topY) | 0;
        for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            c.fillRect((x + lean * t) | 0, (baseY - s) | 0, 1, 1);
        }
        // brown cattail seed head near the top of ~half the reeds
        if (Math.random() < 0.6) {
            const hx = x + lean, hy = topY + h * 0.18;
            c.fillStyle = "rgba(95,60,30,0.97)";
            const hh = Math.max(2, h * 0.2);
            c.fillRect((hx - 0.5) | 0, hy | 0, 2, hh | 0);
        }
    }
}

// --- Glowing mushrooms: cyan caps; the soft glow halo is added per-frame ---
function drawGlowMushrooms(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 6);
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const cy = oy + h * 0.4 + Math.random() * (h * 0.4);
        const cr = Math.max(1, w * 0.14);
        // pale stem
        c.fillStyle = "rgba(210,235,230,0.95)";
        c.fillRect(cx | 0, cy | 0, 1, Math.max(1, cr | 0));
        // glowing cyan cap
        c.fillStyle = "rgba(90,225,210,0.97)";
        c.beginPath(); c.arc(cx, cy, cr, Math.PI, 0); c.fill();
        // bright core dot
        c.fillStyle = "rgba(200,255,250,0.95)";
        c.fillRect((cx - 0.5) | 0, (cy - 0.5) | 0, 1, 1);
    }
}

// --- Jungle broadleaf: a clump of rounded green leaves ---
function drawBroadleaf(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 0);
    const cx = ox + w * 0.5, cy = oy + h * 0.55;
    const leaves = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < leaves; i++) {
        const a = (Math.PI * 2 / leaves) * i + Math.random() * 0.5 - Math.PI / 2;
        const lr = w * (0.22 + Math.random() * 0.12);
        const lx = cx + Math.cos(a) * w * 0.22;
        const ly = cy + Math.sin(a) * h * 0.18;
        c.fillStyle = `rgb(${30 + (Math.random()*20|0)},${95 + (Math.random()*40|0)},${36 + (Math.random()*16|0)})`;
        c.beginPath();
        c.ellipse(lx, ly, lr, lr * 0.62, a, 0, Math.PI * 2);
        c.fill();
        // midrib highlight
        c.strokeStyle = "rgba(150,200,120,0.5)";
        c.lineWidth = 1;
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(lx, ly); c.stroke();
    }
}

// --- Jungle fern: bigger, lusher multi-frond fern ---
function drawJungleFern(c, ox, oy, w, h) {
    const fronds = 4 + (Math.random() * 3 | 0);
    for (let f = 0; f < fronds; f++) {
        const baseX = ox + w * 0.5 + (Math.random() - 0.5) * w * 0.3;
        const baseY = oy + h - 1;
        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const len = h * (0.55 + Math.random() * 0.4);
        const curve = (Math.random() - 0.5) * 4;
        c.fillStyle = `rgb(${28 + (Math.random()*16|0)},${100 + (Math.random()*30|0)},${34 + (Math.random()*14|0)})`;
        const steps = len | 0;
        for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const sx = baseX + Math.cos(ang) * len * t + curve * t * t;
            const sy = baseY + Math.sin(ang) * len * t;
            c.fillRect(sx | 0, sy | 0, 1, 1);
            if (s % 2 === 0) {
                const ll = (1 - t) * w * 0.32;
                c.fillRect((sx - ll) | 0, sy | 0, 1, 1);
                c.fillRect((sx + ll) | 0, sy | 0, 1, 1);
            }
        }
    }
}

// --- Elephant-ear: one big broad tropical leaf ---
function drawElephantEar(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 1);
    const cx = ox + w * 0.5 + (Math.random() - 0.5) * w * 0.2;
    const cy = oy + h * 0.5;
    const lw = w * (0.42 + Math.random() * 0.12);
    const lh = h * (0.5 + Math.random() * 0.14);
    const tilt = (Math.random() - 0.5) * 0.8;
    // shadow
    c.fillStyle = "rgba(0,0,0,0.22)";
    c.beginPath(); c.ellipse(cx + 1, cy + 1.5, lw, lh, tilt, 0, Math.PI * 2); c.fill();
    // leaf
    c.fillStyle = `rgb(34,${110 + (Math.random()*25|0)},42)`;
    c.beginPath(); c.ellipse(cx, cy, lw, lh, tilt, 0, Math.PI * 2); c.fill();
    // lighter half + midrib
    c.fillStyle = "rgba(120,190,110,0.45)";
    c.beginPath(); c.ellipse(cx - Math.sin(tilt) * lw * 0.3, cy - lh * 0.25, lw * 0.7, lh * 0.5, tilt, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "rgba(20,70,26,0.7)";
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(cx + Math.sin(tilt) * lh, cy + Math.cos(tilt) * lh);
    c.lineTo(cx - Math.sin(tilt) * lh, cy - Math.cos(tilt) * lh);
    c.stroke();
}

// --- Daisies: white-petal rings with a yellow eye over lush grass ---
function drawDaisies(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 0);
    const n = 2 + (Math.random() * 2 | 0);
    for (let i = 0; i < n; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const cy = oy + 2 + Math.random() * (h - 4);
        const pr = Math.max(1, w * 0.1);
        c.fillStyle = "rgba(248,248,244,0.96)";
        for (let p = 0; p < 6; p++) {
            const a = (Math.PI * 2 / 6) * p;
            c.beginPath();
            c.arc(cx + Math.cos(a) * pr, cy + Math.sin(a) * pr, Math.max(0.8, pr * 0.6), 0, Math.PI * 2);
            c.fill();
        }
        c.fillStyle = "rgba(250,206,72,1)";
        c.beginPath(); c.arc(cx, cy, Math.max(1, pr * 0.55), 0, Math.PI * 2); c.fill();
    }
}

// --- Poppies: red/orange cups on slender stems (classic fire-follower) ---
function drawPoppies(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 1);
    const n = 2 + (Math.random() * 2 | 0);
    for (let i = 0; i < n; i++) {
        const bx = ox + 2 + Math.random() * (w - 4);
        const by = oy + h - 1;
        const bh = h * (0.45 + Math.random() * 0.3);
        const fx = bx + (Math.random() - 0.5) * 2, fy = by - bh;
        c.strokeStyle = "rgba(60,120,46,0.85)";
        c.lineWidth = 1;
        c.beginPath(); c.moveTo(bx, by); c.lineTo(fx, fy); c.stroke();
        const pr = Math.max(1.2, w * 0.13);
        c.fillStyle = Math.random() < 0.5 ? "rgba(222,52,40,0.96)" : "rgba(238,108,32,0.96)";
        c.beginPath(); c.arc(fx, fy, pr, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(40,18,16,0.9)";
        c.fillRect((fx - 0.5) | 0, (fy - 0.5) | 0, 1, 1);
    }
}

// --- Fireweed: tall magenta flower spike — the iconic plant that blooms after fire ---
function drawFireweed(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 2);
    const spikes = 1 + (Math.random() * 2 | 0);
    for (let s = 0; s < spikes; s++) {
        const bx = ox + 3 + Math.random() * (w - 6);
        const by = oy + h - 1;
        const sh = h * (0.7 + Math.random() * 0.28);
        c.strokeStyle = "rgba(58,112,44,0.9)";
        c.lineWidth = 1;
        c.beginPath(); c.moveTo(bx, by); c.lineTo(bx, by - sh); c.stroke();
        const blooms = Math.max(3, (sh / 2) | 0);
        for (let b = 0; b < blooms; b++) {
            const t = b / blooms;               // 0 bottom → 1 top
            const yy = by - sh * t;
            const open = 1 - t;                 // lower flowers open, top are buds
            const rr = Math.max(0.8, w * 0.09 * (0.5 + open));
            c.fillStyle = `rgba(${(214 - t * 30) | 0},${(50 + t * 40) | 0},${(130 + t * 30) | 0},0.88)`;
            const off = (b & 1 ? 1 : -1) * w * 0.12;
            c.beginPath(); c.arc(bx + off, yy, rr, 0, Math.PI * 2); c.fill();
        }
    }
}

// --- Buttercups: scattered bright-yellow dots ---
function drawButtercups(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 0);
    const n = 4 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) {
        const cx = ox + 1 + Math.random() * (w - 2);
        const cy = oy + 1 + Math.random() * (h - 2);
        const pr = Math.max(0.9, w * 0.07);
        c.fillStyle = "rgba(252,214,40,0.95)";
        c.beginPath(); c.arc(cx, cy, pr, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(255,248,180,0.9)";
        c.fillRect((cx - 0.5) | 0, (cy - 0.5) | 0, 1, 1);
    }
}

// --- Cornflowers: true-blue ragged star-heads on a green clump (the missing blue) ---
function drawCornflowers(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 2);
    const n = 3 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) {
        const cx = ox + 1 + Math.random() * (w - 2);
        const cy = oy + 1 + Math.random() * (h - 2);
        const pr = Math.max(0.9, w * 0.075);
        c.fillStyle = "rgba(64,104,214,0.95)";                  // ragged outer rays
        for (let p = 0; p < 5; p++) {
            const a = (p / 5) * 6.2831853 + i;
            c.fillRect((cx + Math.cos(a) * pr) | 0, (cy + Math.sin(a) * pr) | 0, 1, 1);
        }
        c.fillStyle = "rgba(108,148,238,0.95)";                 // light-blue petals
        c.beginPath(); c.arc(cx, cy, pr * 0.7, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(22,34,96,0.95)";                    // deep-blue centre
        c.fillRect((cx - 0.5) | 0, (cy - 0.5) | 0, 1, 1);
    }
}

// --- Bent-grass: airy clump of tall thin blades tipped with pale seed heads ---
function drawBentGrass(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 1);
    const n = 5 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) {
        const bx = ox + 2 + Math.random() * (w - 4);
        const by = oy + h - 1 - Math.random() * 2;
        const bh = Math.max(3, h * (0.4 + Math.random() * 0.4));
        const lean = (Math.random() - 0.5) * w * 0.18;
        drawBlade(c, bx, by, bh, lean, 70, 96, 46, 0.9);        // tall green blade
        c.fillStyle = "rgba(214,200,150,0.9)";                  // pale seed head at the tip
        c.fillRect((bx + lean) | 0, (by - bh) | 0, 1, 1);
        c.fillStyle = "rgba(236,226,186,0.75)";
        c.fillRect((bx + lean) | 0, (by - bh - 1) | 0, 1, 1);
    }
}

// --- Lupines: tall tapering flower SPIKES (purple/blue) — a vertical-spike shape ---
function drawLupines(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 1);
    const pal = [[126,86,196],[150,112,214],[96,132,206]];   // purples / blue
    const n = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
        const bx = ox + 2 + Math.random() * (w - 4);
        const by = oy + h - 1;
        const sh = Math.max(4, h * (0.45 + Math.random() * 0.35));
        c.fillStyle = "rgba(74,112,52,0.85)";                // stem
        c.fillRect(bx | 0, (by - sh) | 0, 1, sh);
        const col = pal[(Math.random() * pal.length) | 0];
        for (let s = 0; s < sh; s += 2) {                    // spike of florets, tapering up
            const t = s / sh;
            const ww = Math.max(0.6, (1 - t) * w * 0.10);
            c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${(0.7 + 0.3 * (1 - t)).toFixed(2)})`;
            c.fillRect((bx - ww) | 0, (by - s) | 0, Math.max(1, (ww * 2) | 0), 1);
        }
        c.fillStyle = "rgba(230,220,250,0.8)";               // pale tip
        c.fillRect(bx | 0, (by - sh) | 0, 1, 1);
    }
}

// --- Bellflowers: violet bells DROOPING from an upright stem — a hanging shape ---
function drawBellflowers(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 2);
    const n = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
        const bx = ox + 2 + Math.random() * (w - 4);
        const topy = oy + 1 + Math.random() * (h * 0.35);
        const sh = Math.max(4, h * (0.35 + Math.random() * 0.3));
        c.fillStyle = "rgba(72,110,54,0.85)";                // upright stem
        c.fillRect(bx | 0, topy | 0, 1, sh);
        const bells = 2 + (Math.random() * 2 | 0);
        const bw = Math.max(1.4, w * 0.11);
        for (let bI = 0; bI < bells; bI++) {
            const byp = topy + sh * (0.45 + bI * 0.26);
            const bxp = bx + (bI & 1 ? 1 : -1) * w * 0.06;   // alternate sides
            c.fillStyle = "rgba(138,102,206,0.95)";          // violet bell, hanging down
            c.beginPath();
            c.moveTo(bxp - bw * 0.5, byp);
            c.lineTo(bxp + bw * 0.5, byp);
            c.lineTo(bxp, byp + bw * 1.25);
            c.closePath(); c.fill();
            c.fillStyle = "rgba(186,156,230,0.9)";           // lit rim
            c.fillRect((bxp - bw * 0.4) | 0, byp | 0, 1, 1);
        }
    }
}

// --- Toadstools: iconic red-cap, white-spotted mushrooms on pale stems ---
function drawToadstools(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 4);
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
        const cx = ox + 2 + Math.random() * (w - 4);
        const base = oy + h - 1 - Math.random() * (h * 0.15);
        const ch = Math.max(3, h * (0.18 + Math.random() * 0.14));   // stem height
        const cr = Math.max(1.5, w * (0.10 + Math.random() * 0.05));  // cap radius
        c.fillStyle = "rgba(0,0,0,0.22)";
        c.beginPath(); c.ellipse(cx, base, cr * 0.9, cr * 0.4, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(238,232,214,0.95)";                       // pale stem
        c.fillRect((cx - cr * 0.25) | 0, (base - ch) | 0, Math.max(1, (cr * 0.5) | 0), ch | 0);
        c.fillStyle = "rgba(196,40,32,0.97)";                         // red cap dome
        c.beginPath(); c.ellipse(cx, base - ch, cr, cr * 0.62, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(232,96,74,0.85)";                         // lit top-left
        c.beginPath(); c.ellipse(cx - cr * 0.3, base - ch - cr * 0.18, cr * 0.4, cr * 0.26, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = "rgba(246,240,226,0.92)";                       // white spots
        for (let s = 0; s < 3; s++)
            c.fillRect((cx + (Math.random() - 0.5) * cr * 1.4) | 0, (base - ch + (Math.random() - 0.5) * cr * 0.7) | 0, 1, 1);
    }
}

// --- Fallen log: a mossy horizontal log with end-grain rings (forest structure) ---
function drawFallenLog(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 6);
    const ly = oy + h * 0.5 + Math.random() * h * 0.22;
    const lx0 = ox + w * 0.08, lw = w * 0.84, lh = Math.max(2, h * 0.16);
    c.fillStyle = "rgba(0,0,0,0.2)";
    c.fillRect(lx0 | 0, (ly + lh * 0.7) | 0, lw | 0, Math.max(1, (lh * 0.5) | 0));
    c.fillStyle = "#6b4a2c";                                          // log body
    c.fillRect(lx0 | 0, ly | 0, lw | 0, lh | 0);
    c.fillStyle = "rgba(40,26,14,0.5)";                              // underside shade
    c.fillRect(lx0 | 0, (ly + lh * 0.6) | 0, lw | 0, Math.max(1, (lh * 0.4) | 0));
    c.fillStyle = "#8a6038";                                          // end-grain
    c.beginPath(); c.ellipse(lx0, ly + lh * 0.5, lh * 0.55, lh * 0.55, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#5b3d22";
    c.beginPath(); c.ellipse(lx0, ly + lh * 0.5, lh * 0.28, lh * 0.28, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(72,124,52,0.85)";                            // moss on top
    const moss = Math.max(3, (lw * 0.22) | 0);
    for (let m = 0; m < moss; m++)
        c.fillRect((lx0 + Math.random() * lw) | 0, (ly - Math.random() * 1.6) | 0, 1 + (Math.random() < 0.35 ? 1 : 0), 1);
}

// --- Tree stump: a low cut stump with growth rings + a hopeful sprout ---
function drawStump(c, ox, oy, w, h) {
    drawLushGrass(c, ox, oy, w, h, 5);
    const cx = ox + w * 0.5, base = oy + h - 2;
    const sh = Math.max(3, h * 0.22), sr = Math.max(2, w * 0.22);
    c.fillStyle = "rgba(0,0,0,0.22)";
    c.beginPath(); c.ellipse(cx, base, sr * 1.1, sr * 0.4, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#5b3d22";
    c.fillRect((cx - sr) | 0, (base - sh) | 0, (sr * 2) | 0, sh | 0);  // trunk side
    c.fillStyle = "rgba(40,26,14,0.4)";
    c.fillRect(cx | 0, (base - sh) | 0, sr | 0, sh | 0);              // shaded right
    c.fillStyle = "#8a6038";
    c.beginPath(); c.ellipse(cx, base - sh, sr, sr * 0.5, 0, 0, Math.PI * 2); c.fill();  // cut top
    c.strokeStyle = "rgba(91,61,34,0.7)"; c.lineWidth = 1;
    for (let ring = 1; ring <= 2; ring++) {
        c.beginPath(); c.ellipse(cx, base - sh, sr * (ring / 3), sr * 0.5 * (ring / 3), 0, 0, Math.PI * 2); c.stroke();
    }

    if (r < 0.69) return 16 + (Math.random() * 6 | 0);    // 16-21 wildflowers

    if (r < 0.778) return GRASS_POPPY;        // 38 poppies

    if (r < 0.840) return GRASS_DAFFODIL;     // 57 NEW yellow daffodils
    if (r < 0.852) return GRASS_FOXGLOVE;     // 58 NEW foxglove bell-spikes
    if (r < 0.863) return GRASS_CATTAIL;      // 53 reedy cattails
    // --- clutter / structure band ---
    if (r < 0.877) return GRASS_TOADSTOOL;    // 48 red toadstools
    if (r < 0.888) return GRASS_BROWNMUSH;    // 54 NEW brown forest mushrooms
    if (r < 0.901) return GRASS_LITTER;       // 42 leaf litter

    if (r < 0.975) return 30;   // tulips

// After a burn, ground regrows FLOWER-RICH: fireweed, poppies and meadows bloom

function pickRegrowthVariant() {
    const r = Math.random();
    if (r < 0.34) return (Math.random() * 10) | 0;        // 0-9 lush grass returns
    if (r < 0.46) return GRASS_FIREWEED;                  // the signature post-fire bloom

// Rescan the grid for glowing-mushroom cells (cheap; runs on worldgen + ~1×/sec).
function refreshGlowSpots() {
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const spots = [];
    for (let i = 0; i < grid.length; i++) {
        if (grid[i] === GRASS && grassVar[i] === GRASS_GLOWMUSH) {
            const y = (i / cols) | 0, x = i - y * cols;
            spots.push({
                x: x * cell + cell * 0.5,
                y: y * cell + cell * 0.55,
                phase: Math.random() * Math.PI * 2,
                r: cell * (1.6 + Math.random() * 0.8),
            });
        }
    }
    glowSpots = spots;
    glowRefreshAt = 60; // sim-dt units until next rescan (FPS-independent — runs in update)
}

// ============================================================
// Fish — dark shadows gliding under the water surface
// ============================================================
function isWaterAt(px, py) {
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const cx = (px / cell) | 0, cy = (py / cell) | 0;
    if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) return false;
    return grid[idx(cx, cy)] === WATER;
}
function spawnFish() {
    fishList = [];
    if (!props.showFish) return;
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const water = [];
    for (let i = 0; i < grid.length; i++) if (grid[i] === WATER) water.push(i);
    if (!water.length) return;
    const count = Math.min(44, Math.max(1, (water.length / 30) | 0));
    for (let k = 0; k < count; k++) {
        const i = water[(Math.random() * water.length) | 0];
        const y = (i / cols) | 0, x = i - y * cols;
        fishList.push({
            x: x * cell + cell * 0.5,
            y: y * cell + cell * 0.5,
            ang: Math.random() * Math.PI * 2,
            speed: 0.18 + Math.random() * 0.28,
            size: cell * (0.22 + Math.random() * 0.18),
            wob: Math.random() * Math.PI * 2,         // tail-wag / wander phase
            dart: 0,                                  // >0 = mid-dart (brief startled burst)
        });
    }
}
function updateFish(dt) {
    if (!props.showFish || !fishList.length) return;
    for (const f of fishList) {
        rememberPos(f);
        // Occasional dart — fish hold a lazy cruise, then suddenly flick forward with
        // a quick direction change, then ease back to cruising. Reads as living fish.
        if (f.dart > 0) f.dart -= dt;
        else if (Math.random() < 0.0016 * dt) { f.dart = 8 + Math.random() * 10; f.ang += (Math.random() - 0.5) * 1.2; }
        const darting = f.dart > 0;
        f.wob += (darting ? 0.45 : 0.12) * dt;        // tail wags faster mid-dart
        f.ang += Math.sin(f.wob * 0.3) * 0.05;        // gentle meander
        const sp = f.speed * 2.2 * (darting ? 3.2 : 1.0);
        const nx = f.x + Math.cos(f.ang) * sp * dt;
        const ny = f.y + Math.sin(f.ang) * sp * dt;
        if (isWaterAt(nx, ny)) { f.x = nx; f.y = ny; }
        else { f.ang += 1.9 + Math.random() * 0.8; f.dart = 0; }  // shore → stop, turn
    }
}

// ============================================================
// Ground critters — a few deer/rabbits that graze and bolt from fire (kept light:
// a handful of entities, cheap wander + an occasional local fire scan)
// ============================================================
function isLandAt(px, py) {
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const cx = (px / cell) | 0, cy = (py / cell) | 0;
    if (cx < 0 || cx >= cols || cy < 0 || cy >= rows) return false;
    const s = grid[idx(cx, cy)];
    return s !== WATER && s !== ROCK;
}
function spawnCritters() {
    critters = [];
    if (!props.showCritters) return;
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const target = Math.min(9, Math.max(3, ((cols * rows) / 6000) | 0));
    let tries = 0;
    while (critters.length < target && tries < 500) {
        tries++;
        const i = (Math.random() * grid.length) | 0, s = grid[i];
        if (s !== GRASS && s !== DIRT) continue;
        const y = (i / cols) | 0, x = i - y * cols;
        critters.push({
            x: x * cell + cell * 0.5, y: y * cell + cell * 0.5,
            ang: Math.random() * 6.28, speed: 0,
            size: cell * (0.55 + Math.random() * 0.3),
            kind: Math.random() < 0.55 ? 0 : 1,        // 0 deer, 1 rabbit
            phase: Math.random() * 6.28,
            fleeT: 0, pauseT: Math.random() * 80, checkT: (Math.random() * 30) | 0,
        });
    }
}
function updateCritters(dt) {
    if (!props.showCritters || !critters.length) return;
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    for (const c of critters) {
        rememberPos(c);
        // Occasional cheap scan of nearby cells for fire → bolt directly away
        if ((c.checkT -= dt) <= 0) {
            c.checkT = 8 + Math.random() * 8;
            const cx = (c.x / cell) | 0, cy = (c.y / cell) | 0, R = 7;
            let fx = 0, fy = 0, found = 0;
            for (let dy = -R; dy <= R; dy += 2) {
                for (let dx = -R; dx <= R; dx += 2) {
                    const nx = cx + dx, ny = cy + dy;
                    if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
                    const s = grid[idx(nx, ny)];
                    if (s === BURN_GRASS || s === BURN_TREE) { fx += dx; fy += dy; found++; }
                }
            }
            if (found) { c.fleeT = 55 + Math.random() * 45; c.ang = Math.atan2(-fy, -fx); }
        }
        if (c.fleeT > 0) {
            c.fleeT -= dt;
            c.speed = c.kind === 1 ? 2.6 : 2.0;          // rabbits faster
            c.ang  += (Math.random() - 0.5) * 0.2;
        } else if ((c.pauseT -= dt) <= 0) {
            if (Math.random() < 0.5) { c.speed = 0; c.pauseT = 40 + Math.random() * 90; }   // graze
            else { c.speed = c.kind === 1 ? 0.9 : 0.6; c.ang += (Math.random() - 0.5) * 1.6; c.pauseT = 25 + Math.random() * 55; }
        }
        c.phase += (c.speed > 0.1 ? (c.kind === 1 ? 0.5 : 0.34) : 0.04) * dt;
        const nx = c.x + Math.cos(c.ang) * c.speed * dt;
        const ny = c.y + Math.sin(c.ang) * c.speed * dt;
        if (nx > cell && nx < worldPxW - cell && ny > cell && ny < worldPxH - cell && isLandAt(nx, ny)) {
            c.x = nx; c.y = ny;
        } else { c.ang += 2.0 + Math.random(); }         // turn from water / edge
    }
}

// ============================================================
// Daytime insects — butterflies fluttering over land, dragonflies skimming water.
// Populated to a season-scaled target (peak spring/summer, ~none in winter), like
// the fireflies but visible and daytime.
// ============================================================
const BUTTERFLY_COLORS = [
    [248, 244, 236], [250, 210, 70], [240, 130, 60], [150, 110, 220], [90, 160, 235], [235, 120, 170],
];
function spawnInsect() {
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    const isDragon = Math.random() < 0.35;
    // Spawn across the visible WORLD extent (larger than the screen when zoomed out).
    const vwW = canvas.width / viewZoom, vwH = canvas.height / viewZoom;
    let x = camX + Math.random() * vwW, y = camY + Math.random() * vwH;
    for (let t = 0; t < 8; t++) {                         // try to place over the right surface
        const tx = camX + Math.random() * vwW, ty = camY + Math.random() * vwH;
        if (isDragon ? isWaterAt(tx, ty) : isLandAt(tx, ty)) { x = tx; y = ty; break; }
    }
    insects.push({
        x, y, vx: (Math.random() - 0.5) * 0.7, vy: (Math.random() - 0.5) * 0.7,
        kind: isDragon ? 1 : 0,
        wing: Math.random() * 6.28, wingSpd: isDragon ? 1.4 : 0.45 + Math.random() * 0.4,
        size: isDragon ? cell * 0.22 : cell * (0.16 + Math.random() * 0.1),
        color: isDragon ? [70, 95, 110] : BUTTERFLY_COLORS[(Math.random() * BUTTERFLY_COLORS.length) | 0],
        bob: Math.random() * 6.28, life: 1,
    });
}
function updateInsects(dt) {
    const seasonLife = seasonParam ? seasonParam.life : 1;
    const target = props.showInsects ? ((22 * qMul * seasonLife) | 0) : 0;
    if (insects.length < target && Math.random() < 0.08 * dt) spawnInsect();
    if (!props.showInsects && insects.length) { insects.length = 0; return; }
    if (!insects.length) return;
    const wxF = Math.cos(windAngle), minX = camX - 30, maxX = camX + canvas.width / viewZoom + 30,
          minY = camY - 30, maxY = camY + canvas.height / viewZoom + 30;
    let wI = 0;
    for (let i = 0; i < insects.length; i++) {
        const p = insects[i];
        rememberPos(p);
        p.wing += p.wingSpd * dt;
        p.bob  += 0.18 * dt;
        if (p.kind === 0) {
            // Butterfly — erratic flutter with vertical bob, gentle wind drift
            p.vx += (Math.random() - 0.5) * 0.16 * dt + wxF * 0.01 * dt;
            p.vy += (Math.random() - 0.5) * 0.16 * dt - 0.01 * dt;
            const d = damp(0.9, dt); p.vx *= d; p.vy *= d;
            p.x += (p.vx + Math.sin(p.bob) * 0.25) * dt;
            p.y += (p.vy + Math.cos(p.bob * 1.3) * 0.2) * dt;
        } else {
            // Dragonfly — darts and hovers, keeps to the water
            if (Math.random() < 0.04 * dt) { p.vx = (Math.random() - 0.5) * 3; p.vy = (Math.random() - 0.5) * 3; }
            const d = damp(0.86, dt); p.vx *= d; p.vy *= d;
            const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
            if (isWaterAt(nx, ny) || Math.random() < 0.3) { p.x = nx; p.y = ny; }
            else { p.vx = -p.vx; p.vy = -p.vy; }
        }
        p.life -= 0.0016 * dt;
        if (p.life > 0 && p.x > minX && p.x < maxX && p.y > minY && p.y < maxY) insects[wI++] = p;
    }
    insects.length = wI;
}

// ============================================================
// Init / resize
// ============================================================
function rebuildGrid() {
    refreshDpiScale();
    const cell = Math.max(2, (props.cellSize * dpiScale) | 0);
    // World is "worldSize" times the viewport in each dimension, so there's room
    // for the camera to pan around. worldSize 1 = world == screen (no pan).
    let ws = Math.max(1, props.worldSize || 1);
    // RAM safety: the cached ground layers (bg/terrain/static) are each
    // worldPxW*worldPxH*4 bytes. Cap the world's pixel area so a large worldSize at
    // 4K/5K/8K can't exhaust memory (≈64MP → ~0.75GB across the three layers, fine
    // for the 16GB+ target). Only bites at extreme resolution×worldSize; normal use
    // is well under it. The pan range shrinks slightly instead of risking an OOM.
    const MAX_WORLD_MP = 64e6;
    const wpx = canvas.width * ws, wpy = canvas.height * ws;
    if (wpx * wpy > MAX_WORLD_MP) ws *= Math.sqrt(MAX_WORLD_MP / (wpx * wpy));
    cols = Math.ceil(canvas.width  * ws / cell) + 1;
    rows = Math.ceil(canvas.height * ws / cell) + 1;
    worldPxW = cols * cell;
    worldPxH = rows * cell;

    buildSpriteAtlases();

    const n = cols * rows;
    grid       = new Uint8Array(n);
    burnTimer  = new Float32Array(n);
    burnMax    = new Float32Array(n);
    fireHeat   = new Float32Array(n);
    treeGrowth = new Float32Array(n);
    treeVar    = new Uint8Array(n);
    grassVar   = new Uint8Array(n);
    rockVar    = new Uint8Array(n);
    jitterX    = new Int8Array(n);
    jitterY    = new Int8Array(n);
    waterPhase = new Uint8Array(n);
    smokeParticles = [];
    embers = [];
    leaves = [];
    lightningBolts = [];
    lightningGlows = [];
    flamePlumes = [];
    sparks = [];
    birds = [];
    fireflies = [];
    critters = [];
    insects = [];
    rainDrops = [];
    rainSplash = [];
    burningCount = 0;

    buildRockSprites();

    // Fresh world seed on every rebuild
    terrainSeed = (Math.random() * 1e6) | 0;

    // Path detection — narrow noise band creates winding dirt trails.
    // Tighter band than before = fewer, more occasional paths.
    const PATH_LOW  = 0.490;
    const PATH_HIGH = 0.510;
    const isPath = (x, y) => {
        if (!props.showPaths) return false;
        const n = fbm(x * 0.045, y * 0.045, terrainSeed + 7000, 2);
        return n > PATH_LOW && n < PATH_HIGH;
    };
    // River detection — narrow band on a different noise channel
    const RIVER_LOW  = 0.478;
    const RIVER_HIGH = 0.522;
    const isRiver = (x, y) => {
        if (!props.showRivers) return false;
        const n = fbm(x * 0.030, y * 0.030, terrainSeed + 8000, 2);
        return n > RIVER_LOW && n < RIVER_HIGH;
    };

    // Jitter range: ±25% of cell size, in pixels
    const jRange = Math.max(1, (cell * 0.25) | 0);
    // Noise frequencies
    const NS_TREE  = 0.060; // tree biome scale
    const NS_GRASS = 0.045; // grass biome scale (larger features)
    const NS_WATER = 0.040; // water body scale (larger features)
    const WATER_THRESHOLD = 0.74; // raise for less water, lower for more

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const i = y * cols + x;

            jitterX[i] = ((Math.random() * (jRange * 2 + 1)) | 0) - jRange;
            jitterY[i] = ((Math.random() * (jRange * 2 + 1)) | 0) - jRange;
            // bits 0-3 only — bits 4-7 are reserved flags
            waterPhase[i] = (Math.random() * 16) | 0;

            // --- Water: large-scale noise blobs (ponds) + narrow rivers ---
            const waterN = fbm(x * NS_WATER, y * NS_WATER, terrainSeed + 5000, 3);
            const isPond = waterN > WATER_THRESHOLD;
            if (isPond || isRiver(x, y)) {
                grid[i] = WATER;
                // Lily pads only on ponds (not rivers — flowing water = no pads)
                if (props.showLilyPads && isPond && Math.random() < 0.08) {
                    waterPhase[i] |= 0x40;
                    if (Math.random() < 0.5) waterPhase[i] |= 0x20;
                }
                continue;
            }

            // --- Path: narrow noise band winds dirt trails through forest ---
            if (props.showPaths && isPath(x, y)) {
                grid[i] = DIRT;
                waterPhase[i] |= 0x80; // mark for path tint
                continue;
            }

            // --- Biome modulators ---
            // Tree biome 0..1 -> creates clearings and dense pockets
            const tBiome = fbm(x * NS_TREE,  y * NS_TREE,  terrainSeed + 1000, 3);
            // Grass biome 0..1 -> meadows vs sparse
            const gBiome = fbm(x * NS_GRASS, y * NS_GRASS, terrainSeed + 2000, 2);

            // Multiply user density by biome value (range ~0.2× to ~1.8×)
            const localTree  = props.treeDensity  * (0.20 + tBiome * 1.60);
            const localGrass = props.grassDensity * (0.40 + gBiome * 1.10);

            if (Math.random() < localTree) {
                grid[i] = TREE;
                treeVar[i]  = pickTreeVariant();
                grassVar[i] = pickGrassVariant();
                // Established forest: mostly mature with natural size variety
                treeGrowth[i] = 0.7 + Math.random() * 0.3;
            } else if (Math.random() < localGrass) {
                grid[i] = GRASS;
                grassVar[i] = pickGrassVariant();
            } else if (props.showRocks && Math.random() < props.rockDensity) {
                grid[i] = ROCK;
                rockVar[i] = (Math.random() * ROCK_NUM_VARIANTS) | 0;
            } else {
                grid[i] = DIRT;
            }
        }
    }

    // Second pass — mark water cells adjacent to vegetation as "shoreline shaded"
    // (bit 0x10) so we can tint them green like a tree reflection
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const i = y * cols + x;
            if (grid[i] !== WATER) continue;
            for (let d = 0; d < NEIGHBOURS.length; d++) {
                const nx = x + NEIGHBOURS[d][0];
                const ny = y + NEIGHBOURS[d][1];
                if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
                const ns = grid[idx(nx, ny)];
                if (ns === TREE || ns === BURN_TREE) {
                    waterPhase[i] |= 0x10; // shoreline reflection
                    break;
                }
            }
        }
    }

    refreshGlowSpots();
    spawnFish();
    spawnCritters();
    markTerrainDirty();
    // A regeneration during start-up (WE's first property batch, a resize) wipes the
    // world — and with it the starter fire, which was a fixed 200 ms timer that could
    // land before them. Re-arm it so exactly one starter fire survives.
    if (performance.now() - bootMs < 10000) scheduleStarterFire();
}

// Starter fire so the wallpaper opens with visible action — one pending timer;
// re-scheduling cancels it, so a burst of start-up regenerations yields one fire.
let bootMs = 0, starterTimer = 0;
function scheduleStarterFire() {
    if (!props.seedFireOnStart) return;
    clearTimeout(starterTimer);
    starterTimer = setTimeout(() => {
        // near the world centre (roughly where the default camera looks)
        igniteAt(worldPxW * (0.4 + Math.random() * 0.2), worldPxH * (0.4 + Math.random() * 0.2), 2);
    }, 300);
}

// Render at DEVICE pixels. innerWidth/innerHeight are CSS pixels, so on a scaled
// display (e.g. a 4K panel at 150–200% Windows scaling, devicePixelRatio 1.5–2)
// sizing the canvas to them rendered at a fraction of native resolution and the
// browser stretched it — blurring all the pixel art. The bitmap is now
// innerWidth × devicePixelRatio (capped at 8K) with its CSS size pinned to the
// viewport, and pointer input is scaled by the same factor (inputScale).
let inputScale = 1;
function viewportPx() {
    const cw = window.innerWidth, ch = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;
    if (!(dpr > 0)) dpr = 1;
    dpr = Math.min(dpr, 7680 / Math.max(1, cw), 4320 / Math.max(1, ch));   // never above 8K
    dpr = Math.max(dpr, 1 / 1024);
    return { cw, ch, dpr, w: Math.max(1, Math.round(cw * dpr)), h: Math.max(1, Math.round(ch * dpr)) };
}

function resize() {
    const vp = viewportPx();
    const w = vp.w;
    const h = vp.h;
    // The visible canvas is the viewport (in device pixels)...
    canvas.width  = w;
    canvas.height = h;
    canvas.style.width  = vp.cw + "px";
    canvas.style.height = vp.ch + "px";
    inputScale = w / Math.max(1, vp.cw);
    if (!glowCanvas) {
        glowCanvas = document.createElement("canvas");
        glowCtx    = glowCanvas.getContext("2d");
        initGlowGL();   // try to put the fire glow on the GPU (falls back to 2D)
        initTreeGL();   // …and the trees (shares the same GL context)
    }
    // Size the GL buffer to EXACTLY the viewport, once, here (never mid-run — a realloc
