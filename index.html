            // colours + globalAlpha: no per-frame rgba() string garbage.
            ctx.globalAlpha = a * 0.10;
            ctx.fillStyle = "rgb(220,255,140)";
            ctx.beginPath();
            ctx.arc(fx, fy, f.size * 2.4, 0, Math.PI * 2);
            ctx.fill();
            // Core
            ctx.globalAlpha = a * 0.7;
            ctx.fillStyle = "rgb(240,255,170)";
            ctx.beginPath();
            ctx.arc(fx, fy, f.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Ambient leaves (above smoke for that drifting feel)
    if (leaves.length) {
        for (const p of leaves) {
            const px = drawX(p), py = drawY(p);
            ctx.globalAlpha = p.life * 0.7;          // exact opacity, no per-frame string
            ctx.fillStyle = p.css;
            ctx.beginPath();
            ctx.ellipse(px, py, p.size * 1.5, p.size * 0.55, p.rot, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Bird flocks — gull-wing silhouettes that actually beat their wings: a short
    // body with elbowed wings whose tips sweep through a wide up/down arc.
    if (birds.length) {
        ctx.strokeStyle = "rgba(18,12,8,0.85)";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (const b of birds) {
            const bx = drawX(b), by = drawY(b);
            const f = Math.sin(b.flap);              // -1 (downstroke) .. +1 (upstroke)
            const sz = b.size;
            ctx.lineWidth = sz * 0.7;
            // Both elbow and tip beat with the stroke (tips swing wider), so the
            // wings droop on the downstroke and sweep up into a gull on the upstroke.
            const elbowY = by - sz * (0.15 + f * 0.45);
            const tipY   = by - sz * (0.05 + f * 1.3);
            const shX = sz * 0.35, elbowX = sz * 1.25, tipX = sz * 2.7;
            ctx.beginPath();
            ctx.moveTo(bx - tipX,   tipY);           // left tip
            ctx.lineTo(bx - elbowX, elbowY);         // left elbow
            ctx.lineTo(bx - shX,    by);             // left shoulder
            ctx.lineTo(bx + shX,    by);             // body
            ctx.lineTo(bx + elbowX, elbowY);         // right elbow
            ctx.lineTo(bx + tipX,   tipY);           // right tip
            ctx.stroke();
        }
    }

    // Rain — wind-slanted streaks falling
    if (rainDrops.length) {
        ctx.strokeStyle = "rgba(180,210,240,0.65)";
        ctx.globalAlpha = 1 - 0.45 * atmo.night;
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        // Every drop shares one style → one path, one stroke (a storm is ~1200 drops;
        // they used to be 1200 separate beginPath/stroke calls).
        ctx.beginPath();
        for (const r of rainDrops) {
            const rx = drawX(r), ry = drawY(r);
            // Direction = velocity (normalized × streak length)
            const sp = Math.hypot(r.vx, r.vy) || 1;
            const dx = (r.vx / sp) * r.len;
            const dy = (r.vy / sp) * r.len;
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - dx, ry - dy);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
    // Splash droplets where the douse-rain lands
    if (rainSplash.length) {
        ctx.fillStyle = "rgb(205,228,246)";
        for (const p of rainSplash) {
            const px = drawX(p), py = drawY(p);
            ctx.globalAlpha = Math.min(1, p.life) * 0.7;
            ctx.fillRect(px | 0, py | 0, 1, 2);
        }
        ctx.globalAlpha = 1;
    }

    // Lightning bolts (very top, with flash) — still in world space
    drawLightning();

    // Back to screen space for the full-screen overlays + cursor UI.
    ctx.setTransform(1, 0, 0, 1, 0, 0);


    // --- Seasonal colour grade over the whole scene ---
    // Winter desaturates + cools, autumn warms to gold, spring freshens, summer
    // is neutral. Always on (it IS the seasonal look), kept tasteful.
    if (seasonParam) {
        const s = seasonParam;
        if (s.desat > 0.01) {
            ctx.save();
            ctx.globalCompositeOperation = "saturation";
            ctx.fillStyle = "hsl(0,0%,50%)";
            ctx.globalAlpha = s.desat;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (s.ta > 0.005) {
            ctx.save();
            ctx.globalCompositeOperation = s.mode;
            ctx.fillStyle = `rgba(${s.tr | 0},${s.tg | 0},${s.tb | 0},${s.ta.toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (s.bright > 0.005) {
            ctx.save();
            ctx.globalCompositeOperation = "screen";
            ctx.fillStyle = `rgba(255,255,255,${s.bright.toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (s.snow > 0.03) {                 // gentle frost wash over the canopy
            ctx.fillStyle = `rgba(244,248,255,${(s.snow * 0.12).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
        }
    }

    // Falling snow — screen-space flakes in front of the scene
    if (snowFlakes.length) {
        ctx.fillStyle = "#ffffff";
        for (const p of snowFlakes) {
            ctx.globalAlpha = 0.45 + p.depth * 0.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.5 + p.depth * 0.6), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Rainbow — only for the minute after a storm clears. Screen-space, like the sky it
    // belongs to: a big soft arc rising from below the view, shimmering slightly.
    if (atmo.rainbow > 0.01) {
        if (!rainbowSprite) rainbowSprite = bakeRainbow();
        const R = Math.min(w * 0.66, h * 1.05), cx = w * 0.56 - camX * 0.03, cy = h * 1.18;
        ctx.save();
        // Clip to the ring itself. The sprite is a 2R×R rectangle that's mostly
        // transparent, but every pixel of it still gets blended — ~8 ms at 4K on a
        // GTX 1050 Ti. Filling only the band (its edges already fade to nothing, so
        // the clip is invisible) is ~3× less area.
        ctx.beginPath();
        ctx.arc(cx, cy, R, Math.PI, 2 * Math.PI);
        ctx.arc(cx, cy, R * 0.78, 2 * Math.PI, Math.PI, true);
        ctx.closePath();
        ctx.clip();
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = Math.min(0.78, atmo.rainbow * 0.78) * (0.9 + 0.1 * Math.sin(renderTimeSec * 0.9));
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(rainbowSprite, 0, 0, 1024, 512, cx - R, cy - R, R * 2, R);
        ctx.restore();
    }

    // Mouse hover indicator — small ignition-radius preview (screen-space, so the
    // world radius is scaled by the view zoom)
    if (props.showMouseHint && props.mouseInteraction && mouseInside) {
        const r = Math.max(1, props.igniteRadius) * cell * viewZoom;
        ctx.save();
        ctx.strokeStyle = "rgba(255,180,80,0.55)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        // Small flame dot in centre
        ctx.fillStyle = "rgba(255,150,60,0.85)";
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Weather ambient tint — a gentle warm haze in drought, cool wash in heavy wet
    // weather. Kept subtle (and behind the "Screen effects" toggle) so it stays
    // easy to look at as a desktop background.
    if (props.screenEffects) {
        const dry = weatherDryness();                         // 0..1 (drought)
        const wet = Math.max(0, weatherIntensitySmooth - 0.3); // 0..0.7 (rain→storm)
        if (dry > 0.02) {
            ctx.save();
            ctx.globalCompositeOperation = "soft-light";
            ctx.fillStyle = `rgba(255,205,120,${(dry * 0.16).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
        if (wet > 0.02) {
            ctx.save();
            ctx.globalCompositeOperation = "multiply";
            const m = Math.min(1, wet);
            ctx.fillStyle = `rgba(${(160 - m*35)|0},${(172 - m*25)|0},${(195 - m*8)|0},${(m * 0.16).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
    }

    // RGB edge vignette — bleed fire / lightning color to screen borders so
    // Wallpaper Engine's iCUE/Aura/Razer/Chroma plugin samples vivid color.
    // (Gentle by default; its own toggle + the Screen-effects toggle both gate it.)
    if (props.rgbEdgeMode && props.screenEffects) {
        // Base intensity scales with burning cells (capped) + lightning pulse
        const fireLoad = Math.min(1, burningCount / 250);
        const intensity = Math.max(rgbVignettePulse * 0.9, fireLoad * 0.65) * props.rgbEdgeStrength;
        if (intensity > 0.03) {
            // Vignette gradient: warm orange outer (fire) or cool blue (lightning)
            const cxg = canvas.width  * 0.5;
            const cyg = canvas.height * 0.5;
            const inner = Math.min(canvas.width, canvas.height) * 0.35;
            const outer = Math.max(canvas.width, canvas.height) * 0.85;
            const grad = ctx.createRadialGradient(cxg, cyg, inner, cxg, cyg, outer);
            const aPeak = (intensity * 0.32).toFixed(3);   // gentler than before
            // Lightning skews tint cool, fire skews warm
            if (rgbVignettePulse > fireLoad * 0.5) {
                grad.addColorStop(0, "rgba(255,150,80,0)");
                grad.addColorStop(0.6, `rgba(255,170,90,${aPeak})`);
                grad.addColorStop(1,   `rgba(255,90,40,${(intensity * 0.55).toFixed(3)})`);
            } else {
                grad.addColorStop(0, "rgba(255,140,60,0)");
                grad.addColorStop(0.6, `rgba(255,150,55,${aPeak})`);
                grad.addColorStop(1,   `rgba(255,100,30,${(intensity * 0.6).toFixed(3)})`);
            }
            ctx.save();
            ctx.globalCompositeOperation = "screen";
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
    }

    if (props.debugOverlay) {
        debugEl.style.display = "block";
        const wMode = WEATHER_NAMES[weatherCurrent] || "?";
        debugEl.textContent =
            `fps=${avgFps.toFixed(0)}  display=${(1000 / vsyncMs).toFixed(0)}Hz  quality=${(perfQuality * 100).toFixed(0)}%  ` +
            `gpu=${glowGPU ? "on" : "off"}${treeGPU ? "+trees" : ""}  sim=${SIM_HZ}Hz  frame=${frame}  static=${staticDirty?"dirty":"clean"}` +
            `${frameErrors ? `  ERRORS=${frameErrors}` : ""}\n` +
            `burn=${burningCount}  smoke=${smokeParticles.length}  embers=${embers.length}  ` +
            `plumes=${flamePlumes.length}  rain=${rainDrops.length}\n` +
            `leaves=${leaves.length}  fireflies=${fireflies.length}  birds=${birds.length}  ` +
            `mood=${MOOD_NAMES[moodTarget]} fog=${atmo.fog.toFixed(2)} gale=${atmo.gale.toFixed(2)} gold=${atmo.gold.toFixed(2)} night=${atmo.night.toFixed(2)}  bolts=${lightningBolts.length}\n` +
            `weather=${wMode}  windDeg=${((windAngle * 180 / Math.PI) % 360).toFixed(0)}  ` +
            `cell=${cell}  grid=${cols}x${rows}`;
        debugEl.style.whiteSpace = "pre";
    } else {
        debugEl.style.display = "none";
    }
}

// ============================================================
// Loop (idles cheaply when nothing's happening)
// ============================================================
function loop(ts) {
    requestAnimationFrame(loop);

    const now = performance.now();

    // Learn the display refresh from the rAF timestamps (see vsyncMs). Snap down to
    // any clearly-faster gap; refine within the jitter band; ignore multiples (a
    // dropped frame) and long gaps (tab hidden / resumed). A gap only counts if our
    // own work left the frame mostly idle — otherwise it was set by OUR load, not the
    // display, and a slow-from-the-start scene would teach a falsely slow refresh.
    const ft = (typeof ts === "number") ? ts : now;
    if (lastRafTs > 0) {
        const d = ft - lastRafTs;
        if (d > 3 && d < 250 && lastWorkMs < d * 0.6) {
            if (d < vsyncMs * 0.8) vsyncMs = d;
            else if (d < vsyncMs * 1.25) vsyncMs += (d - vsyncMs) * 0.05;
        }
    }
    lastRafTs = ft;

    // FPS cap. Only meaningful when the cap is BELOW the refresh rate (otherwise vsync
    // already limits us). An accumulator keeps the average rate at the cap — the old
    // "skip until a full interval has passed" rule could only land on whole refresh
    // multiples, so 120 fps on a 144 Hz screen came out as 72. Sim time is decoupled,
    // so skipped frames don't change gameplay pacing.
    if (minFrameMs > 0 && minFrameMs > vsyncMs * 1.05) {
        if (ft < nextRenderMs - vsyncMs * 0.5) {
            if (lastSimMs === 0) lastSimMs = now;
            lastWorkMs = 0;                       // an idle frame — a clean refresh sample
            return;
        }
        nextRenderMs += minFrameMs;
        if (ft - nextRenderMs > minFrameMs) nextRenderMs = ft + minFrameMs;   // resync after a stall
    }
    renderTimeSec = now * 0.001;
    frame++;

    // FPS tracking (exponential moving average)
    if (lastFrameMs > 0) {
        const dt = now - lastFrameMs;
        if (dt > 0) avgFps = avgFps * 0.92 + (1000 / dt) * 0.08;
        renderDtSec = Math.min(0.1, Math.max(0.001, dt * 0.001));
    }
    lastFrameMs = now;

    // Governor: compare the smoothed frame time against the frame time we can
    // actually achieve — the slowest of the display refresh, the FPS cap, and 120 fps
    // (never trade quality just to chase 144/240 Hz on a wallpaper). Measuring
    // against the cap alone meant a 60 Hz screen with the default 120 cap looked
    // permanently "2× too slow" and ran fully shed. ratio ≤ 1.08 → full quality;
    // ≥ 1.5 → fully shed. Eased so detail changes are gradual and never oscillate.
    // Only active after warm-up so a cold first second doesn't trigger a needless dip.
    if (frame > 90) {
        // If no idle frame has ever revealed the refresh (heavy from the very first
        // frame), assume a 60 Hz display rather than "unknown = never shed".
        const refreshMs = vsyncMs < 500 ? vsyncMs : 1000 / 60;
        const targetMs = Math.max(refreshMs, minFrameMs, 1000 / 120);
        const ratio = (1000 / Math.max(1, avgFps)) / targetMs;
        let q = (1.5 - ratio) / 0.42;
        q = q < 0 ? 0 : (q > 1 ? 1 : q);
        perfQuality += (q - perfQuality) * 0.04;   // slow ease → stable, invisible
    }

    const isActive =
        burningCount > 0 ||
        smokeParticles.length > 0 ||
        embers.length > 0 ||
        flamePlumes.length > 0 ||
        sparks.length > 0 ||
        leaves.length > 0 ||
        lightningBolts.length > 0 ||
        lightningGlows.length > 0 ||
        birds.length > 0 ||
        fireflies.length > 0 ||
        (props.showFish && fishList.length > 0) ||
        rainDrops.length > 0 ||
        atmoBusy() ||
        weatherCurrent !== WEATHER_CLEAR ||
        weatherTarget  !== WEATHER_CLEAR ||
        weatherIntensitySmooth > 0.001 ||
        weatherFrontProgress > 0.001 ||
        props.weatherMode !== "clear" ||   // keep ticking so mode changes apply + auto-cycle runs
        rgbVignettePulse > 0 ||
        gustStrength > 0.01 ||
        audioLevel > 0.02 ||
        mouseInside ||
        props.autoIgnite ||
        (props.showWindParticles && windNow > 0.05);

    refreshWind();   // slider × weather, current for this frame's sim and render

    // Fixed-timestep simulation: 60 visual ticks/sec independent of render FPS.
    // Constants are scaled from the old 30Hz tuning so gameplay pacing stays intact.
    if (lastSimMs === 0) lastSimMs = now;
    if (isActive) {
        let iters = 0;
        while (now - lastSimMs >= SIM_TICK_MS && iters < MAX_SIM_PER_FRAME) {
            try { update(); } catch (e) { reportFrameError("update", e); }
            lastSimMs += SIM_TICK_MS;
            iters++;
        }
        // If we couldn't catch up (long pause/lag), snap to now to avoid death-spiral
        if (now - lastSimMs > SIM_TICK_MS * MAX_SIM_PER_FRAME * 2) {
            lastSimMs = now;
        }
        simAlpha = Math.max(0, Math.min(1, (now - lastSimMs) / SIM_TICK_MS));
    } else {
        lastSimMs = now; // stay in sync while idle so we don't burst on resume
        simAlpha = 1;
    }

    try { render(); }
    catch (e) {
        reportFrameError("render", e);
        // A throw after a ctx.save() leaves the state stack unbalanced — it would
        // grow every frame, with the transform/alpha/composite mode corrupted.
        // Re-assigning the size resets the context state (and the stack) completely.
        canvas.width = canvas.width;
    }
    lastWorkMs = performance.now() - now;
}

// Contain a per-frame exception instead of letting it break every frame after it:
// log the first few with their stack, then just count (the debug overlay shows it).
let frameErrors = 0;
function reportFrameError(where, e) {
    frameErrors++;
    if (frameErrors <= 3) console.error(`[forest-fire] ${where} threw (#${frameErrors}):`, e);
}

// ============================================================
// Input
// ============================================================
let mouseDown = false, rightDown = false;
function onIgniteInput(clientX, clientY) {
    if (!props.mouseInteraction) return;
    // map the screen cursor into world coordinates (CSS px → canvas px, then camera + zoom)
    igniteAt(camX + clientX * inputScale / viewZoom, camY + clientY * inputScale / viewZoom, props.igniteRadius);
}
function onDouseInput(clientX, clientY) {
    if (!props.mouseInteraction || !props.rightClickDouse) return;
    douseAt(camX + clientX * inputScale / viewZoom, camY + clientY * inputScale / viewZoom, Math.max(3, props.igniteRadius + 2));
}
canvas.addEventListener("mousedown",  e => {
    if (e.button === 2) { rightDown = true; onDouseInput(e.clientX, e.clientY); }
    else { mouseDown = true; onIgniteInput(e.clientX, e.clientY); }
});
canvas.addEventListener("mouseup",    () => { mouseDown = false; rightDown = false; });
canvas.addEventListener("contextmenu", e => { if (props.rightClickDouse) e.preventDefault(); });
canvas.addEventListener("mousemove",  e => {
    mouseX = e.clientX * inputScale; mouseY = e.clientY * inputScale; mouseInside = true;   // canvas px
    if (mouseDown) onIgniteInput(e.clientX, e.clientY);
    // right-hold rain is driven per sim-tick in update() (uses mouseX/Y), so the
    // shower follows the cursor whether it's moving or held still
});
// Scroll-wheel zoom — nudges the cell size (the "Zoom" property). Debounced so a
// fast scroll coalesces into one world rebuild instead of one per tick.
canvas.addEventListener("wheel", e => {
    if (!props.scrollZoom) return;
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;          // +1 = zoom in, -1 = zoom out
    const W = canvas.width, H = canvas.height;
    const Z_MAX = 3;
    // Can't zoom out past the point where the world stops covering the screen.
    const coverFloor = Math.max(W / worldPxW, H / worldPxH);
    const z0 = viewZoom;
    const z1 = +(z0 + dir * 0.5).toFixed(3);

    if (z1 <= Z_MAX && z1 >= coverFloor) {
        // ── Smooth VIEW zoom toward the cursor — world preserved, no regen ──
        const ex = e.clientX * inputScale, ey = e.clientY * inputScale;   // canvas px
        const fx = camX + ex / z0, fy = camY + ey / z0;              // world point under cursor
        viewZoom = z1;
        camX = fx - ex / z1;                                          // keep that point fixed
        camY = fy - ey / z1;
    } else {
        // ── Past the smooth buffer → regenerate one detail step (the old zoom
        //    behaviour: bigger cells in, smaller/lusher out). Apparent scale is
        //    preserved across the rebuild so the zoom keeps flowing the same way
        //    rather than snapping, then there's fresh buffer to keep scrolling.
        const newCell = Math.max(6, Math.min(24, props.cellSize + dir * 3));
        if (newCell === props.cellSize) {
            viewZoom = Math.max(coverFloor, Math.min(Z_MAX, z1));      // hit the cell limit → clamp
        } else {
            const apparent = z1 * props.cellSize;                     // scale the user is reaching for
            props.cellSize = newCell;
            rebuildGrid();
            drawDirtBackground();
            const cf2 = Math.max(W / worldPxW, H / worldPxH);
            viewZoom = Math.max(cf2, Math.min(Z_MAX, apparent / newCell));
        }
        // keep the same relative camera position across a regen (no corner jump)
        const mx = Math.max(0, worldPxW - W / viewZoom), my = Math.max(0, worldPxH - H / viewZoom);
        camX = props.panX * mx; camY = props.panY * my;
    }
    const maxX = Math.max(0, worldPxW - W / viewZoom), maxY = Math.max(0, worldPxH - H / viewZoom);
    camX = Math.max(0, Math.min(maxX, camX));
    camY = Math.max(0, Math.min(maxY, camY));
    props.panX = maxX > 0 ? camX / maxX : 0.5;                         // sync so panning eases from here
    props.panY = maxY > 0 ? camY / maxY : 0.5;
}, { passive: false });
canvas.addEventListener("mouseleave", () => { mouseInside = false; mouseDown = false; rightDown = false; });
canvas.addEventListener("mouseenter", e => { mouseInside = true; mouseX = e.clientX * inputScale; mouseY = e.clientY * inputScale; });
canvas.addEventListener("touchstart", e => { for (const t of e.touches) onIgniteInput(t.clientX, t.clientY); }, { passive: true });
canvas.addEventListener("touchmove",  e => { for (const t of e.touches) onIgniteInput(t.clientX, t.clientY); }, { passive: true });
// Every resize regenerates the world (~1 s at 4K), and browsers fire resize events
// in bursts — so debounce, skip no-op events (same size), and ignore a 0×0 viewport
// (wallpaper hidden / display asleep), which would otherwise throw away the world
// and any fire in progress, then rebuild it again on wake.
let resizeTimer = 0;
window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        const vp = viewportPx();
        if (vp.cw < 2 || vp.ch < 2) return;
        if (vp.w === canvas.width && vp.h === canvas.height) return;   // also catches DPI-only changes
        resize();
    }, 150);
});

// ============================================================
// Wallpaper Engine property listener
// ============================================================
// A malformed numeric value must not become NaN: it spreads silently through the sim
// (a NaN spread rate never ignites; NaN wind sends every particle to NaN coordinates
// for good). Keep the previous value instead.
function finiteOr(v, prev) {
    if (v === "" || v === null || typeof v === "boolean") return prev;   // Number() would make these 0/1
    const n = Number(v);
    return Number.isFinite(n) ? n : prev;
}

function applyProperty(key, raw) {
    if (raw == null) return;
    const v = raw.value;
    if (v === undefined) return;

    let needRebuild = false;
    let needBg = false;

    switch (key) {
        case "treeDensity":
        case "grassDensity":
        case "rockDensity":
            props[key] = finiteOr(v, props[key]);
            needRebuild = true;
            needBg = true;
            break;
        case "cellSize":
            props.cellSize = Math.max(1, parseInt(v, 10) || props.cellSize);
            needRebuild = true;
            needBg = true;
            break;
        case "hiDpiScale":
            props.hiDpiScale = !!v;
            needRebuild = true;
            needBg = true;
            break;
        case "igniteRadius":
            props.igniteRadius = Math.max(1, parseInt(v, 10) || props.igniteRadius);
            break;
        case "spreadRate":
        case "treeBurnDuration":
        case "grassBurnDuration":
        case "windStrength":
        case "windRotation":
        case "autoIgniteRate":
        case "regrowthRate":
        case "fireGlow":
        case "weatherChangeSpeed":
        case "rainIntensity":
        case "rainScatter":
        case "rgbEdgeStrength":
        case "audioIntensity":
        case "magicFire":
        case "panX":
        case "panY":
        case "panSpeed":
            props[key] = finiteOr(v, props[key]);
            break;
        case "treeScale":
            props.treeScale = finiteOr(v, props.treeScale);
            if (propBatch) propBatch.atlas = true;
            else { buildScaledTreeAtlas(); treeLayerCountdown = 0; }   // rebake the pre-scaled tree sizes
            break;
        case "worldSize":
            props.worldSize = Math.max(1, Number(v) || 1);
            if (propBatch) propBatch.resize = true;
            else resize();   // regenerate the (resized) world + camera bounds
            break;
        case "autoIgnite":
        case "regrowth":
        case "showSmoke":
        case "showEmbers":
        case "showFlamePlumes":
        case "heatShimmer":
        case "showWindParticles":
        case "showClouds":
        case "autoNight":
        case "rainExtinguishes":
        case "showBirds":
        case "showFireflies":
        case "showLeaves":
        case "showRocks":
        case "showElevation":
        case "rgbEdgeMode":
        case "screenEffects":
        case "mousePan":
        case "mouseInteraction":
        case "audioReactive":
        case "showMouseHint":
        case "windGusts":
        case "seedFireOnStart":
        case "rightClickDouse":
        case "scrollZoom":
        case "holdToPour":
        case "debugOverlay":
            props[key] = !!v;
            break;
        case "showFish":
            props.showFish = !!v;
            spawnFish();   // (re)populate or clear the fish
            break;
        case "showCritters":
            props.showCritters = !!v;
            spawnCritters();
            break;
        case "showInsects":
            props.showInsects = !!v;
            if (!v) insects.length = 0;
            break;
        case "showRivers":
        case "showLilyPads":
        case "showPaths":
            props[key] = !!v;
            needRebuild = true;
            needBg = true;
            break;
        case "season":
            props.season = String(v);
            break;
        case "seasonLength":
        case "snowAmount":
            props[key] = finiteOr(v, props[key]);
            break;
        case "weatherMode":
            props.weatherMode = String(v);
            break;
        case "weatherDirection":
            props.weatherDirection = String(v);
            break;
        case "quality":
            props.quality = String(v);
            resolveQuality();   // "auto" → GPU-matched tier; a real choice wins
            break;
        case "fpsCap":
            props.fpsCap = String(v);
            applyFpsCap(props.fpsCap);
            break;
        case "resetButton":
            if (v) { needRebuild = true; needBg = true; }
            break;
    }

    if (propBatch) { propBatch.rebuild = propBatch.rebuild || needRebuild; propBatch.bg = propBatch.bg || needBg; return; }
    if (needRebuild) rebuildGrid();
    if (needBg) drawDirtBackground();
}

// Wallpaper Engine delivers properties in batches — at start-up, ALL of them in one
// call. Each world-shaping property used to regenerate the whole world on its own
// (densities, zoom, DPI, rivers, lily pads, paths, map size): ~9 full rebuilds,
// ~8 s of frozen screen at 4K on every load. Collect them and regenerate ONCE.
let propBatch = null;
window.wallpaperPropertyListener = {
    applyUserProperties(properties) {
        propBatch = { rebuild: false, bg: false, resize: false, atlas: false };
        let b;
        try { for (const key in properties) applyProperty(key, properties[key]); }
        finally { b = propBatch; propBatch = null; }
        if (b.resize) resize();                      // resize() also rebuilds grid + background
        else {
            if (b.rebuild) rebuildGrid();            // (rebuildGrid re-bakes the tree atlas too)
            if (b.bg) drawDirtBackground();
            if (b.atlas && !b.rebuild) { buildScaledTreeAtlas(); treeLayerCountdown = 0; }
        }
    },
    applyGeneralProperties() { },
};

// ============================================================
// Wallpaper Engine audio reactivity
// API: window.wallpaperRegisterAudioListener(cb) where cb receives 64 floats (0..1)
// ============================================================
function audioCallback(audioArray) {
    if (!audioArray || !audioArray.length) return;
    let sum = 0, bass = 0;
    const bassN = Math.min(8, audioArray.length);
    for (let i = 0; i < audioArray.length; i++) sum += audioArray[i];
    for (let i = 0; i < bassN; i++) bass += audioArray[i];
    // Smooth (exponential moving average) so flicker is gentle
    const sFull = sum / audioArray.length;
    const sBass = bass / bassN;
    audioLevel = audioLevel * 0.78 + sFull * 0.22;
    audioBass  = audioBass  * 0.70 + sBass * 0.30;
}
if (typeof window.wallpaperRegisterAudioListener === "function") {
    window.wallpaperRegisterAudioListener(audioCallback);
}

// ============================================================
// Boot
// ============================================================
bootMs = performance.now();
applyQuality(props.quality);   // provisional (pre-GL) tier
applyFpsCap(props.fpsCap);
resize();                      // builds the GL context (and arms the starter fire)…
resolveQuality();              // …so "auto" can now read the GPU class
loop();
</script>
</body>
</html>
